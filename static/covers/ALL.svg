<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 213 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.35" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="213" height="300" fill="url(#bg)"/>
  <rect width="213" height="300" fill="url(#shine)"/>

  <!-- Pokeball -->
  <g transform="translate(106.5, 130)">
    <!-- Drop shadow -->
    <circle cx="3" cy="6" r="66" fill="#000" opacity="0.15"/>
    <!-- White bottom half -->
    <circle cx="0" cy="0" r="66" fill="#ffffff" stroke="#1f2937" stroke-width="5"/>
    <!-- Red top half -->
    <path d="M -66 0 A 66 66 0 0 1 66 0 Z" fill="#dc2626"/>
    <!-- Subtle highlight on red -->
    <ellipse cx="-25" cy="-35" rx="22" ry="9" fill="#ffffff" opacity="0.25"/>
    <!-- Black middle band -->
    <rect x="-66" y="-5" width="132" height="10" fill="#1f2937"/>
    <!-- Center button -->
    <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#1f2937" stroke-width="5"/>
    <circle cx="0" cy="0" r="7.5" fill="#f3f4f6" stroke="#1f2937" stroke-width="3"/>
  </g>

  <!-- Title -->
  <text x="106.5" y="235" font-size="26" font-weight="800" text-anchor="middle"
        fill="#ffffff" font-family="'PingFang TC','Microsoft JhengHei',system-ui,sans-serif"
        letter-spacing="2" style="paint-order:stroke;stroke:#1f2937;stroke-width:1.5;stroke-linejoin:round">全部卡牌</text>

  <!-- Subtitle: H · I · J -->
  <text x="106.5" y="268" font-size="15" font-weight="700" text-anchor="middle"
        fill="#ffffff" opacity="0.95" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace"
        letter-spacing="4">H &#183; I &#183; J</text>
</svg>
