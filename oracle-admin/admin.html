  .match-table th, .match-table td { padding: 14px 10px; font-size: 17px; white-space: nowrap; width: 1%; }

  .match-table th:nth-child(2), .match-table td:nth-child(2),
  .match-table th:nth-child(3), .match-table td:nth-child(3),
  .match-table th:nth-child(4), .match-table td:nth-child(4) { width: auto; white-space: normal; }

  .match-table .trunc-inner { max-width: 240px; }

// ── Card index loader (lazy, fetch from GitHub Pages canonical) ─────
// v4.91：改用 GitHub Pages 絕對 URL，避免 Oracle web/ 落後於主站 push 時
// 卡牌資料庫不同步（M5 卡顯示為 #50265 數字 ID 的 root cause）。
// GitHub Pages 在每次 git push 後自動 deploy，永遠是最新版本。
const CARDS_BASE = 'https://suenz001.github.io/ptcg-tw-sim/cards';
let cardInfoMap = {};
let cardCanonicalMap = new Map();  // v0.83: canonicalKey → [cardId, ...]（同名同效不同版本聚合）
let _cardLoadPromise = null;
// ⭐ v1.66 事故：牌組明細出現「#18594 × 2」「特殊紅牌 083 · 106/083」。
//   #18594 是 v6.116 補的重印、setCode「083」是 v6.117 修掉的舊值 ——
//   也就是這個分頁手上那份卡片索引是**卡牌資料庫更新以前**的快照。
//   三個放大器（全部修掉）：
//     (a) fetch 完全沒有 revalidate → 瀏覽器/CDN 可以餵舊檔
//     (b) `_cardLoadPromise` 是**分頁生命週期**快取 —— 後台分頁一開好幾天就永遠是舊的
//     (c) 逐包 `catch {}` 是空的 → 某一包沒載到完全無聲，只會看到一堆 #id
//   ⚠ 這不只是顯示問題：牌組明細的文字是**機器格式**，站長會複製去「匯入文字」，
//     舊的 setCode 會讓匯入端找不到卡而自動替代成別的版本。
const CARD_INDEX_TTL_MS = 10 * 60 * 1000;   // 超過就重新 revalidate（ETag 命中只花 header 流量）
let _cardLoadAt = 0;
let _cardIndexIssues = [];                   // 這次載入有問題的卡包（代號 + 原因）

// v0.83 canonical key：同名 + 同 supertype/subtype + 同 attacks + 同 abilities + 同 rulesText = 同一張卡
//   不同版本（不同 setCode/collectorNumber/art）會合併為同一個邏輯卡，避免統計重複計算同卡。
function computeCanonicalKey(c) {
  if (!c) return '';
  const attacksKey = (c.attacks || []).map(a =>
    `${a.name || ''}|${a.damage || ''}|${(a.effect || '').slice(0, 150)}`
  ).sort().join('||');
  const abilitiesKey = (c.abilities || []).map(a =>
    `${a.name || ''}|${(a.effect || '').slice(0, 150)}`
  ).sort().join('||');
  const rulesKey = (c.rulesText || '').slice(0, 150);
  // v0.93: name 先 strip 中英括號註解 (例「老大的指令（烏羽）」→「老大的指令」)
  //   讓不同插畫版同名同效卡合併到同一 canonical key.
  const baseName = (c.name || '').replace(/[（(][^）)]*[）)]/g, '').trim();
  return `${c.supertype || ''}|${c.subtype || ''}|${baseName}|A:${attacksKey}|B:${abilitiesKey}|R:${rulesKey}`;

async function _fetchCardJson(url, forceReload) {
  const res = await fetch(url, { cache: forceReload ? 'reload' : 'no-cache' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
async function ensureCardIndex() {

  if (_cardLoadPromise && (Date.now() - _cardLoadAt) < CARD_INDEX_TTL_MS) return _cardLoadPromise;

  _cardLoadPromise = (async () => {
    const issues = [];
    try {
      const sets = await _fetchCardJson(CARDS_BASE + '/index.json');
      const map = {};
      const canonicalMap = new Map();  // canonicalKey → [cardId, ...]（v0.83 同名同效合併）
      await Promise.all(sets.map(async (s) => {
        try {
          // ⭐ v1.66 對帳：index.json 宣告的 cardCount 與實際卡片數不符 ⇒ 這包是舊檔／半殘，
          //   強制 reload 重抓一次；仍不符就記進 issues 讓畫面說出來（不再靜默）。
          //   本次事故就是 M2 實際 80 張、宣告 116 張 —— 有這條一秒現形。
          let cards = await _fetchCardJson(CARDS_BASE + '/' + s.code + '.json');
          const want = s.cardCount ?? s.count;
          if (typeof want === 'number' && cards.length !== want) {
            cards = await _fetchCardJson(CARDS_BASE + '/' + s.code + '.json', true);
            if (cards.length !== want) {
              issues.push(s.code + '（宣告 ' + want + ' 張、實際 ' + cards.length + ' 張）');
            }
          }
          for (const c of cards) {
            // v0.83 擴充：加 supertype/subtype/pokemonType 供統計分群用 + 預計算 canonicalKey
            const canonicalKey = computeCanonicalKey(c);

            const displayName = (c.name || '').replace(/[（(][^）)]*[）)]/g, '').trim() || c.name;
            map[c.id] = {
              name: c.name,
              displayName,
              setCode: c.setCode || s.code,
              collectorNumber: c.collectorNumber || '',
              regulationMark: c.regulationMark || '',
              supertype: c.supertype || '',
              subtype: c.subtype || '',
              pokemonType: c.pokemonType || '',
              isAceSpec: !!(c.tags && c.tags.includes('ACE SPEC')),  // v1.03：ACE SPEC 整副 1 張上限用
              canonicalKey,
            };
            if (!canonicalMap.has(canonicalKey)) canonicalMap.set(canonicalKey, []);
            canonicalMap.get(canonicalKey).push(String(c.id));
          }
        } catch (e) {
          // ⚠ v1.66：原本是空的 `catch {}` —— 某一包沒載到，那包的卡片全部變成「#id」，
          //   而畫面上完全沒有任何線索。維持 per-set fail-open（其他包照載），但要留下紀錄。
          issues.push(s.code + '（載入失敗：' + (e && e.message ? e.message : e) + '）');
          console.error('[admin] card set load failed:', s.code, e);
        }
      }));

      //   舊 matchRecord / 玩家牌組可能存 JP cardId (50220-50300), v5.300 game 已 migrate but

      for (let jp = 50220; jp <= 50300; jp++) {
        const tw = String(jp - 31075);
        if (map[tw]) map[String(jp)] = map[tw];

    //   只有 password provider + 有 email 時才設，避免 anonymous 也設此 flag。
    if (user.email && user.providerData && user.providerData.some(p => p.providerId === 'password')) {

window.hardReloadAdmin = async function (btn) {
  if (btn) { btn.disabled = true; btn.textContent = '清除中…'; }
  try {
    if (typeof caches !== 'undefined' && caches.keys) {
      const keys = await caches.keys();
      await Promise.all(keys.map((k) => caches.delete(k)));
    }
  } catch (e) { console.warn('[admin] 清快取失敗（不影響重新載入）', e); }
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((r) => r.unregister()));
    }
  } catch (e) { /* 沒有 SW 就跳過 */ }
  // 加上時間戳 query 讓瀏覽器一定重新向伺服器要，而不是吃 HTTP 快取
  const u = new URL(window.location.href);

// ── API wrapper (Firebase ID token) ──────────────────────────────
let _forbiddenAlerted = false;  // v0.3: 只在第一次 403 跳 alert，避免連環彈窗
// v0.75: 閒置後 polling 偶有 stale idToken → server 回 403 'no email'。
//   修法：401/403 時先 force-refresh token 重試一次，只有 retry 後仍 403 才警報。
async function api(path, options = {}) {
  if (!currentUser) return { error: 'not logged in' };
  async function fetchWithToken(forceRefresh) {
    const idToken = await currentUser.getIdToken(forceRefresh);
    // ⚠v1.65 事故:送了 JSON 字串卻沒帶 Content-Type,express.json() **不會解析**,
    //   伺服器端 req.body 就是空的 —— 而且不會有任何錯誤,端點還照樣回 200。
    //   (實例:支援型寶可夢清單 POST 漏帶 header → 後端收到空 body → 把清單存成空陣列
    //    還回 ok:true → 使用者點了「沒反應」,查不出原因。)
    //   全站 20 個 POST 有 18 個各自手寫這個 header ＝ 遲早有人漏,在這裡統一補掉。
    //   ⚠只對「字串 body」自動補:FormData / Blob 必須讓瀏覽器自己決定 Content-Type
    //     (FormData 需要帶 boundary,手動指定會直接壞掉)。
    const autoHeaders = {};
    if (typeof options.body === 'string') autoHeaders['Content-Type'] = 'application/json';
    return fetch(path, {
      ...options,
      headers: {
        'Authorization': 'Bearer ' + idToken,
        ...autoHeaders,
        ...(options.headers || {}),
      },
    });
  }
  try {
    let res = await fetchWithToken(false);
    // v0.75: 401/403 → 先 force-refresh token 重試一次。
    //   stale token 場合 retry 會成功；若 user 真的 sign out / revoke → retry 也會 401/403。
    if (res.status === 401 || res.status === 403) {
      try {
        res = await fetchWithToken(true);
      } catch (refreshErr) {
        // force refresh 失敗（network 斷 / token revoked）— 走原 401/403 處理
        console.warn('[admin] token force-refresh failed:', refreshErr.message);
      }
    }
    if (res.status === 401 || res.status === 403) {
      const text = await res.text();
      console.error('Auth error', res.status, text, '(retried with force-refresh)');
      if (res.status === 403 && !_forbiddenAlerted) {
        _forbiddenAlerted = true;
        // v0.76: 把 token payload decode 出來，讓玩家截圖回報。
        //   常見原因：cross-tab 污染、anonymous user contamination、provider 沒 email claim。
        let tokenDebug = '';
        try {
          const tok = await currentUser.getIdToken(false);
          const parts = tok.split('.');
          if (parts.length === 3) {
            const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
            tokenDebug = '\n\n[Debug] Token claims：'
              + '\n  email: ' + (payload.email || '(none)')
              + '\n  uid: ' + (payload.user_id || payload.sub || '(none)')
              + '\n  provider: ' + (payload.firebase && payload.firebase.sign_in_provider || '(none)')
              + '\n  iat: ' + new Date((payload.iat || 0) * 1000).toLocaleString('zh-TW')
              + '\n  exp: ' + new Date((payload.exp || 0) * 1000).toLocaleString('zh-TW')
              + '\n  client currentUser.email: ' + (currentUser.email || '(none)')
              + '\n  client currentUser.uid: ' + (currentUser.uid || '(none)');
          }
        } catch (e) {
          tokenDebug = '\n\n[Debug] Token decode 失敗：' + e.message;
        }
        alert('您的 email (' + (currentUser.email || '?') + ') 不在 admin 白名單。\n\nServer 訊息：' + text + tokenDebug + '\n\n請聯絡管理員加入白名單，或登出後改用授權帳號登入。');
        // 403 表示 email 不對，直接登出避免後續一直叫
        await doLogout();
      }
      return { error: text };
    }
    if (!res.ok) {
      const text = await res.text();
      return { error: text };
    }
    return await res.json();
  } catch (err) {
    return { error: err.message };
  }
}

// 📈 賽事統計（v1.36）— 仿一般對戰「📊 統計」，專供錦標賽
//   資料源：/api/tournament/admin/stats → 賽事歸檔(TARCHIVE) + 名人堂(TCHAMPS)
//   全部在前端聚合：總覽 / 冠軍榜 / 玩家戰績 / 主力寶可夢使用率+勝率 / 歷屆賽事 / 賽果分佈
//   需先 ensureCardIndex + ensureCardTags（主力寶可夢偵測沿用 detectMainPokemon）
// ══════════════════════════════════════════════════════════════════════
let tournStatsLoading = false;
let tournStatsCache = null;
// ══ v6.240 賽事歸檔取得：伺服器端分頁，前端**逐頁累積成全量**再交給聚合 ══
//   ⚠ 為什麼一定要全量：這一頁的每一個數字（完成賽事／累計報名人次／不重複玩家／
//     對戰場數／冠軍榜／玩家戰績／主力寶可夢使用率／賽果分佈）都是前端拿整包 archives
//     算出來的。舊版伺服器的 limit(500) 不是「歷屆賽事表少列幾筆」，是**統計本身失真**。
//   ⚠ 只有這一份取得口徑（賽事統計分頁 + 奪冠報告圖共用），抄第二份必然漂移。
//   ⚠ 舊伺服器不認得 ?page= → 不會回 totalPages ⇒ 用它回的那一份收工（fail-open，
//     絕不無限迴圈）；也不會謊稱是全量（paged 哨兵會是 falsy）。
const TS_ARCHIVE_PAGE_SIZE = 200;
async function fetchAllTournamentStats(onProgress) {
  let page = 1, out = null;
  for (;;) {
    const d = await api('/api/tournament/admin/stats?page=' + page + '&pageSize=' + TS_ARCHIVE_PAGE_SIZE);
    if (!d || d.error) return d || { error: '讀不到賽事歸檔' };
    if (!out) out = { archives: [], champions: d.champions || [], total: d.total, totalPages: d.totalPages, paged: !!d.paged };
    const got = d.archives || [];
    out.archives = out.archives.concat(got);
    if (onProgress) onProgress(out.archives.length, (d.total != null ? d.total : out.archives.length));
    const tp = Number(d.totalPages);
    if (!Number.isFinite(tp) || page >= tp) break;   // 舊伺服器 / 最後一頁
    if (!got.length) break;                          // 保險：空頁一定停
    page++;
  }
  if (out.total == null) out.total = out.archives.length;
  return out;
}

    + b('下一頁 ›', v.page + 1, v.page === v.totalPages) + b('最後一頁 »', v.totalPages, v.page === v.totalPages)
    + '<span style="margin-left:.4rem;font-size:.85rem;color:#bbb;">跳至：</span>'
    + '<input id="tv-jump-' + id + '" type="number" min="1" max="' + v.totalPages + '" value="' + v.page + '" style="width:4.5rem;padding:.2rem .3rem;background:#ffffff;color:#1a2332;border:1px solid #d6dbe3;border-radius:4px;" onkeydown="if(event.key===\'Enter\')tvJump(\'' + id + '\')" />'
    + '<button class="ghost" onclick="tvJump(\'' + id + '\')">跳頁</button></div>';
}
/** 可排序的表頭 <th>（含目前排序方向箭頭）。 */
function tvTh(id, key, label, extra) {
  const tv = tableViews[id];
  const ar = tv && tv.sortKey === key ? (tv.sortDir === 'asc' ? ' ▲' : ' ▼') : '';
  return '<th class="sortable" onclick="tvSort(\'' + id + '\',\'' + key + '\')"' + (extra || '') + '>' + label + ar + '</th>';
}
/** 搜尋框。⚠必須放在 mount() 容器**之外**：tvSearch 每敲一鍵就重繪 mount，
 *  搜尋框若在裡面會被一起重建而失去輸入焦點。 */
function tvSearchBox(id, placeholder) {
  const tv = tableViews[id];
  return '<input class="search-box" id="tv-search-' + id + '" placeholder="' + (placeholder || '🔎 搜尋…')
    + '" value="' + escapeHtml((tv && tv.search) || '') + '" oninput="tvSearch(\'' + id + '\', this.value)"'
    + ' style="padding:6px 10px;min-width:260px;" />';
}
// ── window 接口（inline on* 只認得 window.*）──
window.tvSort = function (id, key) {
  const tv = tableViews[id];
  if (!tv) return;
  if (tv.sortKey === key) tv.sortDir = tv.sortDir === 'asc' ? 'desc' : 'asc';
  else { tv.sortKey = key; tv.sortDir = (tv.columns[key] && tv.columns[key].str) ? 'asc' : 'desc'; }
  tv.page = 1;                 // 換排序欄位 → 回第一頁
  tvRender(id);
};
window.tvPage = function (id, p) {           // ⭐只動頁碼 → 排序完全保持
  const tv = tableViews[id];
  if (!tv) return;
  tv.page = Math.max(1, parseInt(p, 10) || 1);
  tvRender(id);
};
window.tvSearch = function (id, q) {
  const tv = tableViews[id];
  if (!tv) return;
  tv.search = q || ''; tv.page = 1;
  tvRender(id);
};
window.tvJump = function (id) {
  const inp = document.getElementById('tv-jump-' + id);
  const p = parseInt(inp && inp.value, 10);
  if (Number.isFinite(p) && p >= 1) window.tvPage(id, p);
};
window.tvRender = tvRender;


/** 目前篩選的中文標籤（掛在區塊標題後，避免看數字時忘了正在篩選）。 */
function tsFilterLabel() {
  return tsEventFilter === 'official' ? ' <span class="small muted">（僅網站賽）</span>'
    : tsEventFilter === 'community' ? ' <span class="small muted">（僅社群自辦賽）</span>' : '';
}
function tsFilterBarHtml(nOfficial, nCommunity) {
  const btn = (f, label, n) => '<span class="filter-btn' + (tsEventFilter === f ? ' active' : '')
    + '" onclick="setTsEventFilter(\'' + f + '\')">' + label + ' (' + n + ')</span>';
  return '<div class="toolbar" style="margin:8px 0 12px;">'
    + btn('all', '全部賽事', nOfficial + nCommunity) + btn('official', '🏛️ 網站賽', nOfficial)
    + btn('community', '👥 社群自辦賽', nCommunity)
    + '<span class="small muted" style="margin-left:auto;">此選擇會同時套用到下方所有統計</span></div>';
}

// v1.60 網站賽 / 社群自辦賽 篩選。
//   ⚠ v6.110 更名：使用者可見文字一律「網站賽」（本站是非官方同好站，用「官方」會被誤會
//     成寶可夢官方）。**篩選值 'official' 與資料欄位 communityEvent 不動** —— 那是 API 契約。
//   刻意切在**聚合的入口單點**（而不是每張表各切一次）：這樣總覽、冠軍榜、玩家戰績、
//   歷屆賽事全部用同一份資料，數字彼此對得起來，日後也不會有某張表忘了跟著改的漂移。
//   ⚠v0.59 之前的歸檔沒有 communityEvent 欄位（undefined）→ 會被歸進「官方」。
//     早期本來就只有官方賽，這個歸類剛好正確，不是 bug，不必回填資料。
let tsEventFilter = 'all';   // all | official | community
window.setTsEventFilter = function (f) {
  if (f !== 'all' && f !== 'official' && f !== 'community') return;
  tsEventFilter = f;
  const el = document.getElementById('tab-tournament-stats');
  if (el && tournStatsCache) renderTournamentStats(el, tournStatsCache);
};

function renderTournamentStats(el, data) {
  const allArchives = (data && data.archives) || [];
  const archives = tsEventFilter === 'all' ? allArchives
    : allArchives.filter((a) => (tsEventFilter === 'community' ? !!a.communityEvent : !a.communityEvent));
  const _nOfficial = allArchives.filter((a) => !a.communityEvent).length;
  const _nCommunity = allArchives.length - _nOfficial;
  if (!archives.length) {
    el.innerHTML = '<h2>📈 賽事統計 <button class="refresh-btn" style="float:right;font-size:.8rem;" onclick="loadTournamentStats(true)">🔄 重新整理</button></h2>'
      + (allArchives.length ? tsFilterBarHtml(_nOfficial, _nCommunity) : '')
      + '<div class="empty">' + (allArchives.length
          ? '這個分類目前沒有已完成的賽事。'
          : '尚無已完成賽事的歸檔資料。賽事完賽（或管理員強制完賽）後會自動彙整到此。') + '</div>';
    return;
  }
  // 只算「真實對局」：雙方都有人、已結束、非輪空
  const isRealMatch = (m) => m.status === 'done' && !m.bye && m.p1uid && m.p2uid;

  // ── 聚合容器（以 email 為身分基礎；暱稱會變但 email 不會。顯示名＝最後一次參賽的暱稱）──
  let totalEntries = 0;                 // 累計報名人次
  const uniquePlayers = new Set();      // 不重複玩家（依 email）
  let totalRealMatches = 0;             // 真實對局數
  const pmap = {};                      // key(email) → 玩家戰績
  const pkUse = {};                     // 主力寶可夢 → { use, wins, losses }
  const outcome = { normal: 0, forfeit: 0, idleForfeit: 0, noShow: 0, doubleNoShow: 0, timeLimit: 0, bye: 0, adminResolved: 0 };
  const keyOf = (uid, email) => email ? ('email:' + email) : ('uid:' + (uid || '?'));
  const ensureP = (key, email, name, ts) => {
    if (!key) return null;
    if (!pmap[key]) pmap[key] = { key: key, email: email || '', name: name || '?', events: 0, wins: 0, losses: 0, titles: 0, lastSeen: -1 };
    const r = pmap[key];
    if (email && !r.email) r.email = email;
    if (name && ts != null && ts >= r.lastSeen) { r.name = name; r.lastSeen = ts; }  // 取最後一次參賽的暱稱為顯示名
    return r;
  };
  const ensurePk = (nm) => { if (!pkUse[nm]) pkUse[nm] = { use: 0, wins: 0, losses: 0 }; return pkUse[nm]; };

  archives.forEach((a) => {
    totalEntries += (a.players || []).length;
    const ts = a.finishedAt || a.startedAt || a.createdAt || 0;
    const uidMain = {};                 // 此賽事 uid → 主力寶可夢名
    const uidInfo = {};                 // 此賽事 uid → { email, name, key }
    (a.players || []).forEach((p) => {
      const email = p.email || '';
      const key = keyOf(p.uid, email);
      uidInfo[p.uid] = { email: email, name: p.name, key: key };
      uniquePlayers.add(key);
      const rec = ensureP(key, email, p.name, ts); if (rec) rec.events++;
      const main = detectMainPokemon({ deckEntries: p.deckEntries || [] }) || '（未知牌型）';
      uidMain[p.uid] = main;
      ensurePk(main).use++;             // 報名一次＝該主力使用 +1
    });
    if (a.championUid) {
      const ci = uidInfo[a.championUid];
      const rec = ensureP(ci ? ci.key : keyOf(a.championUid, ''), ci && ci.email, a.championName, ts);
      if (rec) rec.titles++;
    }
    (a.matches || []).forEach((m) => {
      // 賽果分佈（互斥優先序）
      if (m.bye) outcome.bye++;
      else if (m.deadlockDraw) { outcome.deadlockDraw = (outcome.deadlockDraw || 0) + 1; }
      else if (m.doubleNoShow) outcome.doubleNoShow++;
      else if (m.adminResolved) outcome.adminResolved++;
      else if (m.idleForfeit) outcome.idleForfeit++;
      else if (m.forfeit) outcome.forfeit++;
      else if (m.noShow) outcome.noShow++;
      else if (m.timeLimit) outcome.timeLimit++;
      else if (m.status === 'done') outcome.normal++;
      // 勝負（玩家依 email + 主力寶可夢）
      if (isRealMatch(m) && m.winnerUid) {  // v1.51：雙敗(無winner)場不計勝負
        totalRealMatches++;
        const wUid = m.winnerUid;
        const isP1Win = (m.p1uid === wUid);
        const lUid = isP1Win ? m.p2uid : m.p1uid;
        const wName = m.winnerName;
        const lName = isP1Win ? m.p2name : m.p1name;
        const wInfo = uidInfo[wUid], lInfo = uidInfo[lUid];
        const w = ensureP(wInfo ? wInfo.key : keyOf(wUid, ''), wInfo && wInfo.email, wName, ts); if (w) w.wins++;
        const l = ensureP(lInfo ? lInfo.key : keyOf(lUid, ''), lInfo && lInfo.email, lName, ts); if (l) l.losses++;
        const wPk = uidMain[wUid], lPk = uidMain[lUid];
        if (wPk) ensurePk(wPk).wins++;
        if (lPk) ensurePk(lPk).losses++;
      }
    });
  });

  const totalEvents = archives.length;
  const avgPlayers = totalEvents ? (totalEntries / totalEvents) : 0;

  // ── 1. 賽事總覽 ──
  let html = '<h2>📈 賽事統計 <button class="refresh-btn" style="float:right;font-size:.8rem;" onclick="loadTournamentStats(true)">🔄 重新整理</button></h2>';
  html += tsFilterBarHtml(_nOfficial, _nCommunity);
  html += '<section class="stats-section"><h3>📊 1. 賽事總覽' + tsFilterLabel() + '</h3><div class="stats-grid">'
    + '<div class="stat-card"><div class="stat-label">完成賽事</div><div class="stat-value">' + totalEvents + '</div></div>'
    + '<div class="stat-card"><div class="stat-label">累計報名人次</div><div class="stat-value">' + totalEntries + '</div></div>'
    + '<div class="stat-card"><div class="stat-label">不重複玩家</div><div class="stat-value">' + uniquePlayers.size + '</div></div>'
    + '<div class="stat-card"><div class="stat-label">對戰場數</div><div class="stat-value">' + totalRealMatches + '</div></div>'
    + '<div class="stat-card"><div class="stat-label">平均每場人數</div><div class="stat-value">' + avgPlayers.toFixed(1) + '</div></div>'
    + '</div></section>';

  // ── 2. 冠軍榜（奪冠次數）──
  const champRank = Object.values(pmap).filter((p) => p.titles > 0).sort((a, b) => b.titles - a.titles || b.wins - a.wins);
  html += '<section class="stats-section"><h3>🏆 2. 冠軍榜（奪冠次數）' + tsFilterLabel() + '</h3>';
  if (!champRank.length) html += '<div class="empty">尚無冠軍紀錄。</div>';
  else {
    html += '<table class="data-table" style="font-size:.9rem;"><thead><tr><th>#</th><th class="sortable" onclick="_tsSortTable(this)">玩家</th><th class="sortable" onclick="_tsSortTable(this)">Email</th><th class="sortable" onclick="_tsSortTable(this)">奪冠</th><th class="sortable" onclick="_tsSortTable(this)">參賽</th><th class="sortable" onclick="_tsSortTable(this)">戰績</th><th class="sortable" onclick="_tsSortTable(this)">勝率</th></tr></thead><tbody>';
    champRank.forEach((p, i) => {
      html += '<tr><td>' + (i + 1) + '</td><td>' + escapeHtml(p.name) + '</td><td class="small muted">' + playerLink(p.email) + '</td><td><b>' + p.titles + '</b> 🏆</td><td>' + p.events
        + '</td><td>' + p.wins + ' 勝 ' + p.losses + ' 負</td><td>' + _tsPct(p.wins, p.losses) + '%</td></tr>';
    });
    html += '</tbody></table>';
  }
  html += '</section>';

  // ── 3. 玩家戰績排行（依勝場）──
  const playerRank = Object.values(pmap).sort((a, b) => b.wins - a.wins || _tsPct(b.wins, b.losses) - _tsPct(a.wins, a.losses));
  // v1.60 改走中央 tv 管線（每頁 50 筆＋排序後翻頁不會被打回原序）。
  //   搜尋框刻意放在 mount 容器**外**，否則每敲一鍵重繪就會失去輸入焦點。
  html += '<section class="stats-section"><h3>🎯 3. 玩家戰績排行 <span class="small muted">（只計雙方都到場的真實對局，不含輪空）</span></h3>';
  html += '<div style="margin-bottom:8px;">' + tvSearchBox('tsPlayerRank', '🔎 搜尋玩家 / email…') + '</div>';
  html += '<div id="tv-mount-tsPlayerRank"></div></section>';

  // ── 4. 主力寶可夢使用率 + 勝率 ──
  const pkRank = Object.keys(pkUse).map((nm) => ({ name: nm, ...pkUse[nm] })).sort((a, b) => b.use - a.use || b.wins - a.wins);
  html += '<section class="stats-section"><h3>⚔️ 4. 主力寶可夢使用率 <span class="small muted">（依牌組推測主力打手；勝率只計真實對局）</span></h3>';
  html += '<div style="margin-bottom:8px;">' + tvSearchBox('tsPkRank', '🔎 搜尋寶可夢…') + '</div>';
  html += '<div id="tv-mount-tsPkRank"></div></section>';

  // ── 5. 歷屆賽事 ──
  // v6.240：標出總場數，讓站長一眼看得出「有沒有被截斷」（舊版永遠停在 500）。
  html += '<section class="stats-section"><h3>📋 5. 歷屆賽事 <span class="small muted">（歸檔共 '
    + Number((data && data.total != null) ? data.total : allArchives.length).toLocaleString()
    + ' 場，已全部載入；上方所有統計都是用全量算的）</span></h3>';
  html += '<div style="margin-bottom:8px;">' + tvSearchBox('tsArchives', '🔎 搜尋賽事名稱 / 冠軍…') + '</div>';
  html += '<div id="tv-mount-tsArchives"></div></section>';

  // ── 6. 賽果分佈 ──
  const oTotal = Object.values(outcome).reduce((s, v) => s + v, 0);
  const oRow = (label, n, hint) => {
    if (!n) return '';
    const pct = oTotal ? Math.round(n / oTotal * 100) : 0;
    return '<tr><td>' + label + '</td><td>' + n + '</td><td>' + pct + '%</td><td class="small muted">' + (hint || '') + '</td></tr>';
  };
  html += '<section class="stats-section"><h3>🔚 6. 賽果分佈 <span class="small muted">（全部對局，含輪空與判負）</span></h3>';
  html += '<table class="data-table" style="font-size:.9rem;"><thead><tr><th class="sortable" onclick="_tsSortTable(this)">結束方式</th><th class="sortable" onclick="_tsSortTable(this)">場數</th><th class="sortable" onclick="_tsSortTable(this)">占比</th><th></th></tr></thead><tbody>';
  html += oRow('✅ 正常對戰分勝負', outcome.normal, '雙方打到遊戲結束');
  html += oRow('🏳️ 投降判負', outcome.forfeit, '一方主動投降');
  html += oRow('⏰ 閒置判負', outcome.idleForfeit, '3 分鐘無動作');
  html += oRow('🚫 未進場判負', outcome.noShow, '一方逾時未進場');
  html += oRow('⌛ 時限判負', outcome.timeLimit, '對局超時');
  html += oRow('💤 雙方未進場', outcome.doubleNoShow, '雙方皆逾時');
  html += oRow('🛠️ 管理員裁定', outcome.adminResolved, '人工強制裁定');
  html += oRow('➖ 輪空晉級', outcome.bye, '人數不足自動晉級');
  html += '</tbody></table></section>';

  el.innerHTML = html;

  // ══ v1.60 三張大表交給中央 tv 管線（每頁 50 筆；排序 → 翻頁不會被打回原序）══
  //   注意：一定要在 el.innerHTML 之後才註冊/餵資料，因為 mount() 要找得到剛寫進去的佔位 div。
  tvDefine({
    id: 'tsPlayerRank',
    columns: {
      name: { get: (r) => r.name, str: true }, email: { get: (r) => r.email || '', str: true },
      events: { get: (r) => r.events }, wins: { get: (r) => r.wins }, losses: { get: (r) => r.losses },
      rate: { get: (r) => _tsPct(r.wins, r.losses) }, titles: { get: (r) => r.titles || 0 },
    },
    defaultSort: ['wins', 'desc'],
    searchText: (r) => ((r.name || '') + ' ' + (r.email || '')).toLowerCase(),
    mount: () => document.getElementById('tv-mount-tsPlayerRank'),
    render: (v) => '<table class="data-table" style="font-size:.9rem;"><thead><tr><th>#</th>'
      + tvTh('tsPlayerRank', 'name', '玩家') + tvTh('tsPlayerRank', 'email', 'Email') + tvTh('tsPlayerRank', 'events', '參賽')
      + tvTh('tsPlayerRank', 'wins', '勝') + tvTh('tsPlayerRank', 'losses', '負') + tvTh('tsPlayerRank', 'rate', '勝率')
      + tvTh('tsPlayerRank', 'titles', '奪冠') + '</tr></thead><tbody>'
      + v.pageRows.map((p, i) => '<tr><td>' + (v.startIndex + i + 1) + '</td><td>' + escapeHtml(p.name)
        + '</td><td class="small muted">' + playerLink(p.email) + '</td><td>' + p.events + '</td><td>' + p.wins
        + '</td><td>' + p.losses + '</td><td>' + _tsPct(p.wins, p.losses) + '%</td><td>'
        + (p.titles ? (p.titles + ' 🏆') : '—') + '</td></tr>').join('')
      + '</tbody></table>',
  });
  tvSetRows('tsPlayerRank', playerRank);

  tvDefine({
    id: 'tsPkRank',
    columns: {
      name: { get: (r) => r.name, str: true }, use: { get: (r) => r.use },
      usePct: { get: (r) => (totalEntries ? r.use / totalEntries : 0) },
      wins: { get: (r) => r.wins }, rate: { get: (r) => _tsPct(r.wins, r.losses) },
    },
    defaultSort: ['use', 'desc'],
    searchText: (r) => String(r.name || '').toLowerCase(),
    mount: () => document.getElementById('tv-mount-tsPkRank'),
    render: (v) => '<table class="data-table" style="font-size:.9rem;"><thead><tr><th>#</th>'
      + tvTh('tsPkRank', 'name', '主力寶可夢') + tvTh('tsPkRank', 'use', '使用次數') + tvTh('tsPkRank', 'usePct', '使用率')
      + tvTh('tsPkRank', 'wins', '戰績') + tvTh('tsPkRank', 'rate', '勝率') + '</tr></thead><tbody>'
      + v.pageRows.map((p, i) => '<tr><td>' + (v.startIndex + i + 1) + '</td><td>' + escapeHtml(p.name) + '</td><td>' + p.use
        + '</td><td>' + (totalEntries ? Math.round(p.use / totalEntries * 100) : 0) + '%</td><td>' + p.wins + ' 勝 ' + p.losses
        + ' 負</td><td>' + _tsPct(p.wins, p.losses) + '%</td></tr>').join('')
      + '</tbody></table>',
  });
  tvSetRows('tsPkRank', pkRank);

  tvDefine({
    id: 'tsArchives',
    columns: {
      finishedAt: { get: (r) => r.finishedAt || 0 },
      dur: { get: (r) => ((r.finishedAt && (r.startedAt || r.createdAt)) ? (r.finishedAt - (r.startedAt || r.createdAt)) : 0) },
      name: { get: (r) => r.eventName || '', str: true },
      players: { get: (r) => (r.playerCount || (r.players || []).length) },
      champ: { get: (r) => r.championName || '', str: true },
    },
    defaultSort: ['finishedAt', 'desc'],
    searchText: (r) => ((r.eventName || '') + ' ' + (r.championName || '')).toLowerCase(),
    mount: () => document.getElementById('tv-mount-tsArchives'),
    render: (v) => '<table class="data-table" style="font-size:.9rem;"><thead><tr>'
      + tvTh('tsArchives', 'finishedAt', '完賽時間') + tvTh('tsArchives', 'dur', '耗時') + tvTh('tsArchives', 'name', '賽事名稱')
      + tvTh('tsArchives', 'players', '人數') + tvTh('tsArchives', 'champ', '冠軍') + '<th>冠軍牌型</th><th></th></tr></thead><tbody>'
      + v.pageRows.map((a) => {
        const champRec = (a.players || []).find((p) => p.uid === a.championUid);
        const champMain = champRec ? (detectMainPokemon({ deckEntries: champRec.deckEntries || [] }) || (champRec.deckName || '—')) : '—';
        const dur = (a.finishedAt && (a.startedAt || a.createdAt)) ? (a.finishedAt - (a.startedAt || a.createdAt)) : 0;
        return '<tr><td>' + _tsFmtDateTime(a.finishedAt) + '</td><td>' + _tsFmtDuration(dur) + '</td>'
          + '<td><button onclick="tevShowBracket(\'' + encodeURIComponent(a.eventId) + '\')" style="background:none;border:none;color:#7fd0ff;text-decoration:underline;cursor:pointer;padding:0;font-size:.9rem;" title="點看賽程與回放">' + escapeHtml(a.eventName || '錦標賽') + '</button></td>'
          + '<td>' + (a.playerCount || (a.players || []).length) + '</td>'
          + '<td>' + (a.championName ? escapeHtml(a.championName) + ' 🏆' : '—') + '</td><td>' + escapeHtml(champMain) + '</td>'

window.switchTab = function(name) {
  currentTab = name;
  if (name === 'oracle-rooms') statusFilter = 'playing'; // v1.41 點「Oracle 對戰」分頁預設只載「進行中」(server 只查 playing 房→快很多)；要看全部再按「全部」

  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = c.id === 'tab-' + name ? 'block' : 'none');

window.loadActive = function(forceRefresh = false) {
  let p;
  if (currentTab === 'overview') p = loadOverview();
  else if (currentTab === 'oracle-rooms') p = loadOracleRooms();
  else if (currentTab === 'firebase-rooms') p = loadFirebaseRooms();
  else if (currentTab === 'users') p = loadUsers(forceRefresh);  // v0.21: 切 tab 用 cache，按 Refresh 才 reset
  else if (currentTab === 'feedback') p = loadFeedback();
  else if (currentTab === 'matches') p = loadMatchRecords(forceRefresh);  // v0.80: 對戰歷史
  else if (currentTab === 'stats') p = loadStats(forceRefresh);  // v0.83: Phase 2a 統計
  else if (currentTab === 'broadcast') p = loadBroadcastAdmin();  // v1.17 系統廣播設定
  else if (currentTab === 'deck-rules') p = loadDeckRules();  // v1.51 牌組原型規則
  else if (currentTab === 'changelog') p = loadChangelogAdmin();  // 首頁更新記錄編輯
  else if (currentTab === 'tournament') p = loadTournamentAdmin();  // 錦標賽管理
  else if (currentTab === 'tournament-stats') p = loadTournamentStats(forceRefresh);  // 賽事統計
  else if (currentTab === 'monitor') p = loadMonitor();  // v1.67 對戰連線監控
  document.getElementById('last-update').textContent = 'Updated: ' + new Date().toLocaleTimeString('zh-TW');
  return p;
};
// v1.16：手動 Refresh — 按鈕顯示「更新中…」直到該頁載入完成，給明確回饋
//   （解決部分頁如「Oracle 對戰」按 Refresh 像沒反應的問題）。
window.manualRefresh = async function(btn) {
  const orig = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '🔄 更新中…'; }
  try { await loadActive(true); }
  finally { if (btn) { btn.disabled = false; btn.textContent = orig; } }
};

// v0.92: Firestore 寫入 audit — 列各 collection 過去 1h / 24h 新增/更新 doc 數
window.runFirestoreAudit = async function() {
  const el = document.getElementById('write-audit-result');
  if (!el) return;
  el.innerHTML = '<div class="empty">執行中…（約 5-15 秒）</div>';
  const data = await api('/api/admin/firestore-write-audit');
  if (!data || data.error) { el.innerHTML = '<div class="empty">Error: ' + (data?.error || 'unknown') + '</div>'; return; }
  const fmt = (v) => {
    if (v === null || v === undefined) return '-';
    if (typeof v === 'object' && v.error) return '<span style="color:#a44" title="' + v.error.replace(/"/g, '&quot;') + '">err</span>';
    if (typeof v === 'number') return v.toLocaleString();
    return v;
  };
  const rows = data.results.map(r => `
    <tr>
      <td><b>${r.collection}</b></td>
      <td>${fmt(r.total)}</td>
      <td>${fmt(r.createdAt_1h)}</td>
      <td>${fmt(r.createdAt_24h)}</td>
      <td>${fmt(r.updatedAt_1h)}</td>
      <td>${fmt(r.updatedAt_24h)}</td>
    </tr>
  `).join('');
  el.innerHTML = `
    <p class="small" style="color:#888">at ${new Date(data.at).toLocaleString('zh-TW')} · 排序：過去 1h 寫入最多在前</p>
    <table class="data-table" style="font-size:0.85rem">
      <thead>
        <tr>
          <th>Collection</th>
          <th>Total docs</th>
          <th>createdAt &gt; 1h</th>
          <th>createdAt &gt; 24h</th>
          <th>updatedAt &gt; 1h</th>
          <th>updatedAt &gt; 24h</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <p class="small" style="color:#888;margin-top:0.5rem">提示：1h 寫入 &gt; 100 的 collection 即元兇。createdAt 計新建、updatedAt 計更新；某 collection 缺對應 timestamp 欄位顯示「err」。</p>
  `;
};

//   並預設只看近 7 天；要看更久按 30/90 天或「全部資料」（一樣走分頁，不會當）。
let oracleRoomsRange = '7d';     // '7d' | '30d' | '90d' | 'all'
let oracleRoomsSearch = '';      // 送到伺服器的關鍵字（分頁後本機搜尋只搜得到當前這頁）
let oracleRoomsSrv = null;       // 伺服器回的 { total, page, pageSize, totalPages }；null＝舊伺服器

//   firebaseRoomsSrv = { cap, truncated, matchedTotal, orderedBy, msgCounts }；
//   null ＝ 舊伺服器（沒有 capped 哨兵）⇒ 行為與 v6.271 逐字相同，也不會亂標「被截斷」。
let firebaseRoomsSrv = null;
let firebaseRoomsMsgCounts = false;   // 💬 訊息數要多花「每房 1 次」Firestore 讀取 ⇒ 預設關
let _oracleSearchTimer = null;
let _oracleSearchFocus = false;  // 伺服器端搜尋是整塊重繪 → 要把游標接回搜尋框
async function loadOracleRooms() {
  primeEmailMap();  // v0.5 不 await：背景預熱 email map
  const el = document.getElementById('tab-oracle-rooms');
  if (!oracleRoomsCache.length) el.innerHTML = '<h2>🎮 Oracle 對戰</h2><div class="empty">Loading…</div>';
  // v1.18: 只抓「當前 status 分頁」的房間（如停在「進行中」按 Refresh 不再撈全部已結束房 → 快很多）。
  // v6.240: 再加上 page/pageSize/range/q —— 伺服器端分頁，一次只回 50 筆。
  const _p = new URLSearchParams();
  if (statusFilter && statusFilter !== 'all') _p.set('status', statusFilter);
  _p.set('range', oracleRoomsRange);
  _p.set('page', String(oracleRoomsPage));
  _p.set('pageSize', String(ROOMS_PAGE_SIZE));
  if (oracleRoomsSearch) _p.set('q', oracleRoomsSearch);
  // v1.20: 只 await 房間（status 過濾，快）→ 立即渲染，恢復 v1.18 的快速 refresh。
  //   卡片索引/標籤改「背景載入」，好了再重畫補上主力打手 badge（已快取則 .then 立即跑、badge 同步出現）。
  const data = await api('/api/admin/oracle/rooms?' + _p.toString());
  if (!data || data.error) { el.innerHTML = '<div class="empty">Error: ' + (data?.error || 'unknown') + '</div>'; return; }
  oracleRoomsCache = data.rooms;
  if (data.counts) oracleRoomsCounts = data.counts;  // 三狀態計數，toolbar 用
  // ⚠ paged 哨兵：舊伺服器不會回它 → 退回 v6.239 的前端切頁（行為不變），
  //   而不是靜默把「伺服器只回的一頁」當成全部。
  oracleRoomsSrv = data.paged ? { total: data.total, page: data.page, pageSize: data.pageSize, totalPages: data.totalPages } : null;
  if (oracleRoomsSrv) oracleRoomsPage = oracleRoomsSrv.page;
  renderRoomsTab(el, 'oracle', oracleRoomsCache);
  _restoreOracleSearchFocus();
  Promise.all([ensureCardIndex(), ensureCardTags()]).then(() => {
    if (currentTab === 'oracle-rooms') { renderRoomsTab(el, 'oracle', oracleRoomsCache); _restoreOracleSearchFocus(); } // v1.74：補退路 ⚔️ badge 與主力打手搜尋索引（原型欄位缺席時才用）
  });
}
function _restoreOracleSearchFocus() {
  if (!_oracleSearchFocus) return;
  const si = document.getElementById('rooms-search-oracle');
  if (!si) return;
  si.focus();
  try { si.setSelectionRange(si.value.length, si.value.length); } catch (e) { /* number/未支援型別 */ }
}

async function loadFirebaseRooms() {
  primeEmailMap();  // v0.5 不 await：背景預熱 email map
  const el = document.getElementById('tab-firebase-rooms');
  if (!firebaseRoomsCache.length) el.innerHTML = '<h2>🔥 Firebase 對戰</h2><div class="empty">Loading…</div>';
  // v1.18: 只抓當前 status 分頁的房間（同 Oracle，加速）。
  // v6.272: 伺服器端已經有上限了；這裡把 msgCounts 開關送出去（預設不送＝不算訊息數）。
  const _fp = new URLSearchParams();
  if (statusFilter && statusFilter !== 'all') _fp.set('status', statusFilter);
  if (firebaseRoomsMsgCounts) _fp.set('msgCounts', '1');
  const qs = _fp.toString() ? ('?' + _fp.toString()) : '';
  // v1.20: 只 await 房間 → 立即渲染（快），卡片索引/標籤背景載入後補 badge。
  const data = await api('/api/admin/firebase/rooms' + qs);
  if (!data || data.error) { el.innerHTML = '<div class="empty">Error: ' + (data?.error || 'unknown') + '</div>'; return; }
  firebaseRoomsCache = data.rooms;
  if (data.counts) firebaseRoomsCounts = data.counts;
  // ⚠ capped 哨兵：舊伺服器不會有它 → 維持 null（不標示截斷，行為與 v6.271 相同）；
  //   新伺服器一律標示「這不是全部」，絕不讓站長以為看到的是全量（v6.240 同一條紀律）。
  firebaseRoomsSrv = data.capped ? {
    cap: data.cap, truncated: !!data.truncated, matchedTotal: data.matchedTotal,
    orderedBy: data.orderedBy, msgCounts: !!data.msgCounts,
  } : null;
  renderRoomsTab(el, 'firebase', firebaseRoomsCache);
  Promise.all([ensureCardIndex(), ensureCardTags()]).then(() => {
    if (currentTab === 'firebase-rooms') renderRoomsTab(el, 'firebase', firebaseRoomsCache);
  });
}

function renderRoomsTab(el, source, rooms) {
  // v1.18: counts 改用 server 回的全量計數（rooms 現在可能只含當前 status 子集，不能從 rooms 數）。
  //   server 計數不在時（舊 server / all 模式）退回從 rooms 自算。
  const _srvCounts = source === 'oracle' ? oracleRoomsCounts : firebaseRoomsCounts;
  let counts;
  if (_srvCounts) { counts = _srvCounts; }
  else { counts = { lobby: 0, playing: 0, ended: 0 }; for (const r of rooms) counts[r.status] = (counts[r.status] || 0) + 1; }
  const totalCount = (counts.lobby || 0) + (counts.playing || 0) + (counts.ended || 0);
  const sourceLabel = source === 'oracle' ? '🎮 Oracle 對戰' : '🔥 Firebase 對戰';
  // v0.90: Firebase rooms 也可刪 — 解決 zombie ended 房無法清理問題
  const showDelete = true;
  // v6.240: Oracle 走伺服器端分頁（srv 非 null）——伺服器已經只回一頁，
  //   這裡**絕不可以**再 filter/slice（那會把已經正確的一頁又切掉）。
  //   Firebase 分頁與舊伺服器維持 v5.276 的前端切頁，行為逐字不變。
  const srv = (source === 'oracle') ? oracleRoomsSrv : null;
  let totalRows, totalPages, page, start, pageRooms;
  if (srv) {
    totalRows = srv.total; totalPages = Math.max(1, srv.totalPages);
    page = Math.min(Math.max(1, srv.page), totalPages);
    oracleRoomsPage = page;
    start = (page - 1) * (srv.pageSize || ROOMS_PAGE_SIZE);
    pageRooms = rooms;
  } else {
    const filtered = statusFilter === 'all' ? rooms : rooms.filter(r => r.status === statusFilter);
    // v5.276: 翻頁 — 50 筆/頁
    totalRows = filtered.length;
    totalPages = Math.max(1, Math.ceil(filtered.length / ROOMS_PAGE_SIZE));
    const curPage = source === 'oracle' ? oracleRoomsPage : firebaseRoomsPage;
    page = Math.min(Math.max(1, curPage), totalPages);
    if (source === 'oracle') oracleRoomsPage = page; else firebaseRoomsPage = page;
    start = (page - 1) * ROOMS_PAGE_SIZE;
    pageRooms = filtered.slice(start, start + ROOMS_PAGE_SIZE);
  }
  // v6.272 Firebase 專屬提示列：伺服器端上限、排序依據、訊息數開關。
  //   ⚠⚠ 這一塊存在的唯一理由是「絕不靜默截斷」—— 站長必須看得出來畫面上不是全部。
  const fsrv = (source === 'firebase') ? firebaseRoomsSrv : null;
  let fbNoticeHtml = '';
  if (fsrv) {
    const shown = rooms.length;
    const parts = [];
    if (fsrv.truncated) {
      parts.push('<b style="color:#b45309">⚠ 只顯示最新 ' + Number(shown).toLocaleString() + ' 筆'
        + (fsrv.matchedTotal != null ? ('（此篩選共 ' + Number(fsrv.matchedTotal).toLocaleString() + ' 筆）') : '')
        + '，這不是全部。</b>');
    } else {
      parts.push('✅ 這個篩選底下的 ' + Number(shown).toLocaleString() + ' 筆已全部顯示。');
    }
    if (fsrv.orderedBy === '__name__') {
      parts.push('<b style="color:#b45309">⚠ Firestore 缺複合索引，這 ' + Number(shown).toLocaleString()
        + ' 筆是<u>依房號取樣</u>、不是最新的那幾筆。</b>');
    } else if (fsrv.orderedBy === 'createdAt') {
      parts.push('（依「建立時間」取最新 ' + Number(fsrv.cap).toLocaleString() + ' 筆，非「最後更新」）');
    }
    parts.push('Firebase 讀取要計費，上限 ' + Number(fsrv.cap).toLocaleString() + ' 筆／次。');
    fbNoticeHtml = '<div id="firebase-rooms-notice" class="toolbar" style="margin:6px 0 10px;">'
      + '<span class="small" style="color:#5b6472">' + parts.join(' ') + '</span>'
      + '<span class="filter-btn' + (fsrv.msgCounts ? ' active' : '') + '" style="margin-left:auto;"'
      + ' id="firebase-msgcount-toggle" onclick="toggleFirebaseMsgCounts()">'
      + (fsrv.msgCounts ? '💬 訊息數：開（每房各 1 次讀取）' : '💬 訊息數：關（點我計算，每房各 1 次讀取）')
      + '</span></div>';
  }
  // v6.240 時間範圍切換（只有走伺服器端分頁的 Oracle 分頁才有意義）
  const _rangeLabels = { '7d': '近 7 天', '30d': '近 30 天', '90d': '近 90 天', 'all': '全部資料' };
  const rangeBarHtml = srv ? ('<div class="toolbar" style="margin:6px 0 10px;">'
    + '<span class="small muted" style="margin-right:2px;">🕒 時間範圍：</span>'
    + ['7d', '30d', '90d', 'all'].map(r => '<span class="filter-btn' + (oracleRoomsRange === r ? ' active' : '')
        + '" onclick="setOracleRoomsRange(\'' + r + '\')">' + _rangeLabels[r] + '</span>').join('')
    + '<span class="small muted" style="margin-left:auto;">預設近 7 天；每頁 ' + (srv.pageSize || ROOMS_PAGE_SIZE)
    + ' 筆由伺服器切好再送（不再整包撈回瀏覽器），選「全部資料」也不會當。</span></div>') : '';
  const pagerHtml = totalPages > 1 ? `
    <div class="rooms-pager" style="display:flex;gap:0.4rem;align-items:center;justify-content:center;margin:0.6rem 0;flex-wrap:wrap">
      <button class="ghost" onclick="setRoomsPage(1, '${source}')" ${page === 1 ? 'disabled' : ''}>« 第一頁</button>
      <button class="ghost" onclick="setRoomsPage(${page - 1}, '${source}')" ${page === 1 ? 'disabled' : ''}>‹ 上一頁</button>
      <span style="font-size:0.9rem;color:#9bbcef">第 ${page.toLocaleString()} / ${totalPages.toLocaleString()} 頁 (共 ${Number(totalRows).toLocaleString()} 筆)</span>
      <button class="ghost" onclick="setRoomsPage(${page + 1}, '${source}')" ${page === totalPages ? 'disabled' : ''}>下一頁 ›</button>
      <button class="ghost" onclick="setRoomsPage(${totalPages}, '${source}')" ${page === totalPages ? 'disabled' : ''}>最後一頁 »</button>
      <span style="margin-left:0.4rem;font-size:0.85rem;color:#bbb">跳至：</span>
      <input id="rooms-page-input-${source}" type="number" min="1" max="${totalPages}" value="${page}" style="width:4.5rem;padding:0.2rem 0.3rem;background:#ffffff;color:#1a2332;border:1px solid #d6dbe3;border-radius:4px" onkeydown="if(event.key==='Enter')jumpRoomsPage('${source}')" />
      <button class="ghost" onclick="jumpRoomsPage('${source}')">跳頁</button>
    </div>
  ` : '';
  el.innerHTML = `
    <h2>${sourceLabel} <span class="small">(共 ${totalCount})</span></h2>
    ${fbNoticeHtml}
    ${rangeBarHtml}
    <div class="toolbar">
      <span class="filter-btn ${statusFilter === 'all' ? 'active' : ''}" onclick="setStatusFilter('all', '${source}')">全部 (${totalCount.toLocaleString()})</span>
      <span class="filter-btn ${statusFilter === 'playing' ? 'active' : ''}" onclick="setStatusFilter('playing', '${source}')">⚔️ 進行中 (${(counts.playing || 0).toLocaleString()})</span>
      <span class="filter-btn ${statusFilter === 'lobby' ? 'active' : ''}" onclick="setStatusFilter('lobby', '${source}')">🏠 等待中 (${(counts.lobby || 0).toLocaleString()})</span>
      <span class="filter-btn ${statusFilter === 'ended' ? 'active' : ''}" onclick="setStatusFilter('ended', '${source}')">✅ 已結束 (${(counts.ended || 0).toLocaleString()})</span>
      <input class="search-box" id="rooms-search-${source}" value="${source === 'oracle' ? escapeHtml(oracleRoomsSearch) : ''}" placeholder="搜尋 房號 / 房間名 / 玩家名 / Email / 牌組卡名" oninput="filterRoomsBySearch(this.value, '${source}')" />
      <input class="search-box" id="diag-code-${source}" placeholder="🔍 房號卡死診斷 (如 E5D9)" style="text-transform:uppercase" onkeydown="if(event.key==='Enter')showRoomDiag((this.value||'').trim().toUpperCase(),'${source}')" />
      <button class="ghost" onclick="showRoomDiag((document.getElementById('diag-code-${source}').value||'').trim().toUpperCase(),'${source}')">🔍 診斷</button>
    </div>
    ${pagerHtml}
    <div class="table-wrap"><table class="match-table"><thead><tr>
      <th>房號</th><th>房間名稱</th><th>P1</th><th>P2</th><th>狀態</th>
      <th>回合</th><th>最後更新</th><th>牌組</th><th>訊息</th><th>觀戰</th>${showDelete ? '<th></th>' : ''}
    </tr></thead><tbody id="${source}-rooms-tbody">
    ${pageRooms.map(r => renderRoomRow(r, source)).join('')}
    </tbody></table></div>
    ${pagerHtml}
  `;
}

// v0.5: Admin 隱身觀戰 — 新分頁開玩家前端，帶 ?spectate=ROOM&admin=1
//   玩家前端會驗證當前登入 email 是否在 ADMIN_EMAILS 白名單，通過才啟動偷看模式。
//   不寫 seat、不發 chat、bypass allowSpectate gate。
window.openSpyWindow = function(roomCode, source) {
  // v0.5c: source-aware base URL + base64 admin email token
  //   Oracle build 的 game 頁 (www.ptcg-tw-sim.com) 只能訂 Oracle backend 房間
  //   Firebase build 的 game 頁 (suenz001.github.io) 只能訂 Firestore 房間
  //   admin email 用 base64 編進 URL，game 頁 decode 後比對 ADMIN_EMAILS 白名單。
  //   這樣 game 頁不需要登入 admin 帳號（只在 admin.html 登入即可）。
  if (!currentUser || !currentUser.email) {
    alert('請先登入 admin 帳號');
    return;
  }
  const base = source === 'firebase'
    ? 'https://suenz001.github.io/ptcg-tw-sim/game'
    : 'https://www.ptcg-tw-sim.com/game';
  const adminToken = btoa(currentUser.email);
  const url = base + '?spectate=' + encodeURIComponent(roomCode) + '&admin=' + encodeURIComponent(adminToken);
  window.open(url, '_blank', 'noopener,noreferrer');
};

// v5.276: 翻頁 state (per source) + PAGE_SIZE
const ROOMS_PAGE_SIZE = 50;
let oracleRoomsPage = 1;
let firebaseRoomsPage = 1;
window.setRoomsPage = function(p, source) {
  if (source === 'oracle') oracleRoomsPage = Math.max(1, p);
  else firebaseRoomsPage = Math.max(1, p);
  // v6.240 Oracle 走伺服器端分頁 ⇒ 翻頁必須**重新跟伺服器要那一頁**
  //   （瀏覽器手上只有 50 筆，重繪自己是變不出第 2 頁的）。
  if (source === 'oracle' && oracleRoomsSrv) { _oracleSearchFocus = false; loadOracleRooms(); return; }
  if (source === 'oracle') renderRoomsTab(document.getElementById('tab-oracle-rooms'), 'oracle', oracleRoomsCache);
  else renderRoomsTab(document.getElementById('tab-firebase-rooms'), 'firebase', firebaseRoomsCache);
};
// v6.240 時間範圍切換：換範圍 → 回第 1 頁 → 重新跟伺服器要
window.setOracleRoomsRange = function(r) {
  if (!['7d', '30d', '90d', 'all'].includes(r)) return;
  oracleRoomsRange = r;
  oracleRoomsPage = 1;
  _oracleSearchFocus = false;
  loadOracleRooms();
};
// v6.272：Firebase 的「每房訊息數」是 N 次額外 Firestore 讀取（官方：count() 每 1000
//   索引項算 1 次讀取 ⇒ 一般房間就是 1 次／房）。預設關，站長要看時才按這顆重抓。
window.toggleFirebaseMsgCounts = function() {
  firebaseRoomsMsgCounts = !firebaseRoomsMsgCounts;
  firebaseRoomsPage = 1;
  loadFirebaseRooms();
};

window.jumpRoomsPage = function(source) {
  const inp = document.getElementById('rooms-page-input-' + source);
  if (!inp) return;
  const p = parseInt(inp.value, 10);
  if (Number.isFinite(p) && p >= 1) window.setRoomsPage(p, source);
};

window.setStatusFilter = function(s, source) {
  statusFilter = s;
  if (source === 'oracle') { oracleRoomsPage = 1; _oracleSearchFocus = false; }  // v5.276: 切 filter 重置頁碼
  else firebaseRoomsPage = 1;
  // v1.18: 切換 status 分頁 → 重新抓「該 status」的房間（每頁各自載入，不再一次撈全部）。
  if (source === 'oracle') loadOracleRooms();
  else loadFirebaseRooms();
};

window.filterRoomsBySearch = function(q, source) {
  // v5.276: 搜尋也走翻頁 — 完整 re-render (含 pager) 而非只更新 tbody
  if (source === 'oracle') oracleRoomsPage = 1;
  else firebaseRoomsPage = 1;
  // v6.240 Oracle 走伺服器端分頁 ⇒ 搜尋也必須在伺服器端做，否則只搜得到當前這 50 筆。
  //   debounce 350ms（每敲一鍵打一次 API 會把 8 萬筆的 regex 掃描打爆）。
  if (source === 'oracle' && oracleRoomsSrv) {
    oracleRoomsSearch = q || '';
    _oracleSearchFocus = true;
    if (_oracleSearchTimer) clearTimeout(_oracleSearchTimer);
    _oracleSearchTimer = setTimeout(() => { _oracleSearchTimer = null; loadOracleRooms(); }, 350);
    return;
  }
  const rooms = source === 'oracle' ? oracleRoomsCache : firebaseRoomsCache;
  // 過濾 cache 內 rooms 後重 render. statusFilter + search 都套用.
  const lc = q.toLowerCase();
  const filtered = rooms.filter(r => {
    if (statusFilter !== 'all' && r.status !== statusFilter) return false;
    if (!q) return true;
    if (r._id.toLowerCase().includes(lc)) return true;
    if ((r.roomName || '').toLowerCase().includes(lc)) return true;
    return (r.seats || []).some(s => {
      if (!s) return false;
      // 玩家名
      if (s.name && s.name.toLowerCase().includes(lc)) return true;
      // v1.21：email 搜尋（server enrich 的 seat.email 或 client uidEmailMap fallback）
      const em = s.email || (s.uid && uidEmailMap.get(s.uid)) || '';
      if (em && em.toLowerCase().includes(lc)) return true;
      // v1.21：牌組(主力打手)搜尋 — 用牌庫非支援型寶可夢判斷的主力名（如「多龍巴魯托ex」）。
      //   依賴 cardInfoMap（卡片索引背景載入後才有；未載入時回空字串，不影響其他搜尋）。
      const mainP = detectMainPokemon(s);
      if (mainP && mainP.toLowerCase().includes(lc)) return true;
      // v1.74（v6.229）：牌組原型搜尋 —— Oracle 分頁標籤已改顯示原型名，搜尋跟著能搜；
      //   主力打手搜尋**保留**（保守：站長沒說要移除，兩者都能搜）。null＝還不知道，不參與搜尋。
      if (s.archetype && String(s.archetype).toLowerCase().includes(lc)) return true;
      return false;
    });
  });
  // tbody-only 更新 (不重 render pager — 搜尋當下不換頁碼避免閃爍)
  document.getElementById(source + '-rooms-tbody').innerHTML = filtered.slice(0, ROOMS_PAGE_SIZE).map(r => renderRoomRow(r, source)).join('');
};

function renderRoomRow(r, source) {
  const updated = r.updatedAt ? new Date(r.updatedAt) : null;
  const ageMin = updated ? Math.round((Date.now() - r.updatedAt) / 60000) : null;
  const updatedStr = updated ? updated.toLocaleString('zh-TW') : '-';
  const p1 = r.seats?.[0];
  const p2 = r.seats?.[1];
  const gs = r.gameStateSummary;
  const winnerIdx = (gs && gs.winner != null) ? gs.winner : null;
  const p1Class = winnerIdx === 0 ? 'winner-cell' : '';
  const p2Class = winnerIdx === 1 ? 'winner-cell' : '';
  // v0.5: 顯示「暱稱 (email)」，匿名玩家無 email 則只顯示暱稱
  // v0.77: 查無 email 時改顯示 uid 前 8 碼方便辨識
  // v0.78: 優先用 server enrich 的 seat.email
  // v0.79: server 認 'anon_*' 為 session-anon provider（client 自產的訪客 id，非 firebase
  //   auth uid），改顯示「🎲 訪客 anon_xxx…」而非誤導的「已刪除」。
  function seatLabel(seat) {
    if (!seat?.uid) return '<span class="small">（空）</span>';
    const nm = escapeHtml(seat.name || '?');
    // (1) server enrich 給了 email — 最準確
    if (seat.email) {
      return nm + '<div class="small" style="color:#7aa3ef;font-size:10px">' + playerLink(seat.email) + '</div>';
    }
    // (2) v0.79: session anon (client 自產 anon_xxx，非 firebase auth uid)
    if (seat.provider === 'session-anon') {
      const uidShort = escapeHtml(String(seat.uid).slice(0, 12));
      return nm + '<div class="small" style="color:#9aa3b0;font-size:10px">🎲 訪客 ' + uidShort + '…</div>';
    }
    // (3) server enrich 但這個 user 是真匿名 firebase auth user
    if (seat.isAnonymous === true) {
      const uidShort = escapeHtml(String(seat.uid).slice(0, 8));
      return nm + '<div class="small" style="color:#9aa3b0;font-size:10px">🕶️ 匿名 ' + uidShort + '…</div>';
    }
    // (4) server enrich provider='not-found' — Firebase Auth 真的刪過此 user
    if (seat.provider === 'not-found') {
      const uidShort = escapeHtml(String(seat.uid).slice(0, 8));
      return nm + '<div class="small" style="color:#c87a7a;font-size:10px">⚠️ 已刪除 ' + uidShort + '…</div>';
    }
    // (5) Fallback：server 沒 enrich（舊版 server），用 client uidEmailMap
    const em = uidEmailMap.get(seat.uid);
    if (em) return nm + '<div class="small" style="color:#7aa3ef;font-size:10px">' + escapeHtml(em) + '</div>';
    const uidPrefix = escapeHtml(String(seat.uid).slice(0, 8));
    return nm + '<div class="small" style="color:#9aa3b0;font-size:10px">' + uidPrefix + '… (查無)</div>';
  }
  const p1Name = seatLabel(p1);
  const p2Name = seatLabel(p2);
  // v1.19 還原：「⚔️ 主力打手」badge —— v1.74 起只當退路（Firebase 分頁／舊伺服器）。
  const _mainBadge = (m) => m ? `<div class="small" style="color:#d98c3f;font-size:10px;font-weight:600">⚔️ ${escapeHtml(m)}</div>` : '';
  // v1.74（v6.229）：Oracle 分頁的牌組標籤改用【牌組原型】分類 —— 與一般對戰大廳同一份
  //   後端結果（/api/admin/oracle/rooms 為每個 seat enrich 的 seat.archetype），比照大廳
  //   game/+page.svelte 的 .or-arch 呈現：【原型名】粗體（大廳金黃 #ffd97a 是深底；admin
  //   淺色主題改深金 #b8860b，格式一致）。回傳語義（與大廳同，oracle-client.ts 註解同款）：
  //   ・字串（含 '未分類'）＝已比對出結果 → 顯示【名稱】
  //   ・null＝還不知道（規則庫沒載入／沒牌表）→ 不顯示任何標籤（大廳也是如此），
  //     ⚠ 絕不可把 null 顯示成「未分類」
  //   ・欄位不存在（undefined）＝Firebase 分頁或舊伺服器（端點沒 enrich）→ 退回舊
  //     「⚔️ 主力打手」badge（該分頁本版不動）。
  const _archBadge = (m) => m ? `<div class="small" style="color:#b8860b;font-size:10px;font-weight:600">【${escapeHtml(m)}】</div>` : '';
  const _seatDeckBadge = (seat) => (seat && ('archetype' in seat))
    ? _archBadge(seat.archetype)
    : _mainBadge(detectMainPokemon(seat));
  const p1MainBadge = _seatDeckBadge(p1);
  const p2MainBadge = _seatDeckBadge(p2);
  const turn = (gs?.turn != null) ? gs.turn : '<span class="small">-</span>';
  // v0.90: Firebase rooms 也可刪
  const showDelete = true;
  // 狀態 badge with icon + Chinese
  let statusBadge;
  if (r.status === 'playing') statusBadge = '<span class="status-badge status-playing">⚔️ 進行中</span>';
  else if (r.status === 'lobby') statusBadge = '<span class="status-badge status-lobby">🏠 等待中</span>';
  else statusBadge = '<span class="status-badge status-ended">✅ 已結束</span>';
  // 訊息按鈕 + 計數 badge
  const msgCount = r.messageCount;
  let msgBtn;
  if (msgCount === undefined) {
    msgBtn = `<button class="btn-msg" onclick="showMessagesModal('${r._id}', '${source}')">💬 訊息</button>`;
  } else if (msgCount === 0) {
    msgBtn = `<button class="btn-msg empty" onclick="showMessagesModal('${r._id}', '${source}')">💬 0</button>`;
  } else {
    msgBtn = `<button class="btn-msg has-msg" onclick="showMessagesModal('${r._id}', '${source}')">💬 ${msgCount}則</button>`;
  }
  // v0.31: 用 trunc-inner div 包住，避免長名字撐爆 row
  const p1FullName = p1?.uid ? (p1.name || '?') : '';
  const p2FullName = p2?.uid ? (p2.name || '?') : '';
  const roomNameFull = r.roomName || '';
  return `
    <tr>
      <td class="mono"><b>${r._id}</b></td>
      <td title="${escapeHtml(roomNameFull)}"><div class="trunc-inner">${escapeHtml(roomNameFull)}</div></td>
      <td class="${p1Class}" title="${escapeHtml(p1FullName)}"><div class="trunc-inner">${p1Name}</div>${p1MainBadge}</td>
      <td class="${p2Class}" title="${escapeHtml(p2FullName)}"><div class="trunc-inner">${p2Name}</div>${p2MainBadge}</td>
      <td>${statusBadge}</td>
      <td class="num-cell">${turn}</td>
      <td>${updatedStr}${ageMin !== null ? `<div class="small">${ageMin}m ago</div>` : ''}</td>
      <td><button class="btn-deck" onclick="showDeckModal('${r._id}', '${source}')">🃏 牌組</button> <button class="btn-deck" style="background:#7b1fa2;color:#fff" onclick="showRoomDiag('${r._id}', '${source}')" title="卡死診斷">🔍 診斷</button></td>
      <td>${msgBtn}</td>
      <td>${r.status === 'playing' ? `<button class="btn-deck" style="background:#1976d2;color:#ffffff" onclick="openSpyWindow('${r._id}', '${source}')" title="Admin 隱身觀戰">\ud83d\udd0d 偷看</button>` : '<span class="small">-</span>'}</td>
      ${showDelete ? `<td><button class="tiny danger" onclick="deleteRoomBySource('${r._id}', '${source}')" title="${source === 'firebase' ? '刪除 Firebase 房間（含 messages 子集合）' : '刪除 Oracle 房間'}">刪除</button></td>` : ''}
    </tr>
  `;
}

function escapeHtml(s) {
  return String(s || '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}

// v1.10：房間卡死診斷 — 抓 gameState 自動研判常見卡死點（玩家回報「動不了」用）
window.showRoomDiag = async function(code, source) {
  if (!code) { alert('請輸入房號'); return; }
  source = source || 'oracle';
  const shell = (inner) => `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="min-width:560px"><h3>🔍 房間 ${escapeHtml(code)} 卡死診斷</h3>${inner}</div></div>`;
  document.getElementById('modal-container').innerHTML = shell('<div class="empty">載入中…</div>');
  await ensureCardIndex();
  const data = await api('/api/admin/' + source + '/rooms/' + encodeURIComponent(code));
  const room = data && data.room;
  const closeBtn = '<div style="text-align:right;margin-top:14px"><button onclick="closeModal()">關閉</button></div>';
  if (!room) { document.getElementById('modal-container').innerHTML = shell('<div class="empty">找不到此房間（可能已結束被清除，或房號錯誤）。</div>' + closeBtn); return; }
  const g = room.gameState;
  const nm = (cid) => cid ? (cardInfoMap[cid] ? (cardInfoMap[cid].displayName || cardInfoMap[cid].name) : ('?#' + cid)) : '(空)';
  const seats = room.seats || [];
  let updMs = 0;
  if (room.updatedAt) updMs = room.updatedAt._seconds ? room.updatedAt._seconds * 1000 : (typeof room.updatedAt === 'number' ? room.updatedAt : new Date(room.updatedAt).getTime());
  const ageMin = updMs ? Math.round((Date.now() - updMs) / 60000) : null;
  const diag = [];
  let html = '';
  if (!g) {
    diag.push('房間尚未開始對局（status=' + room.status + '）。');
  } else {
    const a0 = g.players && g.players[0] ? g.players[0].active : null;
    const a1 = g.players && g.players[1] ? g.players[1].active : null;
    const turnOwner = (g.pendingSelection && g.pendingSelection.actorIdx != null) ? g.pendingSelection.actorIdx : g.activePlayerIndex;
    if (g.phase === 'game-over') diag.push('對局已結束（winner=' + g.winner + '）。');
    else if (g.phase === 'setup') {
      const sd = g.setupDone || [], mr = g.mulliganRevealConfirmed || [], pm = g.pendingMulliganDraw || [], pb = g.mulliganPostBenchOpen || [];
      diag.push('卡在【開局設置】。');
      if (!sd[0] || !sd[1]) diag.push('• 尚有玩家未按準備：setupDone=' + JSON.stringify(sd));
      if ((pm[0] || 0) > 0 || (pm[1] || 0) > 0) diag.push('• 有玩家還沒決定重抽補抽：pendingMulliganDraw=' + JSON.stringify(pm) + '（該玩家需在「決定補抽」視窗操作；v5.339 已修同步卡死，仍卡可能是該玩家畫面沒彈窗）');
      if (!mr[0] || !mr[1]) diag.push('• 有玩家還沒確認對方 mulligan 揭示：mulliganRevealConfirmed=' + JSON.stringify(mr));
      if (pb[0] || pb[1]) diag.push('• 有玩家補抽後還沒按「加備戰完成」：mulliganPostBenchOpen=' + JSON.stringify(pb));
    } else if (g.phase === 'playing') {
      if ((g.pendingPrizes && (g.pendingPrizes[0] || 0) > 0) || (g.pendingPrizes && (g.pendingPrizes[1] || 0) > 0)) diag.push('• 有玩家需先「取得獎勵牌」才能繼續：pendingPrizes=' + JSON.stringify(g.pendingPrizes));
      if (a0 === null) diag.push('• P1 戰鬥場空（昏厥後需派出新寶可夢）。');
      if (a1 === null) diag.push('• P2 戰鬥場空（昏厥後需派出新寶可夢）。');
      [a0, a1].forEach((a, i) => { if (a && a.cardId && !cardInfoMap[a.cardId]) diag.push('• P' + (i + 1) + ' 戰鬥寶可夢卡片解不出（?卡）cardId=' + a.cardId + '（舊版 id 漏遷移，整局會卡）。'); });
      if (g.pendingSelection) diag.push('• 等待 P' + (((g.pendingSelection.actorIdx != null ? g.pendingSelection.actorIdx : 0)) + 1) + ' 處理選擇「' + (g.pendingSelection.effectKey || g.pendingSelection.type) + '」（若該玩家畫面沒彈窗 = 卡死點）。');
      diag.push('• 目前應行動方：P' + (turnOwner + 1) + '（activePlayerIndex=' + g.activePlayerIndex + '，turnPhase=' + g.turnPhase + '）。');
    }
    if (ageMin !== null && ageMin > 3) diag.push('⏱ 最後更新已 ' + ageMin + ' 分鐘前 — 對手可能離線/掛機（非引擎卡死）。');
    html = '<div class="small" style="line-height:1.8">'
      + '<b>狀態</b>：' + room.status + ' | phase=' + g.phase + ' | turnPhase=' + g.turnPhase + ' | turn=' + g.turn + ' | activePlayerIndex=' + g.activePlayerIndex + '<br>'
      + '<b>P1</b> ' + escapeHtml(seats[0] && seats[0].name || '?') + '：' + escapeHtml(nm(a0 && a0.cardId)) + (a0 ? (' (扣' + (a0.damage || 0) + (a0.status ? (' ' + a0.status) : '') + (a0.cantRetreatNextTurn ? ' 禁退' : '') + ')') : '') + '<br>'
      + '<b>P2</b> ' + escapeHtml(seats[1] && seats[1].name || '?') + '：' + escapeHtml(nm(a1 && a1.cardId)) + (a1 ? (' (扣' + (a1.damage || 0) + (a1.status ? (' ' + a1.status) : '') + (a1.cantRetreatNextTurn ? ' 禁退' : '') + ')') : '') + '<br>'
      + 'pendingSelection=' + (g.pendingSelection ? escapeHtml((g.pendingSelection.effectKey || g.pendingSelection.type) + ' actor=' + g.pendingSelection.actorIdx) : '-') + ' | pendingPrizes=' + JSON.stringify(g.pendingPrizes || []) + '<br>'
      + 'setupDone=' + JSON.stringify(g.setupDone || []) + ' mulliReveal=' + JSON.stringify(g.mulliganRevealConfirmed || []) + ' pendingMulli=' + JSON.stringify(g.pendingMulliganDraw || []) + ' postBench=' + JSON.stringify(g.mulliganPostBenchOpen || []) + '<br>'
      + '最後更新：' + (ageMin !== null ? (ageMin + ' 分鐘前') : '?')
      + '</div>';
  }
  const diagHtml = '<div style="background:#fff3e0;border:1px solid #ffb74d;border-radius:6px;padding:10px;margin-bottom:10px;color:#5d4037;font-weight:600;line-height:1.8">' + (diag.length ? diag.map(escapeHtml).join('<br>') : '看起來正常，沒有偵測到明顯卡死點。') + '</div>';
  const jsonHtml = '<details style="margin-top:10px"><summary class="small muted" style="cursor:pointer">📋 完整 gameState JSON</summary><pre style="background:#f5f5f5;padding:8px;border-radius:4px;font-size:11px;max-height:40vh;overflow:auto;white-space:pre-wrap">' + escapeHtml(JSON.stringify(g || room, null, 1)) + '</pre></details>';
  document.getElementById('modal-container').innerHTML = shell(diagHtml + html + jsonHtml + closeBtn);
};

// v0.96: 牌組明細 modal — 從玩家儲存牌組 list 觸發
window.showDeckDetail = async function(deckId) {
  // v0.99: push 當前 modal 到 stack (若有), 關閉時 popModal 回上層
  const _curForStack = document.getElementById('modal-container').innerHTML;
  if (_curForStack && _curForStack.trim()) window._modalStack.push(_curForStack);
  const deck = window._lastPlayerDecks?.[deckId];
  if (!deck) { alert('找不到該牌組'); return; }
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)popModal()">
      <div class="modal" style="min-width:520px;"><h3>🃏 牌組明細</h3><div class="empty">載入卡牌資料中…</div></div>
    </div>`;
  await ensureCardIndex();
  // 排序: 寶可夢→物品→支援者→場地→能量, 同類內 count desc, 同 count 用 name
  const typeRank = (info) => {
    if (!info) return 9;
    if (info.supertype === 'Pokemon') return 1;
    if (info.supertype === 'Trainer') {
      if (info.subtype === 'Supporter') return 3;
      if (info.subtype === 'Stadium') return 4;
      return 2;
    }
    if (info.supertype === 'Energy') return 5;
    return 9;
  };
  const entries = (deck.entries || []).slice().sort((a, b) => {
    const ia = cardInfoMap[a.cardId], ib = cardInfoMap[b.cardId];
    const ra = typeRank(ia), rb = typeRank(ib);
    if (ra !== rb) return ra - rb;
    if (b.count !== a.count) return b.count - a.count;
    return (ia?.name || '').localeCompare(ib?.name || '', 'zh-Hant');
  });
  const totalCards = entries.reduce((s, e) => s + (e.count || 0), 0);
  // v1.00: 改用 cardLabel 統一格式 (同 showMatchDeck 對戰牌組), 玩家可直接複製貼到牌組編輯器匯入
  //   第一行: 「{牌組名}」
  //   第二行: 「共 N 張 / 種類 M」
  //   每張卡: cardLabel(id, count) = 「卡名 setCode · 編號 · 賽季 × N」
  const headerLines = [
    `${deck.name || '(未命名)'}`,
    `共 ${totalCards} 張 / 種類 ${entries.length}`,
  ];
  const cardLines = entries.map(e => cardLabel(e.cardId, e.count));
  const copyText = headerLines.concat(cardLines).join('\n');
  window._lastDeckCopyText = copyText;
  // 預覽用 <pre> 顯示原始文字 (跟複製出的內容一致, 玩家直接 select 也可)
  pushModal(`
    <div class="modal-bg" onclick="if(event.target===this)popModal()">
      <div class="modal" style="min-width:600px; max-width:760px; max-height:88vh; overflow-y:auto;">
        <h3>🃏 牌組明細：${escapeHtml(deck.name || '(未命名)')}</h3>
        <div class="small muted" style="margin-bottom:8px;">共 <b>${totalCards}</b> 張 / 種類 <b>${entries.length}</b> · 更新 ${escapeHtml(String(deck.updatedAt || '-')).slice(0, 19)} · 可貼到牌組編輯器「匯入文字」</div>
        <pre style="background:#f5f5f5; padding:10px; border-radius:4px; font-family:Consolas,Menlo,monospace; font-size:12px; line-height:1.6; max-height:60vh; overflow:auto; white-space:pre-wrap; user-select:text;">${escapeHtml(copyText)}</pre>
        <div style="margin-top:14px; display:flex; gap:8px; justify-content:flex-end;">
          <button onclick="navigator.clipboard.writeText(window._lastDeckCopyText || ''); this.textContent='✅ 已複製'; setTimeout(()=>this.textContent='📋 複製全部',2000);">📋 複製全部</button>
          <button onclick="popModal()">關閉</button>
        </div>
      </div>
    </div>`);
};

// v0.99: modal stack — 跨層 modal (玩家 → 牌組明細 / 對戰牌組) 點關閉回上層
window._modalStack = [];
window.pushModal = function(html) {
  const cur = document.getElementById('modal-container').innerHTML;
  if (cur && cur.trim()) window._modalStack.push(cur);
  document.getElementById('modal-container').innerHTML = html;
};
window.popModal = function() {
  if (window._modalStack.length > 0) {
    const prev = window._modalStack.pop();
    document.getElementById('modal-container').innerHTML = prev;
  } else {
    closeModal();
  }
};
window.closeModal = function() {
  document.getElementById('modal-container').innerHTML = '';
  // v1.50 玩家總覽：關閉時清掉 #/player/ 深連結，避免重整又跳回 modal
  const _h = String(location.hash || '');
  if (_h.startsWith('#/player/') || _h.startsWith('#/event/')) {
    history.replaceState(null, '', location.pathname + location.search);
  }
};

// ══ v1.51 牌組原型規則（批次2）═══════════════════════════════════════════════
//   Wilson 自訂「必須含哪些卡 AND 不能含哪些卡」來識別牌組，例：
//     祭典熱舞 = 含【果蜜蟲】【角金魚】、不含【蜜集大蛇ex】
//   ⭐用卡名比對（Wilson 拍板）：同一張卡的印刷版本很多，用編號會漏掉新印刷版本。
//   ⭐存檔前一定要按「預覽命中」：卡名打錯會 0 命中，預覽會直接把打錯的名字列出來。
let _deckRules = [];
let _rulePreview = null;   // { ruleName, hits, scannedDecks, samples, unknownCardNames }
// v1.52 批次3：牌組原型統計（休閒／錦標賽分開）
let _archStats = null;
let _archStatsBusy = false;
// v1.55：統計表排序（休閒／錦標賽兩張表共用同一組設定，方便左右對照同一指標）
let _archSortKey = 'usage';   // usage | wins | losses | draws | winRate | name
let _archSortAsc = false;     // 預設由大到小
let _archSince = '0';   // '0'=全部；否則為天數
// ⚠v1.58：本檔是 <script type="module">，模組層級的 let **不是 window 屬性**；
//   而 inline on* handler 是在「全域」執行的。所以 onchange="_archSince=this.value"
//   只會寫進一個同名的全域變數，模組內這個 _archSince 永遠停在初始值 '0'
//   → 不論選 7 天還 30 天，送出去的 since 都是 0（全部時間），統計數字自然完全一樣。
//   修法：① setter 掛 window 供 inline 呼叫 ② 讀取端一律以畫面上的 <select> 為單一真實來源。
window.setArchSince = function (v) {

/** 時間範圍的單一真實來源＝畫面上的下拉；取不到才回退模組變數。 */

window.loadDeckRules = async function() {
  const el = document.getElementById('tab-deck-rules');

  await ensureCardIndex();          // 卡名 datalist 用
  const res = await api('/api/admin/deck-rules');
  if (!res || res.error) { el.innerHTML = '<div class="empty">讀取失敗：' + escapeHtml(res?.error || '?') + '</div>'; return; }
  _deckRules = res.rules || [];
  renderDeckRules(el);
};

function renderDeckRules(el) {
  // 卡名建議清單（去重後的顯示名，供 datalist 自動完成）
  const names = new Set();
  for (const k in (window.cardInfoMap || {})) { const n = cardInfoMap[k]?.name; if (n) names.add(n); }
  const dlOpts = [...names].sort().map((n) => '<option value="' + escapeHtml(n) + '">').join('');

  // v1.60 規則列改由中央 tv 管線逐頁渲染（支援關鍵字搜尋＋每頁 50 筆）
  const ruleRowHtml = (r) => {
    const inc = (r.includes || []).map((x) => '<span class="rule-chip inc">' + escapeHtml(x) + '</span>').join('');
    const exc = (r.excludes || []).map((x) => '<span class="rule-chip exc">' + escapeHtml(x) + '</span>').join('');
    const ids = ((r.includeIds || []).length + (r.excludeIds || []).length)
      ? '<div class="small muted">鎖定版本：' + ((r.includeIds || []).concat(r.excludeIds || []).map(escapeHtml).join(', ')) + '</div>' : '';
    const rid = String(r._id).replace(/'/g, '&apos;');
    return '<tr>'
      + '<td>' + (r.enabled === false ? '⏸' : '✅') + '</td>'
      + '<td><b>' + escapeHtml(r.name) + '</b>' + (r.note ? '<div class="small muted">' + escapeHtml(r.note) + '</div>' : '') + ids + '</td>'
      + '<td>' + (inc || '<span class="small muted">—</span>') + '</td>'
      + '<td>' + (exc || '<span class="small muted">—</span>') + '</td>'
      + '<td title="條件越多＝描述越特定，一副牌同時符合多條規則時由條件多的那條勝出">'
      + ((r.includes || []).length + (r.excludes || []).length
         + (r.includeIds || []).length + (r.excludeIds || []).length) + ' 項</td>'
      + '<td><button class="tiny ghost" onclick="editDeckRule(\'' + rid + '\')">編輯</button> '
      + '<button class="tiny ghost" onclick="deleteDeckRule(\'' + rid + '\')">刪除</button></td>'
      + '</tr>';
  };

  const pv = _rulePreview;
  const pvHtml = !pv ? '' :
    '<div class="stats-box" style="padding:10px;margin-top:8px;">'
    + (pv.unknownCardNames && pv.unknownCardNames.length
        ? '<div style="color:#c62828;font-weight:600;margin-bottom:6px;">⚠ 這些卡名在卡片資料庫中找不到（多半是打錯字或用了非官方譯名）：'
