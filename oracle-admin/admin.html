function miStamp(ms) {
  const d = new Date(ms), p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
}

// ══ MP-PURE-BEGIN ── v1.71 完整版（多頁）的口徑與分頁：純函式，node 端可直接跑 ══
//
// ⭐ 統計口徑**只有這一份**：單頁版（miDraw）與完整版（mpPlanMeta）都從 miComputeRows
//    拿 rows／分母／佔比函式。抄第二份必然漂移，而且漂移了不會有任何錯誤訊息。
// ⚠ 這一段刻意寫成完全不碰 DOM／canvas，守衛才能真的把它跑起來 ——
//    只驗「字串存在」的守衛擋不住「接線沒接上」。

/** 該資料源在 scanned 裡的副數欄位名。（miTrend 與 miComputeRows 共用，避免兩份字面量。） */
function miDeckKey(srcKey) { return srcKey === 'casual' ? 'casualDecks' : 'tournDecks'; }

/**
 * 報告圖的資料底：rows（後端已依 usage 由大到小排序）＋分母＋佔比函式。
 * ⚠ 分母用 scanned 的副數，**不可**用 rows 的 usage 加總 —— 未分類那一大塊不在 rows 裡，
 *   用加總當分母會把每個原型的佔比灌水。
 * 回 null＝該資料源沒有任何命中原型（呼叫端據此不產圖）。
 */
function miComputeRows(srcKey, cur) {
  const blk = cur && cur[srcKey];
  if (!blk || !((blk.rows || []).length)) return null;
  const total = (cur.scanned && cur.scanned[miDeckKey(srcKey)]) || 0;
  return {
    blk: blk,
    rows: (blk.rows || []),
    total: total,
    share: function (u) { return total > 0 ? u / total : 0; },
  };
}

/**
 * 純分頁。回 [{ pageIndex, startRank, items }]；**所有頁的 items 加總 === 原始筆數**。
 * ⚠ 空陣列也回 1 頁（空頁）：頁數永遠 >= 1，版面尺寸不會因為沒資料而消失。
 */
function mpPaginate(items, per) {
  const list = items || [];
  const n = Math.max(1, Math.floor(per) || 0);
  const total = Math.max(1, Math.ceil(list.length / n));
  const out = [];
  for (let i = 0; i < total; i++) {
    out.push({ pageIndex: i, startRank: i * n + 1, items: list.slice(i * n, (i + 1) * n) });
  }
  return out;
}

/** 收尾：補上全域頁碼。影片是一路播下去的，所以頁碼跨區段連續。 */
function mpNumber(pages) {
  pages.forEach(function (p, i) { p.page = i + 1; p.pageTotal = pages.length; });
  return pages;
}

/**
 * 環境報告完整版的頁面計畫。**不截斷任何一筆**（單頁版是 slice(0, MI.TOPN)）。
 * 一般對戰的所有頁 → 錦標賽的所有頁；名次在各資料源內跨頁連續。
 */
function mpPlanMeta(cur, per) {
  const pages = [];
  ['casual', 'tourn'].forEach(function (srcKey) {
    const st = miComputeRows(srcKey, cur);
    if (!st) return;
    // ⚠ 長條的滿長基準必須是**全體**最大佔比（不是本頁最大）——
    //   每頁各自歸一化的話，第 3 頁的第 21 名會畫得跟第 1 名一樣長，直接騙人。
    let peak = 0;
    st.rows.forEach(function (r) { const s = st.share(r.usage); if (s > peak) peak = s; });
    const chunks = mpPaginate(st.rows, per);
    chunks.forEach(function (c, i) {
      pages.push({
        kind: 'meta', srcKey: srcKey, st: st, rows: c.items, peak: peak || 1,
        startRank: c.startRank, sectionTotal: st.rows.length, sub: i + 1, subTotal: chunks.length,
      });
    });
  });
  return mpNumber(pages);
}

/**
 * 奪冠完整版的四個區段定義。**陣列順序＝預設順序**；站長可在 UI 勾選與上下調序（v1.72）。
 * ⭐ 這張表是唯一來源：勾選 UI 的清單、頁面計畫、單位詞都讀它 —— 標題／單位不得在別處再抄一份。
 *
 * ⭐⭐ **單位詞逐段判斷**（v1.72 站長裁定：指人留「位」、指次數改「次」，不是一律取代）：
 *   ・champRank  ＝ crBuild 把每一場網站賽的冠軍依牌組聚合 ⇒ n 是「這副牌**奪冠幾次**」→「次」
 *   ・t4Rows     ＝ 每場賽事的 top4 逐筆累加 ⇒ 同一個人在兩場賽事會各算一次
 *                  ⇒ n 是「這副牌**進四強幾次**」（人次），不是「幾個人」→「次」
 *   ・commRank   ＝ 社群賽冠軍依牌組聚合 ⇒ n 是「奪冠幾次」→「次」
 *   ・siteChamps ＝ 逐場列，每列就是一場賽事，本來就沒有單位。
 *   ⚠ 反例（**維持「位」**）：`crNotes` 的「四強＝準決賽的 4 位選手」指的是活生生的 4 個人；
 *     單頁版四強區塊的抬頭原本寫「共 N 位」，但 N 是 t4Rows 的加總（＝人次）⇒ 改「共 N 人次」，
 *     與同一張圖上早就有的「共 N 人次參賽」同一個口徑。
 */
const CR_SECTIONS = [
  { k: 'champRank',  kind: 'rank',  icon: '🏆', title: '網站賽　冠軍牌組次數榜',     accent: 'a1', per: 'rank',  unit: '次' },
  { k: 'siteChamps', kind: 'champ', icon: '🏆', title: '網站賽　冠軍（逐場）',       accent: 'a1', per: 'champ', unit: '' },
  { k: 't4Rows',     kind: 'rank',  icon: '🥈', title: '網站賽　四強牌組（含冠亞）', accent: 'a2', per: 'rank',  unit: '次' },
  { k: 'commRank',   kind: 'rank',  icon: '👥', title: '社群賽　奪冠最多的牌組',     accent: 'c1', per: 'rank',  unit: '次' },
];

/**
 * 某一段實際要出的資料列（回陣列，永不回 null）。
 * ⚠ 只有 1 場網站賽時「冠軍牌組次數榜」與「冠軍（逐場）」完全等價（每列都是 1），
 *   那一頁沒有任何資訊量 —— 這是同一份資料的兩種呈現重複，不是把資料截斷掉。
 */
function crSectionRows(d, k) {
  if (!d) return [];
  if (k === 'champRank') return ((d.siteChamps || []).length > 1) ? (d.champRank || []) : [];
  return d[k] || [];
}

/**
 * 勾了某一段卻不會出頁的原因（會出就回 null）。
 * ⚠⚠ v1.72 把契約從「系統決定出哪幾段」改成「站長勾什麼就出什麼」⇒ **靜默少一段是重大缺陷**：
 *   站長要到剪片時才會發現素材缺了一塊，而且完全不知道為什麼。所以產完圖一定要把
 *   「勾了但沒出」連同原因回報給他。
 * ⚠ champRank 的抑制規則（只有 1 場網站賽時與逐場完全等價）本身沒錯，錯的是不講。
 */
function crSkipReason(d, k) {
  if (crSectionRows(d, k).length) return null;
  if (k === 'champRank' && (((d && d.champRank) || []).length)) {
    return '只有 1 場網站賽，內容與「冠軍（逐場）」完全相同，不重複輸出';
  }
  return '這個時間範圍內沒有資料';
}

/**
 * 奪冠報告完整版的頁面計畫：每段自己分頁、名次在段內跨頁連續、頁碼跨段連續。
 * @param sel 要輸出的區段 key 陣列，**依站長設定的順序**。
 *   ⚠ `null`／`undefined` ＝呼叫端沒有指定 → 四段全出（既有呼叫端與舊守衛的預設行為）；
 *     **空陣列 ＝ 一段都不出，回 0 頁**。這兩者一定要分開 —— 若把 `[]` 也當成「全出」，
 *     就會出現「一段都沒勾卻產出四段」這種最難察覺的錯（產得出來、看起來也對）。
 *   ⚠ 未知 key（舊設定殘留／手動改壞 localStorage）直接忽略，不讓整批產圖炸掉。
 * ⭐ 頁碼的分母 N 由 mpNumber 在最後一次寫入 ⇒ 只勾兩段時 N 自動是那兩段的頁數，
 *   不可能出現「第 3 / 8 頁」卻只有 3 頁這種對不上的情形。
 * ⚠ perChamp／perRank 用參數傳進來、不讀 MP —— 這樣守衛可以獨立跑這支純函式。
 */
function mpPlanChampion(d, perChamp, perRank, sel) {
  const keys = (sel === null || sel === undefined)
    ? CR_SECTIONS.map(function (x) { return x.k; })
    : sel;
  const pages = [];
  keys.forEach(function (k) {
    const sec = CR_SECTIONS.filter(function (x) { return x.k === k; })[0];
    if (!sec) return;
    const list = crSectionRows(d, k);
    if (!list.length) return;
    const peak = (list[0] && list[0].n) ? list[0].n : 1;   // rows 已依 n 由大到小排序
    const chunks = mpPaginate(list, sec.per === 'champ' ? perChamp : perRank);
    chunks.forEach(function (c, i) {
      pages.push({
        kind: sec.kind, icon: sec.icon, title: sec.title, accent: sec.accent,
        unit: sec.unit, secKey: sec.k, peak: peak,
        rows: c.items, startRank: c.startRank, sectionTotal: list.length,
        sub: i + 1, subTotal: chunks.length,
      });
    });
  });
  return mpNumber(pages);
}

// ── 完整版的分段設定（勾選＋順序）：純函式部分 ──────────────────────────────
// ⚠⚠ Safari 無痕模式的 `localStorage.setItem` 會 **throw**（QuotaExceededError），
//   某些內嵌情境連讀 `localStorage` 這個屬性本身都會 throw ⇒ 一律包 try/catch。
//   失敗只代表「這台機器不記設定」，當下這一次的勾選／排序／產圖必須照常運作
//   （狀態放在記憶體的 _crFullSel，localStorage 只是持久化，不是真實來源）。
const CR_FULL_LSKEY = 'ptcgAdminChampFullSections';
function mpLsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function mpLsSet(key, val) { try { localStorage.setItem(key, val); return true; } catch (e) { return false; } }
function mpParseJson(txt) { try { return JSON.parse(txt); } catch (e) { return null; } }

/**
 * 把存下來的設定正規化成 [{ k, on }]：
 * ・照舊設定的順序排；未知 key 丟掉、重複 key 只留第一次
 * ・**這一版新增的區段補在最後、預設勾選** ⇒ 升級不會讓某一段靜默消失
 * ・完全讀不到（第一次用／localStorage 壞掉）＝四段全勾、預設順序
 */
function mpNormalizeSel(raw) {
  const known = CR_SECTIONS.map(function (x) { return x.k; });
  const out = [], seen = {};
  (Array.isArray(raw) ? raw : []).forEach(function (it) {
    const k = (it && typeof it === 'object') ? it.k : it;
    if (known.indexOf(k) < 0 || seen[k]) return;
    seen[k] = 1;
    out.push({ k: k, on: (it && typeof it === 'object') ? (it.on !== false) : true });
  });
  known.forEach(function (k) { if (!seen[k]) { seen[k] = 1; out.push({ k: k, on: true }); } });
  return out;
}


/**
 * 版面只放得下 3 則註腳，但 crNotes 最多會產 6 則；「已達查詢上限，更早的賽事未納入」
 * 是「完整版其實不完整」的唯一警訊，一旦 t4Skipped／noCut／noChamp 同時成立就會被擠掉。
 * ⇒ 把它提到第 2 則。⚠ 回新陣列，不動呼叫端傳進來的那份（單頁版還在用同一個 crNotes）。
 */
function mpHoistCapNote(notes) {
  const out = (notes || []).slice();
  const i = out.findIndex(function (t) { return String(t).indexOf('已達查詢上限') >= 0; });
  if (i > 1) out.splice(1, 0, out.splice(i, 1)[0]);
  return out;
}
// ══ MP-PURE-END ══════════════════════════════════════════════════════════════

// logo 只載一次並快取。⚠`drawImage` 一張尚未 decode 完成的 Image 會**靜默不畫也不報錯**，
//   成品就是 logo 憑空消失、完全沒有線索。用 decode() 而非 onload：它連解碼都等完。
//   （icons/ 與 admin 頁面同源，所以畫進 canvas 不會 taint、toBlob 可正常匯出。）
let _miLogo = null, _miLogoTried = false;
async function miLogo() {
  if (_miLogo || _miLogoTried) return _miLogo;
  _miLogoTried = true;
  try {
    const img = new Image();
    // ⚠v1.65：用**主站**的紅白球 icon，不是 admin 自己的紫色 ADMIN icon ——
    //   這張圖是要發給玩家的，落款當然要是玩家認得的站台識別。
    //   ⚠但**不可以**直接連 www.ptcg-tw-sim.com 的圖：跨來源圖片會把 canvas 標成
    //     tainted，toBlob() 直接拋 SecurityError、整張圖匯不出來。
    //     所以是把主站的 icon 複製一份到 oracle-admin/icons/site-icon-192.png（同源）。
    //     update-admin-full.bat 本來就會整包上傳 icons/，會一併帶上去。
    img.src = 'icons/site-icon-192.png?v=1.66';
    await img.decode();
    _miLogo = img;
  } catch (e) { _miLogo = null; }   // 載不到就退成純文字站名，不讓整張圖產不出來
  return _miLogo;
}

/**
 * 由「本期(since=N)」與「寬窗(since=2N)」推導前一個等長窗的變化。
 * 回 { ok:false, reason } 或 { ok:true, by:Map(ruleId→{isNew|dPP}), prevFrom, prevTo }。
 * ⚠寬窗是**含本期**的累計，一定要相減才是前期。
 */
function miTrend(days, cur, wide, srcKey) {
  const off = (reason) => ({ ok: false, reason });
  if (!(days > 0)) return off('統計範圍選「全部時間」時沒有可對比的前期');
  if (!wide) return off('前期資料讀取失敗');
  const c = cur[srcKey], w = wide[srcKey];
  if (!c || !w) return off('前期資料缺這個資料源');
  // ⚠若伺服器查詢有上限（依時間新到舊取），撞到上限代表寬窗的舊資料根本沒被掃到，
  //   相減會憑空生出一整片「下降」。v6.241／v6.242 之後兩個資料源都已是 cursor 全量掃描
  //   ⇒ MI_SCAN_CAP 兩側都是 Infinity，這道閘實務上不會觸發；它留著是為了「上限被加回去」的那天。
  const cap = MI_SCAN_CAP[srcKey];
  if ((wide.scanned && wide.scanned[cap[0]] || 0) >= cap[1]) return off('資料量已達伺服器查詢上限，前期不完整');
  const dk = miDeckKey(srcKey);
  const curN = (cur.scanned && cur.scanned[dk]) || 0;
  const prevN = ((wide.scanned && wide.scanned[dk]) || 0) - curN;
  if (curN <= 0) return off('本期沒有資料');
  // 前期明顯比本期少 → 多半是資料還沒累積滿兩期，這時算出來的「全面上升」是假象。
  if (prevN < curN * 0.3) return off('前期樣本過少（資料可能尚未累積滿兩期）');

  const wideUsage = new Map();
  for (const r of (w.rows || [])) wideUsage.set(String(r.ruleId), r.usage || 0);
  const by = new Map();
  for (const r of (c.rows || [])) {
    const id = String(r.ruleId);
    const prevUsage = (wideUsage.get(id) || 0) - (r.usage || 0);
    // 新原型（新彈剛發售）前期幾乎沒人用，算 Δ 會是無意義的暴漲 → 改標 NEW。
    if (prevUsage < 5) { by.set(id, { isNew: true }); continue; }
    const dPP = ((r.usage || 0) / curN - prevUsage / prevN) * 100;
    by.set(id, { isNew: false, dPP });
  }
  const now = Date.now();
  return { ok: true, by, curN, prevN, prevFrom: now - days * 2 * 86400000, prevTo: now - days * 86400000 };
}

/** 產生一張報告圖。回 canvas（該資料源沒有任何命中原型時回 null）。 */
async function miDraw(srcKey, cur, trend, days) {
  // ⭐ v1.71：rows／分母／佔比一律走 miComputeRows —— 單頁版與完整版（多頁）
  //   共用同一份口徑；任何一邊自己再算一次都會靜默漂移。
  const st = miComputeRows(srcKey, cur);
  if (!st) return null;
  const blk = st.blk;
  const S = MI.SRC[srcKey], K = MI.K;
  const rows = st.rows.slice(0, MI.TOPN);      // rows 後端已依 usage 由大到小排序
  const total = st.total;
  const share = st.share;

  const cv = document.createElement('canvas');
  cv.width = MI.W * MI.S; cv.height = MI.H * MI.S;
  const ctx = cv.getContext('2d');
  ctx.scale(MI.S, MI.S);            // 之後一律用邏輯座標（1080×1350）
  // ⚠預設 textBaseline='alphabetic' 對中文的視覺垂直中心偏移很明顯、混排數字更亂。
  //   全圖統一 middle + 以列中心 y 定位，省掉所有手調。
  ctx.textBaseline = 'middle';

  // ── 背景 ──
  const bg = ctx.createLinearGradient(0, 0, 0, MI.H);
  bg.addColorStop(0, K.bg0); bg.addColorStop(1, K.bg1);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, MI.W, MI.H);
  // 裝飾：斜置的卡牌剪影（63:88＝實體卡長寬比）。純程式繪製，不用任何官方素材。
  ctx.save();
  ctx.strokeStyle = K.ln; ctx.globalAlpha = 0.45; ctx.lineWidth = 2;
  for (const d of [[960, 46, 0.22], [96, 1290, -0.18]]) {
    for (let i = 0; i < 3; i++) {
      ctx.save(); ctx.translate(d[0], d[1]); ctx.rotate(d[2] + i * 0.17);
      miRR(ctx, -63, -88, 126, 176, 10); ctx.stroke(); ctx.restore();
    }
  }
  ctx.restore();

  // ── 品牌帶（0–140）──
  const logo = await miLogo();
  let tx = MI.PAD;
  if (logo) { ctx.drawImage(logo, MI.PAD, 30, 76, 76); tx = MI.PAD + 94; }
  ctx.textAlign = 'left';
  ctx.fillStyle = K.txt; miFont(ctx, 38, true);
  ctx.fillText('PTCG 台灣線上對戰模擬器', tx, 56);
  ctx.fillStyle = K.dim; miFont(ctx, 26, false);
  ctx.fillText(MI_URL, tx, 92);
  ctx.textAlign = 'right';
  ctx.fillStyle = K.dim; miFont(ctx, 24, false);
  ctx.fillText('資料截至 ' + new Date().toLocaleDateString('zh-TW'), MI.W - MI.PAD, 56);

  // ── 標題帶（140–260）──
  ctx.fillStyle = S.a1;
  miRR(ctx, MI.PAD, 166, 8, 62, 4); ctx.fill();
  ctx.textAlign = 'left';
  ctx.fillStyle = K.txt; miFont(ctx, 54, true);
  ctx.fillText('本期牌組環境報告', MI.PAD + 24, 190);
  const period = days > 0
    ? miDate(Date.now() - days * 86400000) + '–' + miDate(Date.now())
    : '全部時間';
  ctx.fillStyle = K.dim; miFont(ctx, 28, false);
  ctx.fillText(S.label + '　・　' + period + '　・　共 ' + total.toLocaleString('zh-TW') + ' 副',
               MI.PAD + 24, 234);

  // ── 欄位表頭（玩家不會知道 bar 跟右邊那個大數字各是什麼，一定要標）──
  ctx.textAlign = 'left';
  ctx.fillStyle = K.dim; miFont(ctx, 22, false);
  ctx.fillText('牌組', 116, 268);
  ctx.fillText('使用率 ・ 使用次數', 508, 268);
  ctx.textAlign = 'right';
  ctx.fillText('勝率', 1012, 268);

  // ── 排行區（286–1173）：10 列 × 86，列距 3 ──
  // 版面：排名 48–102｜名稱與 bar 116–690｜勝率右對齊 1012
  const maxShare = Math.max.apply(null, rows.map((r) => share(r.usage))) || 1;
  rows.forEach((r, i) => {
    const y = 286 + i * 89;
    ctx.fillStyle = K.row; miRR(ctx, MI.PAD, y, MI.W - MI.PAD * 2, 86, 12); ctx.fill();
    if (i < 3) {   // 前三名左緣加獎牌色邊條
      ctx.fillStyle = [K.r1, K.r2, K.r3][i];
      miRR(ctx, MI.PAD, y, 5, 86, 3); ctx.fill();
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = i < 3 ? K.r1 : K.dim; miFont(ctx, 34, true);
    ctx.fillText(String(i + 1), MI.PAD + 34, y + 43);

    // 上層：原型名（＋趨勢）
    ctx.textAlign = 'left';
    ctx.fillStyle = K.txt; miFont(ctx, 32, true);
    ctx.fillText(miFit(ctx, r.name, 360), 116, y + 26);
    const t = trend && trend.ok ? trend.by.get(String(r.ruleId)) : null;
    if (t && t.isNew) {
      miFont(ctx, 22, true);
      const w = ctx.measureText('新登場').width + 20;
      ctx.fillStyle = K.r1; miRR(ctx, 500, y + 13, w, 27, 13); ctx.fill();
      ctx.fillStyle = K.bg1; ctx.textAlign = 'center';
      ctx.fillText('新登場', 500 + w / 2, y + 26);
      ctx.textAlign = 'left';
    } else if (t && typeof t.dPP === 'number') {
      // ±1.5 個百分點以內視為雜訊，畫成灰色「持平」。不設門檻的話 ±0.2 也會被讀成趨勢。
      // ⚠給玩家看的圖不寫「pp」「n=」這類統計術語，一律講人話。
      const up = t.dPP >= 1.5, dn = t.dPP <= -1.5;
      ctx.fillStyle = up ? K.up : (dn ? K.dn : K.mid); miFont(ctx, 24, true);
      ctx.fillText(up ? '▲ 較上期 +' + t.dPP.toFixed(1) + '%'
                 : (dn ? '▼ 較上期 ' + t.dPP.toFixed(1) + '%' : '－ 與上期持平'), 500, y + 26);
    }

    // 下層：使用率長條（以榜內最大佔比為滿長）＋ 佔比與樣本數
    const bw = Math.max(6, Math.round(380 * share(r.usage) / maxShare));
    const g = ctx.createLinearGradient(116, 0, 116 + bw, 0);
    g.addColorStop(0, S.a1); g.addColorStop(1, S.a2);
    ctx.fillStyle = K.ln; miRR(ctx, 116, y + 52, 380, 16, 8); ctx.fill();
    ctx.fillStyle = g; miRR(ctx, 116, y + 52, bw, 16, 8); ctx.fill();
    ctx.fillStyle = K.dim; miFont(ctx, 23, false);
    ctx.fillText(miPct(share(r.usage)) + '　・　' + r.usage + ' 次', 508, y + 60);

    // 右欄：勝率大數字（三段色）。⚠樣本 <10 副一律顯示「—」，不管實際值多少。
    ctx.textAlign = 'right';
    if (!r.sampleOk || r.winRate === null || r.winRate === undefined) {
      ctx.fillStyle = K.mid; miFont(ctx, 40, true);
      ctx.fillText('—', 1012, y + 32);
      ctx.fillStyle = K.dim; miFont(ctx, 21, false);
      ctx.fillText('資料太少', 1012, y + 64);
    } else {
      ctx.fillStyle = r.winRate >= 0.52 ? K.up : (r.winRate < 0.48 ? K.dn : K.mid);
      miFont(ctx, 46, true);
      ctx.fillText(miPct(r.winRate), 1012, y + 32);
      ctx.fillStyle = K.dim; miFont(ctx, 21, false);
      ctx.fillText('勝率', 1012, y + 64);
    }
  });

  // ── 未分類帶（1170–1250）──
  // 未分類刻意**不進排行**：它的 usage 常常是第一名，混進去會有一根巨大的「未分類」
  //   長條主宰整張圖、資訊量為零。改成獨立一行誠實揭露。
  const u = blk.unclassified || {};
  ctx.textAlign = 'left';
  ctx.strokeStyle = K.ln; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(MI.PAD, 1192); ctx.lineTo(MI.W - MI.PAD, 1192); ctx.stroke();
  ctx.fillStyle = K.dim; miFont(ctx, 24, false);
  ctx.fillText('未分類 ' + (u.usage || 0).toLocaleString('zh-TW') + ' 副（'
    + miPct(share(u.usage || 0)) + '　・　勝率 ' + (u.winRate === null || u.winRate === undefined ? '—' : miPct(u.winRate))
    + '）　・　分類規則持續擴充中', MI.PAD, 1222);

  // ── 頁腳（1250–1350）：網址在圖上出現兩次（頂部小、底部大置中），
  //    被裁切時至少留一個。──
  ctx.textAlign = 'center';
  const cx = MI.W / 2;
  // ⚠給玩家看的圖，說明一律講人話 —— 不寫 pp / n= / 樣本數 這類統計術語。
  const foot = (trend && trend.ok)
    ? '▲▼ 是與上一期（' + miDate(trend.prevFrom) + '–' + miDate(trend.prevTo)
      + '）相比的使用率增減，變化不到 1.5% 視為持平　・　使用不到 10 次的牌組不顯示勝率'
    : '本期為單期成績，未與上期比較' + (trend && trend.reason ? '（' + trend.reason + '）' : '')
      + '　・　使用不到 10 次的牌組不顯示勝率';
  // ⭐ v1.73：註腳以前置中「單行」直畫、完全沒做寬度處理 —— 一旦比畫布寬，
  //   置中繪製會讓**左右兩端同時**被裁掉（站長回報開頭「本」與結尾「率」都消失）。
  //   站長要的是完整內容 ⇒ 不可用 miFit 截斷，改 miWrap 換行；
  //   兩行時整個頁腳（logo＋網址＋註腳）上移，第二行仍收在畫布下緣 1350 之內。
  miFont(ctx, 22, false);
  let footPx = 22;
  let footLines = miWrap(ctx, foot, MI.W - MI.PAD * 2);
  if (footLines.length > 2) {          // 目前的文案組合到不了 3 行；真到了就縮一級再換行
    footPx = 19; miFont(ctx, footPx, false);
    footLines = miWrap(ctx, foot, MI.W - MI.PAD * 2);
    // 縮到 19px 還超過 2 行＝空間硬性不足，尾行才退回 miFit 截斷（唯一允許截斷的情況）
    if (footLines.length > 2) footLines = [footLines[0], miFit(ctx, footLines.slice(1).join(''), MI.W - MI.PAD * 2)];
  }
  const footTwo = footLines.length > 1;
  const urlY = footTwo ? 1266 : 1284;  // 兩行時網址列上移 18px 騰出空間；單行時版面與 v1.72 完全一致
  miFont(ctx, 30, true);
  const uw = ctx.measureText(MI_URL).width;
  if (logo) ctx.drawImage(logo, cx - uw / 2 - 44, urlY - 16, 32, 32);
  ctx.fillStyle = K.txt;
  ctx.fillText(MI_URL, cx + (logo ? 18 : 0), urlY);
  ctx.fillStyle = K.dim; miFont(ctx, footPx, false);
  let footY = footTwo ? 1301 : 1322;   // 兩行＝1301／1329：下緣≈1342 < 1350、上緣≈1290 不撞網址（其下緣≈1281）
  for (const footLn of footLines) { ctx.fillText(footLn, cx, footY); footY += footPx + 6; }
  return cv;
}

// ── 匯出流程 ────────────────────────────────────────────────────────────────
let _miBusy = false;
let _miOut = { casual: null, tourn: null, stamp: '' };

window.openMetaImageExport = async function () {
  if (_miBusy) return;                       // 連點防呆
  if (!_archStats) { alert('請先按「📊 計算統計」。'); return; }
  const btn = document.getElementById('meta-img-btn');
  const label = btn ? btn.textContent : '';
  _miBusy = true;
  if (btn) { btn.disabled = true; btn.textContent = '產生中…'; }
  try {
    // ⚠先把資料與參數快照成區域變數：產圖期間使用者可能又去動了時間下拉。
    const cur = _archStats;
    const days = Number(currentArchSince() || 0);
    let wide = null;
    if (days > 0) {
      // 寬窗＝2N 天（含本期），相減才是「前一個等長窗」。失敗就降級成無趨勢快照，不整個失敗。
      try {
        const r = await api('/api/admin/deck-archetype-stats?source=all&since='
          + (Date.now() - days * 2 * 86400000));
        if (r && !r.error) wide = r;
      } catch (e) { wide = null; }
    }
    _miOut = {
      casual: await miDraw('casual', cur, miTrend(days, cur, wide, 'casual'), days),
      tourn: await miDraw('tourn', cur, miTrend(days, cur, wide, 'tourn'), days),
      stamp: miStamp(Date.now()),
    };
    if (!_miOut.casual && !_miOut.tourn) { alert('目前沒有任何命中的牌組原型，無法產圖。'); return; }
    renderMetaImageModal(_miOut.casual ? 'casual' : 'tourn');
  } catch (e) {
    alert('產圖失敗：' + (e && e.message ? e.message : e));
  } finally {
    _miBusy = false;
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
};

// 預覽 modal：先看再存。手機上 a[download] 會改開新分頁，這裡改成長按圖片儲存即可。

window.downloadMetaImage = function (srcKey) {
  const cv = _miOut[srcKey];
  if (!cv) return;
  cv.toBlob(function (blob) {          // ⚠toBlob 是 callback 非同步，不是回傳值
    if (!blob) { alert('產生檔案失敗'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    // 檔名全 ASCII：中文檔名在部分聊天軟體上傳時會有編碼問題。
    a.download = 'ptcg-meta-' + srcKey + '-' + (_miOut.stamp || miStamp(Date.now())) + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    // ⚠立即 revoke 會讓部分瀏覽器取消下載，要延遲。
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }, 'image/png');
};

// ══ v1.71 完整版（多頁）報告圖：站長每週宣傳影片的素材 ══════════════════════
//
// 站長的流程：admin 按一下 → 拿到一疊 PNG → 拖進 Canva → 配背景音樂 → 上傳 YouTube。
// 設計約束跟單頁版（4:5 直式、給 LINE／FB 轉發）完全不同：
//
//   ・**16:9 1920×1080、1× 輸出**：成品是 1080p 影片，畫布就等於影片的一個 frame。
//     再放大 2× 只會被 Canva／YouTube 縮回去，白白多吃 4 倍記憶體（見下面的釋放）。
//   ・**每頁尺寸完全一致**，最後一頁不足就留白、絕不縮版 —— 尺寸一跳，影片播放時會抖。
//   ・**一筆都不截斷**：分頁走純函式 mpPlanMeta／mpPlanChampion，
//     所有頁的筆數加總 === 原始筆數（守衛實跑釘住）。
//   ・**每頁 7 筆**（v1.72 站長裁定，原本 8、更早評估過的 10）：
//     可用的列區是 y=296（TOP）到 y=936（NOTE_Y-22 那條註腳分隔線）＝ **640px**，
//     上面是品牌帶（0–140）＋標題帶（140–250）＋欄位表頭（268），
//     下面是註腳（958／986／1014）與頁腳（1052）的**硬保留區**。
//       ・8 筆：8×72 + 7×8 = 632px（列高 72）→ 原型名 38px、勝率 46px
//       ・7 筆：7×83 + 6×8 = 629px（列高 **83**，底 y=925，離分隔線 936 還有 11px）
//              → 原型名 **42px**、勝率 **50px**、名次 42px、較上期／使用率 35px、
//                使用次數 33px、欄位表頭 26px、長條高 20px（各約 ×1.10~1.15 等比放大）
//     影片會被觀眾在手機上以約 400px 寬觀看（縮 0.21 倍）：42px 的原型名只剩 8.8px，
//     38px 只剩 7.9px —— 字級是這裡唯一該優先保住的東西，多 14% 的頁數換得起。
//   ・**冠軍（逐場）維持每頁 5 筆**：它的列高是 116（一列兩行：賽事名／冠軍＋牌組），
//     5×116 + 4×10 = 620px 已經幾乎吃滿那 640px；6 列要 746px，放不下。
//   ・**檔名 01.png／02.png…**（頁數超過 99 自動補到 3 位）：Canva 匯入後就是正確順序。
//   ・**ZIP 用 store（不壓縮）自己寫**：PNG 本來就已壓縮、store 不會變大；
//     admin.html 目前只有 firebase 一個外部相依，不想為了打包再拉一支 CDN 函式庫進來
//     （VM 端網路不穩時等於多一個單點失敗，而且離線就整個功能死掉）。

const MP = {
  W: 1920, H: 1080, S: 1, PAD: 72,
  // ⭐ v1.72（站長裁定）名次類每頁 8 → **7** 筆：頁數多約 14%，換來每一列都放得下更大的字。
  PER: 7,
  PER_CHAMP: 5,      // 冠軍逐場列（資訊較多、列高 116）每頁筆數；7 筆的改動不動它，理由見上方說明
  ROW: 83, GAP: 8, ROW_CHAMP: 116, GAP_CHAMP: 10,
  TOP: 296,          // 列區起點 y
  NOTE_Y: 958, FOOT_Y: 1052,
};

// ══ MP-ZIP-BEGIN ── store-only ZIP（不壓縮）。純函式，守衛可實跑驗結構 ═════════
const _mpCrcTab = (function () {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function mpCrc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = _mpCrcTab[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
/**
 * files = [{ name, bytes:Uint8Array }] → ZIP Blob（method 0＝store）。
 * ⚠ DOS 時間欄位要給真的值：填 0 等於 1980-00-00，部分解壓工具會抱怨或顯示怪日期。
 */
function mpZip(files) {
  const enc = new TextEncoder();
  const u16 = (v) => [v & 255, (v >>> 8) & 255];
  const u32 = (v) => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  const now = new Date();
  const dosT = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const dosD = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
  const parts = [], central = [];
  let off = 0, cdSize = 0;
  for (const f of files) {
    const nm = enc.encode(f.name);
    const crc = mpCrc32(f.bytes), sz = f.bytes.length;
    const lh = new Uint8Array([].concat(
      u32(0x04034b50), u16(20), u16(0), u16(0), u16(dosT), u16(dosD),
      u32(crc), u32(sz), u32(sz), u16(nm.length), u16(0)));
    parts.push(lh, nm, f.bytes);
    const ch = new Uint8Array([].concat(
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(dosT), u16(dosD),
      u32(crc), u32(sz), u32(sz), u16(nm.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(off)));
    central.push(ch, nm);
    cdSize += ch.length + nm.length;
    off += lh.length + nm.length + sz;
  }
  const end = new Uint8Array([].concat(
    u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(cdSize), u32(off), u16(0)));
  return new Blob(parts.concat(central, [end]), { type: 'application/zip' });
}
// ══ MP-ZIP-END ═══════════════════════════════════════════════════════════════

/**
 * 逐頁產圖 → PNG bytes → 打包成 ZIP。
 * ⚠ 一張 1920×1080 的 canvas 就佔約 8MB，十幾頁全留著會直接把分頁吃爆 ⇒
 *   每頁轉完 blob 就把 canvas 縮成 1×1 讓 GC 回收（只釋放 backing store，不需 dispose）。
 * ⚠ 每一頁的畫布尺寸都是同一組常數，不隨內容變動 —— 尺寸不一致剪成影片會跳動。
 */
async function mpExportPages(pages, drawFn, btn) {
  const files = [];
  const pad = Math.max(2, String(pages.length).length);
  // ⚠ 現在 admin 全用系統字體，沒有 webfont；但只要哪天加了，第 1 頁會用 fallback 量寬、
  //   後面幾頁用真字體，同一個牌組名在不同頁的截斷位置就會不一樣。一行保險。
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) { /* 舊瀏覽器沒有就算了 */ } }
  // ⚠ miLogo 的 img.decode() 沒有逾時：icon 請求 hang 住（不是失敗，是不回應）時，
  //   第一頁的 await 會永遠等下去、按鈕停在「產生中…」而且連 finally 都到不了。
  //   先在這裡用一個有逾時的 race 預熱：逾時後 miLogo 內的 _miLogoTried 已經是 true，
  //   後續每頁再呼叫都會立刻回 null（退成純文字站名），整批圖照樣產得完。
  await Promise.race([
    miLogo().catch(function () { return null; }),
    new Promise(function (r) { setTimeout(r, 8000); }),
  ]);
  for (let i = 0; i < pages.length; i++) {
    if (btn) btn.textContent = '產生中… ' + (i + 1) + '/' + pages.length;
    const cv = document.createElement('canvas');
    cv.width = MP.W * MP.S; cv.height = MP.H * MP.S;
    const ctx = cv.getContext('2d');
    if (MP.S !== 1) ctx.scale(MP.S, MP.S);
    ctx.textBaseline = 'middle';
    await drawFn(ctx, pages[i]);
    const blob = await new Promise(function (res) { cv.toBlob(res, 'image/png'); });
    if (!blob) throw new Error('第 ' + (i + 1) + ' 頁產生失敗');
    files.push({ name: String(i + 1).padStart(pad, '0') + '.png',
                 bytes: new Uint8Array(await blob.arrayBuffer()) });
    cv.width = 1; cv.height = 1;
  }
  return mpZip(files);
}

function mpSaveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  // ⚠立即 revoke 會讓部分瀏覽器取消下載，要延遲。
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

/** 共用頁框：底、卡牌剪影、品牌帶、標題帶、**頁碼**、註腳保留區、頁腳。 */
async function mpFrame(ctx, o) {
  const K = MI.K, W = MP.W, H = MP.H, PAD = MP.PAD;
  ctx.textBaseline = 'middle';
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, K.bg0); bg.addColorStop(1, K.bg1);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.strokeStyle = K.ln; ctx.globalAlpha = 0.4; ctx.lineWidth = 2;
  for (const d of [[1770, 150, 0.22], [140, 950, -0.18]]) {
    for (let i = 0; i < 3; i++) {
      ctx.save(); ctx.translate(d[0], d[1]); ctx.rotate(d[2] + i * 0.17);
      miRR(ctx, -63, -88, 126, 176, 10); ctx.stroke(); ctx.restore();
    }
  }
  ctx.restore();

  // ⚠ logo 一律走既有的 miLogo（內含 await img.decode()）—— drawImage 一張尚未 decode 的
  //   Image 會**靜默不畫也不報錯**；多頁版一次畫十幾張，人工更不可能發現漏了哪一張。
  const logo = await miLogo();
  let tx = PAD;
  if (logo) { ctx.drawImage(logo, PAD, 34, 88, 88); tx = PAD + 108; }
  ctx.textAlign = 'left';
  ctx.fillStyle = K.txt; miFont(ctx, 42, true);
  ctx.fillText('PTCG 台灣線上對戰模擬器', tx, 62);
  ctx.fillStyle = K.dim; miFont(ctx, 28, false);
  ctx.fillText(MI_URL, tx, 104);

  ctx.textAlign = 'right';
  ctx.fillStyle = K.dim; miFont(ctx, 26, false);
  ctx.fillText('資料截至 ' + new Date().toLocaleDateString('zh-TW'), W - PAD, 56);
  ctx.fillStyle = K.txt; miFont(ctx, 34, true);
  ctx.fillText('第 ' + o.page + ' / ' + o.pageTotal + ' 頁', W - PAD, 104);

  ctx.textAlign = 'left';
  ctx.fillStyle = o.accent; miRR(ctx, PAD, 148, 10, 72, 5); ctx.fill();
  ctx.fillStyle = K.txt; miFont(ctx, 60, true);
  ctx.fillText(o.title, PAD + 30, 182);
  ctx.fillStyle = K.dim; miFont(ctx, 30, false);
  ctx.fillText(miFit(ctx, o.sub, W - PAD * 2 - 40), PAD + 30, 234);

  // 註腳是硬保留區：列區永遠畫不到這裡（每頁筆數固定，不會像單頁版那樣長高）。
  ctx.strokeStyle = K.ln; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PAD, MP.NOTE_Y - 22); ctx.lineTo(W - PAD, MP.NOTE_Y - 22); ctx.stroke();
  // ⚠ 影片會被觀眾在手機上以約 400px 寬觀看（縮 0.21 倍）：22px 的註腳只剩 4.6px，等於沒寫。
  //   拉到 24px／行距 28（三行下緣 1026，離頁腳的 logo 頂 1036 還有 10px）。
  ctx.fillStyle = K.dim; miFont(ctx, 24, false);
  let ny = MP.NOTE_Y;
  for (const t of (o.notes || []).slice(0, 3)) { ctx.fillText(miFit(ctx, t, W - PAD * 2 - 40), PAD, ny); ny += 28; }

  // 頁腳：網址在圖上出現兩次（頂部小、底部大）—— 被裁切時至少留一個。
  ctx.textAlign = 'center';
  const cx = W / 2;
  miFont(ctx, 28, true);
  const line = MI_URL + '　・　本站為非官方、非營利之愛好者社群交流平台';
  const lw = ctx.measureText(line).width;
  if (logo) ctx.drawImage(logo, cx - lw / 2 - 46, MP.FOOT_Y - 16, 32, 32);
  ctx.fillStyle = K.txt;
  ctx.fillText(line, cx, MP.FOOT_Y);
  ctx.textAlign = 'left';
}

/** 完整版：環境報告的一頁（版面 16:9，一列一筆）。 */
async function mpDrawMeta(ctx, p) {
  const K = MI.K, S = MI.SRC[p.srcKey], PAD = MP.PAD, W = MP.W;
  const share = p.st.share;
  const period = p.days > 0
    ? miDate(Date.now() - p.days * 86400000) + '–' + miDate(Date.now())
    : '全部時間';
  const last = p.startRank + p.rows.length - 1;
  await mpFrame(ctx, {
    page: p.page, pageTotal: p.pageTotal, accent: S.a1,
    title: '本期牌組環境報告',
    sub: S.label + '　・　' + period + '　・　共 ' + p.st.total.toLocaleString('zh-TW') + ' 副'
       + '　・　第 ' + p.startRank + '–' + last + ' 名（全部 ' + p.sectionTotal + ' 種牌組）',
    notes: p.notes || [],
  });

  ctx.textAlign = 'left';
  ctx.fillStyle = K.dim; miFont(ctx, 26, false);
  ctx.fillText('牌組', 168, 268);
  ctx.fillText('較上期', 706, 268);
  ctx.fillText('使用率', 1012, 268);
  ctx.fillText('使用次數', 1470, 268);
  ctx.textAlign = 'right';
  ctx.fillText('勝率', W - PAD, 268);
  ctx.textAlign = 'left';

  const peak = p.peak || 1;
  p.rows.forEach(function (r, i) {
    const y = MP.TOP + i * (MP.ROW + MP.GAP), mid = y + MP.ROW / 2;
    const rank = p.startRank + i;
    ctx.fillStyle = K.row; miRR(ctx, PAD, y, W - PAD * 2, MP.ROW, 12); ctx.fill();
    if (rank <= 3) { ctx.fillStyle = [K.r1, K.r2, K.r3][rank - 1]; miRR(ctx, PAD, y, 6, MP.ROW, 3); ctx.fill(); }
    ctx.textAlign = 'center';
    ctx.fillStyle = rank <= 3 ? K.r1 : K.dim; miFont(ctx, 42, true);
    ctx.fillText(String(rank), PAD + 44, mid);

    ctx.textAlign = 'left';
    ctx.fillStyle = K.txt; miFont(ctx, 42, true);
    ctx.fillText(miFit(ctx, r.name, 500), 168, mid);

    const t = p.trend && p.trend.ok ? p.trend.by.get(String(r.ruleId)) : null;
    if (t && t.isNew) {
      miFont(ctx, 28, true);
      const tw = ctx.measureText('新登場').width + 26;
      ctx.fillStyle = K.r1; miRR(ctx, 706, mid - 20, tw, 40, 20); ctx.fill();
      ctx.fillStyle = K.bg1; ctx.textAlign = 'center';
      ctx.fillText('新登場', 706 + tw / 2, mid);
      ctx.textAlign = 'left';
    } else if (t && typeof t.dPP === 'number') {
      // ±1.5 個百分點以內視為雜訊。⚠給玩家看的圖不寫 pp／n= 這類統計術語。
      const up = t.dPP >= 1.5, dn = t.dPP <= -1.5;
      // ⚠ 這裡不重複寫「較上期」：表頭已經寫了、註腳也解釋了，省下來的寬度拿去把字級
      //   從 28 拉到 32（手機上 28px ≈ 5.8px，讀不到）。
      ctx.fillStyle = up ? K.up : (dn ? K.dn : K.mid); miFont(ctx, 35, true);
      ctx.fillText(up ? '▲ +' + t.dPP.toFixed(1) + '%'
                 : (dn ? '▼ ' + t.dPP.toFixed(1) + '%' : '－ 持平'), 706, mid);
    }

    const bw = Math.max(6, Math.round(300 * share(r.usage) / peak));
    const g = ctx.createLinearGradient(1012, 0, 1012 + bw, 0);
    g.addColorStop(0, S.a1); g.addColorStop(1, S.a2);
    ctx.fillStyle = K.ln; miRR(ctx, 1012, mid - 10, 300, 20, 10); ctx.fill();
    ctx.fillStyle = g; miRR(ctx, 1012, mid - 10, bw, 20, 10); ctx.fill();
    ctx.fillStyle = K.txt; miFont(ctx, 35, false);
    ctx.fillText(miPct(share(r.usage)), 1330, mid);      // 「100.0%」35px 約 116px 寬，止於 ~1446（欄距 1470）
    ctx.fillStyle = K.dim; miFont(ctx, 33, false);
    ctx.fillText(r.usage + ' 次', 1470, mid);            // 「99999 次」33px 約 142px，止於 ~1612

    // ⚠樣本 <10 副一律顯示「—」，不管實際值多少（1 勝 0 負 = 100% 被截圖傳開就收不回來）。
    ctx.textAlign = 'right';
    if (!r.sampleOk || r.winRate === null || r.winRate === undefined) {
      ctx.fillStyle = K.mid; miFont(ctx, 33, true);
      ctx.fillText('—　資料太少', W - PAD, mid);          // 33px 約 198px 寬，起點 ~1650，不撞使用次數（止於 1612）
    } else {
      ctx.fillStyle = r.winRate >= 0.52 ? K.up : (r.winRate < 0.48 ? K.dn : K.mid);
      miFont(ctx, 50, true);
      ctx.fillText(miPct(r.winRate), W - PAD, mid);
    }
    ctx.textAlign = 'left';
  });
}

/** 註腳：與單頁版同一套說明；未分類只印在該資料源的最後一頁。 */
function mpMetaNotes(p, trend) {
  const notes = [];
  notes.push((trend && trend.ok)
    ? '▲▼ 是與上一期（' + miDate(trend.prevFrom) + '–' + miDate(trend.prevTo)
      + '）相比的使用率增減，變化不到 1.5% 視為持平　・　使用不到 10 次的牌組不顯示勝率'
    : '本期為單期成績，未與上期比較' + (trend && trend.reason ? '（' + trend.reason + '）' : '')
      + '　・　使用不到 10 次的牌組不顯示勝率');
  if (p.sub === p.subTotal) {
    const u = (p.st.blk && p.st.blk.unclassified) || {};
    notes.push('未分類 ' + (u.usage || 0).toLocaleString('zh-TW') + ' 副（'
      + miPct(p.st.share(u.usage || 0)) + '　・　勝率 '
      + (u.winRate === null || u.winRate === undefined ? '—' : miPct(u.winRate))
      + '）　・　分類規則持續擴充中');
  }
  return notes;
}

let _mpBusy = false;

window.openMetaImageFullExport = async function () {
  if (_mpBusy) return;
  if (!_archStats) { alert('請先按「📊 計算統計」。'); return; }
  const btn = document.getElementById('meta-img-full-btn');
  const label = btn ? btn.textContent : '';
  _mpBusy = true;
  if (btn) { btn.disabled = true; btn.textContent = '產生中…'; }
  try {
    // ⚠先把資料與參數快照成區域變數：產圖期間使用者可能又去動了時間下拉。
    const cur = _archStats;
    const days = Number(currentArchSince() || 0);
    let wide = null;
    if (days > 0) {
      // 寬窗＝2N 天（含本期），相減才是「前一個等長窗」。與單頁版同一個推導。
      try {
        const r = await api('/api/admin/deck-archetype-stats?source=all&since='
          + (Date.now() - days * 2 * 86400000));
        if (r && !r.error) wide = r;
      } catch (e) { wide = null; }

    const pages = mpPlanMeta(cur, MP.PER);
    if (!pages.length) { alert('目前沒有任何命中的牌組原型，無法產圖。'); return; }
    const trends = { casual: miTrend(days, cur, wide, 'casual'), tourn: miTrend(days, cur, wide, 'tourn') };
    for (const p of pages) {

  } catch (e) {
    alert('產圖失敗：' + (e && e.message ? e.message : e));
  } finally {
    _mpBusy = false;
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
};


// ══ v1.66（站台 v6.111）奪冠報告圖 ═══════════════════════════════════════════
//
// 跟「牌組環境報告圖」是**兩種量綱**，所以是兩張圖不是兩個分頁：
//   環境報告＝連續的份額／勝率（分母是幾千場對局，畫比率有意義）；
//   奪冠報告＝**離散的個位數事件**（一期可能只有 3 場網站賽）。
//   ⭐ 因此本圖**全圖不出現任何百分比**，一律「N 場」「N 次」「N 人次」。
//   ⚠ v1.72 單位詞逐處校正：牌組榜的 n 是「發生了幾次」→「次」；只有真的在數人的地方
//     （註腳「準決賽的 4 位選手」）才是「位」。逐段判斷見 CR_SECTIONS 上方。
//   同理不做「較上期 ▲▼」——奪冠數的期間差幾乎全是噪音（環境圖的 miTrend 不引用）。
//
// 資料來源兩份，用 eventId／uid 對照：
//   ① `tournStatsCache`（/api/tournament/admin/stats）— 賽事名／時間／人數／matches／deckEntries
//   ② `/api/admin/champion-report` — 伺服器端算好的「冠軍與四強 → 牌組原型」
//      ⭐ 為什麼要後端算：分類要用 classifyDeck（總表與明細共用的同一份），
//         前端自己抄一份必然漂移；而且伺服器的卡名對照與前端的 CARDS_BASE 是兩份來源。
//      ⚠ 端點刻意**不回 deckEntries** —— 那份 ① 已經有了，再傳一次每場 N×60 張很肥。
//
// ⚠⚠ 一律用 `tournStatsCache.archives` **全量**，不可以用被 tsEventFilter 篩過的那份：
//   使用者切到「社群自辦賽」再按產圖，網站賽區塊會整塊空掉，而且完全不會報錯。
const CR = {
  MAXCHAMP: 3,       // 冠軍列最多幾列（超過改成「冠軍牌組次數榜」）
  MAXTOP4: 6,        // 四強牌組榜最多幾列
  MAXCOMM: 5,        // 社群賽奪冠牌組榜最多幾列（列高 56，比冠軍列 92 省空間）
  MIN_FOR_TOP4: 8,   // ⭐ 參賽 < 8 人不計四強：4 人賽的「四強」＝全體參賽者，數字正確但荒謬
};
let _crOut = null, _crBusy = false;

/** 把兩份資料聚合成畫圖用的結構。archives 必須是**全量**（未經 tsEventFilter 過濾）。 */
function crBuild(allArchives, reportMap, days) {
  const since = days > 0 ? (Date.now() - days * 86400000) : 0;
  const inRange = (a) => !since || (a.finishedAt || 0) >= since;
  const arcs = (allArchives || []).filter(inRange);
  const site = arcs.filter((a) => !a.communityEvent);
  const comm = arcs.filter((a) => !!a.communityEvent);
  // 冠軍那副牌的原型：後端分類優先 → 玩家自填牌組名 → 主力寶可夢 → 未分類
  const deckLabel = (a, uid, arch) => {
    if (arch) return arch;
    const p = (a.players || []).find((x) => String(x.uid) === String(uid));
    if (p && p.deckName) return p.deckName;
    const main = p && p.deckEntries ? detectMainPokemon(p.deckEntries) : null;
    return main || '（未分類）';
  };
  const champRow = (a) => {
    const rep = reportMap.get(a.eventId) || {};
    const uid = a.championUid || rep.championUid || null;
    if (!uid) return null;                       // 取消場／雙方未進場：沒有冠軍
    const p = (a.players || []).find((x) => String(x.uid) === String(uid));
    let w = 0, l = 0;
    for (const m of (a.matches || [])) {
      if (!m || m.bye || !m.winnerUid) continue;
      if (String(m.p1uid) === String(uid) || String(m.p2uid) === String(uid)) {
        if (String(m.winnerUid) === String(uid)) w++; else l++;
      }
    }
    let rounds = 0;
    for (const m of (a.matches || [])) if ((m.round || 1) > rounds) rounds = m.round || 1;
    return {
      eventId: a.eventId, eventName: a.eventName || '賽事',
      // v6.244：圖上印的是**開賽日**；finishedAt（冠軍產生時間）保留在資料裡但不拿來當日期。
      startedAt: tournStartMs(a), finishedAt: a.finishedAt || 0,
      name: (p && p.name) || a.championName || '—',
      deck: deckLabel(a, uid, rep.championArchetype), players: a.playerCount || 0, w: w, l: l, rounds: rounds,
    };
  };
  const siteChamps = site.map(champRow).filter(Boolean);
  // ⭐ v6.112（Wilson）：社群賽**不列玩家名字** —— 這張圖是給玩家看「哪些牌組目前強勢」，
  //   不是個人成績表。社群賽改成「該期間奪冠次數最多的前幾名牌組」。
  const commChampRows = comm.map(champRow).filter(Boolean);
  const commMap = new Map();
  for (const c of commChampRows) commMap.set(c.deck, (commMap.get(c.deck) || 0) + 1);
  const commRank = [...commMap.entries()].map(([name, n]) => ({ name: name, n: n }))
    .sort((x, y) => y.n - x.n || x.name.localeCompare(y.name));
  // 四強牌組次數（只計網站賽、且參賽 >= MIN_FOR_TOP4 人；口徑與大廳排行榜一致：社群賽不算名次）
  const t4 = new Map();
  let t4Events = 0, t4Skipped = 0, noCut = 0, noChamp = site.length - siteChamps.length;
  for (const a of site) {
    const rep = reportMap.get(a.eventId);
    if (!rep || !rep.placementsOk) { noCut++; continue; }
    if ((a.playerCount || 0) < CR.MIN_FOR_TOP4) { t4Skipped++; continue; }
    t4Events++;
    for (const e of (rep.top4 || [])) {
      const k = deckLabel(a, e.uid, e.archetype);
      t4.set(k, (t4.get(k) || 0) + 1);
    }
  }
  const t4Rows = [...t4.entries()].map(([name, n]) => ({ name: name, n: n }))
    .sort((x, y) => y.n - x.n || x.name.localeCompare(y.name));
  const t4Total = t4Rows.reduce((s, r) => s + r.n, 0);
  // 冠軍牌組次數榜（網站賽 > MAXCHAMP 場時改用）
  const cm = new Map();
  for (const c of siteChamps) cm.set(c.deck, (cm.get(c.deck) || 0) + 1);
  const champRank = [...cm.entries()].map(([name, n]) => ({ name: name, n: n }))
    .sort((x, y) => y.n - x.n || x.name.localeCompare(y.name));
  const times = arcs.map((a) => a.finishedAt || 0).filter(Boolean);
  return {
    days: days, siteChamps: siteChamps, commRank: commRank, commChampCount: commChampRows.length,
    t4Rows: t4Rows, t4Total: t4Total, t4Events: t4Events, t4Skipped: t4Skipped,
    noCut: noCut, noChamp: noChamp, champRank: champRank,
    nSite: site.length, nComm: comm.length,
    entries: arcs.reduce((s, a) => s + (a.playerCount || 0), 0),
    from: times.length ? Math.min.apply(null, times) : 0,
    to: times.length ? Math.max.apply(null, times) : 0,
    capped: (allArchives || []).length >= 500,
  };
}

/**
 * 奪冠報告的註腳（單頁版與完整版共用；口徑說明只有這一份）。
 * ⚠ 這些數字是「為什麼圖上的場數對不上」的唯一線索，玩家會拿去跟大廳排行榜對。
 */
function crNotes(d) {
  const notes = [];
  notes.push('四強＝準決賽的 4 位選手（含冠亞）　・　社群賽只統計奪冠牌組、不列個人成績');
  if (d.t4Skipped) notes.push('未滿 ' + CR.MIN_FOR_TOP4 + ' 人的賽事不計四強（' + d.t4Skipped + ' 場）');
  if (d.noCut) notes.push('另有 ' + d.noCut + ' 場因賽程結構無法判定四強');
  if (d.noChamp > 0) notes.push('另有 ' + d.noChamp + ' 場沒有冠軍（賽事取消或雙方未到）');
  notes.push('牌組分類依 ' + new Date().toLocaleDateString('zh-TW') + ' 的分類規則');
  if (d.capped) notes.push('已達查詢上限，更早的賽事未納入');
  return notes;
}

/** 畫奪冠報告圖。沒有任何冠軍可列時回 null。 */
async function crDraw(d) {
  if (!d || (!d.siteChamps.length && !d.commRank.length)) return null;
  const cv = document.createElement('canvas');
  cv.width = MI.W * MI.S; cv.height = MI.H * MI.S;
  const ctx = cv.getContext('2d');
  ctx.scale(MI.S, MI.S);
  ctx.textBaseline = 'middle';
  const K = MI.K, PAD = MI.PAD, IW = MI.W - PAD * 2;
  const A1 = MI.SRC.tourn.a1, A2 = MI.SRC.tourn.a2;   // 網站賽＝金橘
  const C1 = MI.SRC.casual.a1;                        // 社群賽＝青
  ctx.fillStyle = K.bg0; ctx.fillRect(0, 0, MI.W, MI.H);

  // ── 品牌帶
  const logo = await miLogo();
  if (logo) ctx.drawImage(logo, PAD, 32, 76, 76);
  miFont(ctx, 38, true); ctx.fillStyle = K.txt;
  ctx.fillText('PTCG 台灣線上對戰模擬器', PAD + (logo ? 96 : 0), 58);
  miFont(ctx, 26); ctx.fillStyle = K.dim;
  ctx.fillText(MI_URL, PAD + (logo ? 96 : 0), 94);
  ctx.textAlign = 'right';
  ctx.fillText('資料截至 ' + miDate(Date.now()), MI.W - PAD, 58);
  ctx.textAlign = 'left';

  // ── 標題帶
  ctx.fillStyle = A1; ctx.fillRect(PAD, 150, 8, 62);
  miFont(ctx, 54, true); ctx.fillStyle = K.txt;
  ctx.fillText('本期奪冠報告', PAD + 24, 182);
  miFont(ctx, 28); ctx.fillStyle = K.dim;
  const span = d.from && d.to ? (miDate(d.from) + '–' + miDate(d.to)) : '全部時間';
  ctx.fillText(span + '　・　網站賽 ' + d.nSite + ' 場　・　社群賽 ' + d.nComm + ' 場　・　共 '
    + d.entries + ' 人次參賽', PAD + 24, 232);

  let y = 280;
  // ⚠ v6.112：第一版每區都用固定 max 列數、y 一路累加 —— 社群賽場次一多就把註腳與頁腳
  //   整個蓋過去（Wilson 回報「很多字疊在一起」）。改成**畫之前先算剩餘空間**，
  //   列數 = min(想畫的, 塞得下的)；註腳／頁腳是硬保留區，永遠不會被吃掉。
  const NOTE_TOP = MI.H - 168;
  const roomFor = (rowH, reserve) => Math.max(0, Math.floor((NOTE_TOP - (reserve || 0) - y) / rowH));
  const sectionHead = (icon, title, right, color) => {
    miFont(ctx, 30, true); ctx.fillStyle = color;
    ctx.fillText(icon + ' ' + title, PAD, y);
    if (right) { miFont(ctx, 24); ctx.fillStyle = K.dim; ctx.textAlign = 'right'; ctx.fillText(right, MI.W - PAD, y); ctx.textAlign = 'left'; }
    y += 34;
  };
  /**
   * 名次／次數列（絕對數，不畫比率）。
   * ⚠ v1.72：單位詞改成**由呼叫端逐段宣告**（原本硬寫「位」）—— 這三段的 n 全都是
   *   「這副牌發生了幾次」而不是「幾個人」，逐處判斷見 CR_SECTIONS 上方的說明。
   *   單頁版與完整版的單位詞必須逐字一致（同一週發出去的兩張圖不能寫不同單位）。
   */
  const rankRows = (rows, max, barColor, unit) => {
    const top = rows.slice(0, max);
    const peak = top.length ? top[0].n : 1;
    for (const r of top) {
      miRR(ctx, PAD, y, IW, 46, 8); ctx.fillStyle = K.row; ctx.fill();
      miFont(ctx, 30); ctx.fillStyle = K.txt;
      ctx.fillText(miFit(ctx, r.name, IW - 300), PAD + 16, y + 23);
      const bx = PAD + IW - 250, bw = 160;
      miRR(ctx, bx, y + 17, bw, 12, 6); ctx.fillStyle = K.ln; ctx.fill();
      miRR(ctx, bx, y + 17, Math.max(10, bw * (r.n / peak)), 12, 6); ctx.fillStyle = barColor; ctx.fill();
      miFont(ctx, 34, true); ctx.fillStyle = K.txt; ctx.textAlign = 'right';
      ctx.fillText(r.n + ' ' + unit, MI.W - PAD - 8, y + 23);
      ctx.textAlign = 'left';
      y += 56;
    }
    if (rows.length > max) { miFont(ctx, 22); ctx.fillStyle = K.dim; ctx.fillText('…另有 ' + (rows.length - max) + ' 種牌組', PAD + 16, y + 8); y += 28; }
  };
  /** 冠軍列（單場一列）。
   *  ⭐ v1.73：玩家名／牌組名不再各吃寫死常數（260／IW−nameW−230）——
   *  兩者**共享**第二行的實際可用寬（列右緣 − 起點 − 名字↔牌組名間距）。
   *  分配策略＝「名字優先、牌組名保底」：名字放得下就完整顯示（站長回報長名被
   *  不必要截斷、右邊卻一大片空白）；名字真的太長時只保證牌組名最少 DECK_MIN，
   *  其餘全給名字 —— 這就是極端長名的硬上限，兩者都絕不撞右緣。 */
  const champRows = (list, max, accent) => {
    for (const c of list.slice(0, max)) {
      miRR(ctx, PAD, y, IW, 82, 10); ctx.fillStyle = K.row; ctx.fill();
      ctx.fillStyle = accent; ctx.fillRect(PAD, y + 8, 5, 66);
      const recTxt = c.players + ' 人・' + c.w + ' 勝 ' + c.l + ' 負';
      miFont(ctx, 24); const recW = ctx.measureText(recTxt).width;
      const datePre = miDate(c.startedAt || c.finishedAt) + '　';
      // 第一行：賽事名可用寬 = 右欄成績起點 − 起點 − 日期寬 − 24px 間距（原本寫死 300）
      const evMax = Math.max(120, (MI.W - PAD - 12) - recW - 24 - (PAD + 20) - ctx.measureText(datePre).width);
      ctx.fillStyle = K.dim;
      ctx.fillText(datePre + miFit(ctx, c.eventName, evMax), PAD + 20, y + 22);
      // 第二行：名字＋牌組名共享（此行右側沒有其他元素，右緣取與成績欄同一內縮）
      const NAME_X = PAD + 20, ND_GAP = 20, DECK_MIN = 300;
      const avail = (MI.W - PAD - 12) - NAME_X - ND_GAP;
      miFont(ctx, 32, true); const deckFull = ctx.measureText(String(c.deck === null || c.deck === undefined ? '' : c.deck)).width;
      miFont(ctx, 34, true); const nameFull = ctx.measureText(String(c.name === null || c.name === undefined ? '' : c.name)).width;
      const nameMax = nameFull + deckFull <= avail ? nameFull : Math.max(200, avail - Math.min(deckFull, DECK_MIN));
      const nm = miFit(ctx, c.name, nameMax);
      const nameW = ctx.measureText(nm).width;
      ctx.fillStyle = K.txt;
      ctx.fillText(nm, NAME_X, y + 56);
      miFont(ctx, 32, true); ctx.fillStyle = accent;
      ctx.fillText(miFit(ctx, c.deck, avail - nameW), NAME_X + ND_GAP + nameW, y + 56);
      miFont(ctx, 24); ctx.fillStyle = K.dim; ctx.textAlign = 'right';
      ctx.fillText(recTxt, MI.W - PAD - 12, y + 22);
      ctx.textAlign = 'left';
      y += 92;
    }
  };

  // ── 網站賽冠軍
  // ⚠ reserve＝後面兩區（四強、社群賽）各留「標題＋2 列」的高度，否則這區會把後面擠掉。
  const RESERVE_AFTER_CHAMP = (34 + 56 * 2 + 30) * 2;
  if (d.siteChamps.length > CR.MAXCHAMP) {
    sectionHead('🏆', '網站賽　冠軍牌組', d.nSite + ' 場合計', A1);
    rankRows(d.champRank, Math.min(CR.MAXCHAMP + 1, roomFor(56, RESERVE_AFTER_CHAMP)), A1, '次');
  } else if (d.siteChamps.length) {
    sectionHead('🏆', '網站賽　冠軍', d.siteChamps.length + ' 場', A1);
    champRows(d.siteChamps, Math.min(CR.MAXCHAMP, roomFor(92, RESERVE_AFTER_CHAMP)), A1);
  } else {
    sectionHead('🏆', '網站賽　冠軍', '', A1);
    miFont(ctx, 26); ctx.fillStyle = K.dim; ctx.fillText('本期沒有已完賽的網站賽', PAD + 8, y + 10); y += 46;
  }

  // ── 四強牌組
  y += 12;
  // ⚠ v1.72：t4Total = t4Rows 的 n 加總 = 每場賽事 top4 逐筆累加 ⇒ 同一個人在兩場賽事會被算兩次，
  //   所以它是**人次**不是人數（跟這張圖副標的「共 N 人次參賽」同一個口徑）。原本寫「共 N 位」是錯的。
  sectionHead('🥈', '網站賽　四強牌組（含冠亞）', d.t4Total ? ('共 ' + d.t4Total + ' 人次') : '', K.dim);
  const RESERVE_AFTER_T4 = 30 + 34 + 56 * 2 + 30;
  if (d.t4Rows.length) rankRows(d.t4Rows, Math.min(CR.MAXTOP4, roomFor(56, RESERVE_AFTER_T4)), A2, '次');
  else { miFont(ctx, 26); ctx.fillStyle = K.dim; ctx.fillText('本期沒有可判定四強的網站賽', PAD + 8, y + 10); y += 46; }

  // ── 社群賽冠軍（永遠保留區塊，沒資料也印一行，避免版面塌陷）
  y += 12;
  ctx.strokeStyle = K.ln; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PAD, y - 6); ctx.lineTo(MI.W - PAD, y - 6); ctx.stroke();
  y += 18;
  sectionHead('👥', '社群賽　奪冠最多的牌組', d.nComm + ' 場', C1);
  if (d.commRank.length) rankRows(d.commRank, Math.min(CR.MAXCOMM, roomFor(56, 0)), C1, '次');
  else { miFont(ctx, 26); ctx.fillStyle = K.dim; ctx.fillText('本期沒有社群賽', PAD + 8, y + 10); y += 46; }

  // ── 註腳（把口徑講清楚，避免玩家拿去跟大廳排行榜對數字時誤會）
  const notes = crNotes(d);
  miFont(ctx, 22); ctx.fillStyle = K.dim;
  let ny = MI.H - 158;
  for (const t of notes.slice(0, 3)) { ctx.fillText(miFit(ctx, t, IW), PAD, ny); ny += 26; }

  // ── 頁腳
  ctx.textAlign = 'center';
  if (logo) ctx.drawImage(logo, MI.W / 2 - 108, MI.H - 74, 32, 32);
  miFont(ctx, 30, true); ctx.fillStyle = K.txt;
  ctx.fillText(MI_URL, MI.W / 2 + 20, MI.H - 58);
  miFont(ctx, 22); ctx.fillStyle = K.dim;
  ctx.fillText('本站為非官方、非營利之愛好者社群交流平台', MI.W / 2, MI.H - 24);
  ctx.textAlign = 'left';
  return cv;
}

/**
 * 奪冠報告的資料取得（單頁版與完整版共用 —— 口徑只有這一份，抄第二份必然漂移）。
 * 回 crBuild 的結果；失敗時已 alert 並回 null。
 */
async function crLoadData() {
  // ⚠ v6.112：按鈕移到「牌組原型」分頁後，使用者可能根本沒開過「賽事統計」→ 快取是 null。
  //   自己補載一次（同一支端點，載完賽事統計分頁也受惠）。
  if (!tournStatsCache || !((tournStatsCache.archives || []).length)) {
    try {
      // v6.240：與賽事統計分頁走**同一支** helper（全量逐頁累積）。
      //   ⚠ 這裡若只抓第一頁，奪冠報告圖的「全部資料」就只會涵蓋最新 200 場。
      const d0 = await fetchAllTournamentStats(null);
      if (d0 && !d0.error) tournStatsCache = d0;
    } catch (e) { /* 下面統一報錯 */ }
  }
  if (!tournStatsCache || !((tournStatsCache.archives || []).length)) {
    alert('讀不到賽事歸檔資料（或目前沒有已完賽的賽事）。'); return null;
  }
  // ⚠ 主力寶可夢 fallback 需要卡片索引與標籤，沒 await 會產出「支援型寶可夢奪冠」的笑話圖。
  await ensureCardIndex(); await ensureCardTags();
  const days = Number(currentArchSince() || 0);
  const since = days > 0 ? (Date.now() - days * 86400000) : 0;
  const rep = await api('/api/admin/champion-report?since=' + since);
  if (!rep || rep.error) { alert('取得奪冠資料失敗：' + ((rep && rep.error) || '未知錯誤')); return null; }
  const map = new Map();
  for (const e of (rep.events || [])) map.set(e.eventId, e);
  // ⚠ 全量 archives，不是被 tsEventFilter 篩過的那份
  return crBuild(tournStatsCache.archives || [], map, days);
}

window.openChampionReportExport = async function () {
  if (_crBusy) return;
  const btn = document.getElementById('champ-img-btn');
  const label = btn ? btn.textContent : '';
  _crBusy = true;
  if (btn) { btn.disabled = true; btn.textContent = '產生中…'; }
  try {
    const data = await crLoadData();
    if (!data) return;                     // 失敗訊息由 crLoadData 統一 alert
    const cv = await crDraw(data);
    if (!cv) { alert('這個時間範圍內沒有任何冠軍紀錄，無法產圖。'); return; }
    _crOut = { cv: cv, stamp: miStamp(Date.now()) };
    renderChampionReportModal();
  } catch (e) {
    alert('產圖失敗：' + (e && e.message ? e.message : e));
  } finally {
    _crBusy = false;
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
};

window.renderChampionReportModal = function () {
  const cv = _crOut && _crOut.cv;
  document.getElementById('modal-container').innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this)closeModal()">'
    + '<div class="modal" style="max-width:640px;width:100%;">'
    + '<h3>🏆 奪冠報告圖</h3>'
    + (cv ? '<img src="' + cv.toDataURL('image/png') + '" alt="奪冠報告圖" style="width:100%;border-radius:10px;display:block;">'
          : '<div class="empty">沒有可用資料。</div>')
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">'
    + '<button onclick="downloadChampionReport()"' + (cv ? '' : ' disabled') + '>⬇️ 下載</button>'
    + '<button class="ghost" onclick="closeModal()">關閉</button></div>'
    + '<div class="small muted" style="margin-top:8px;">'
    + '1080×1350（2× 輸出），適合直接貼到 LINE／Facebook／Discord。手機可長按圖片儲存。</div>'
    + '</div></div>';
};

window.downloadChampionReport = function () {
  const cv = _crOut && _crOut.cv;
  if (!cv) return;
  cv.toBlob(function (blob) {
    if (!blob) { alert('產生檔案失敗'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ptcg-champions-' + ((_crOut && _crOut.stamp) || miStamp(Date.now())) + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }, 'image/png');
};

// ══ v1.71 奪冠報告・完整版（多頁）══════════════════════════════════════════
// 單頁版會依剩餘空間砍列數（roomFor），完整版**一筆都不砍**：四個區段依序分頁，
// 每頁固定筆數、固定 1920×1080。註腳與 crDraw 共用 crNotes（口徑只有一份）。

/** 完整版：奪冠報告的一頁。 */
async function mpDrawChampion(ctx, p) {
  const K = MI.K, PAD = MP.PAD, W = MP.W;
  const ACC = { a1: MI.SRC.tourn.a1, a2: MI.SRC.tourn.a2, c1: MI.SRC.casual.a1 };
  const accent = ACC[p.accent] || ACC.a1;
  const d = p.d || {};
  const span = (d.from && d.to) ? (miDate(d.from) + '–' + miDate(d.to)) : '全部時間';
  const last = p.startRank + p.rows.length - 1;
  await mpFrame(ctx, {
    page: p.page, pageTotal: p.pageTotal, accent: accent,
    title: '本期奪冠報告',
    sub: span + '　・　網站賽 ' + (d.nSite || 0) + ' 場　・　社群賽 ' + (d.nComm || 0)
       + ' 場　・　共 ' + (d.entries || 0) + ' 人次參賽',
    notes: p.notes || [],
  });

  // ⚠ v1.72：段落標 34→38px 之後，上緣 = 268 − 19 = 249，剛好貼上 mpFrame 副標的下緣
  //   （234 + 30/2 = 249）。段落標開頭是 emoji（🏆🥈👥），emoji 字形常超出 em box ⇒ 會相碰。
  //   baseline 挪到 272：上緣 253（離副標 4px）、下緣 291（離列區起點 296 還有 5px）。
  ctx.textAlign = 'left'; ctx.fillStyle = accent; miFont(ctx, 38, true);
  ctx.fillText(p.icon + ' ' + p.title + '　（第 ' + p.startRank + '–' + last
    + ' 筆，全部 ' + p.sectionTotal + ' 筆）', PAD, 272);

  if (p.kind === 'champ') {
    p.rows.forEach(function (c, i) {
      const y = MP.TOP + i * (MP.ROW_CHAMP + MP.GAP_CHAMP);
      const n = p.startRank + i;
      ctx.fillStyle = K.row; miRR(ctx, PAD, y, W - PAD * 2, MP.ROW_CHAMP, 12); ctx.fill();
      ctx.fillStyle = accent; ctx.fillRect(PAD, y + 12, 6, MP.ROW_CHAMP - 24);
      ctx.textAlign = 'center'; ctx.fillStyle = K.dim; miFont(ctx, 34, true);
      ctx.fillText(String(n), PAD + 46, y + MP.ROW_CHAMP / 2);
      ctx.textAlign = 'left';
      // ⭐ v1.73：玩家名（原寫死 300）／牌組名（原寫死 760）改共享整列實際可用寬 ——
      //   1920 版面第二行右緣之前全是空白，站長回報長名被截、右側卻一大片空。
      //   策略同單頁版：名字優先完整顯示；名字過長時只保證牌組名 DECK_MIN，其餘給名字。
      const recTxt = c.players + ' 人・' + c.w + ' 勝 ' + c.l + ' 負';
      miFont(ctx, 28, false); const recW = ctx.measureText(recTxt).width;
      const datePre = miDate(c.startedAt || c.finishedAt) + '　';
      miFont(ctx, 26, false); ctx.fillStyle = K.dim;
      // 第一行：賽事名可用寬 = 右欄成績起點 − 起點 − 日期寬 − 32px 間距（原本寫死 420）
      const evMax = Math.max(160, (W - PAD - 20) - recW - 32 - (PAD + 92) - ctx.measureText(datePre).width);
      ctx.fillText(datePre + miFit(ctx, c.eventName, evMax), PAD + 92, y + 34);
      const NAME_X = PAD + 92, ND_GAP = 32, DECK_MIN = 380;
      const avail = (W - PAD - 20) - NAME_X - ND_GAP;
      miFont(ctx, 38, true); const deckFull = ctx.measureText(String(c.deck === null || c.deck === undefined ? '' : c.deck)).width;
      miFont(ctx, 40, true); const nameFull = ctx.measureText(String(c.name === null || c.name === undefined ? '' : c.name)).width;
      const nameMax = nameFull + deckFull <= avail ? nameFull : Math.max(240, avail - Math.min(deckFull, DECK_MIN));
      const nm = miFit(ctx, c.name, nameMax);
      const nw = ctx.measureText(nm).width;
      ctx.fillStyle = K.txt;
      ctx.fillText(nm, NAME_X, y + 80);
      ctx.fillStyle = accent; miFont(ctx, 38, true);
      ctx.fillText(miFit(ctx, c.deck, avail - nw), NAME_X + ND_GAP + nw, y + 80);
      ctx.textAlign = 'right'; ctx.fillStyle = K.dim; miFont(ctx, 28, false);
      ctx.fillText(recTxt, W - PAD - 20, y + 34);
      ctx.textAlign = 'left';
    });
    return;
  }

  // 名次／次數列（絕對數，不畫比率 —— 奪冠是個位數事件）
  const peak = p.peak || 1;
  p.rows.forEach(function (r, i) {
    const y = MP.TOP + i * (MP.ROW + MP.GAP), mid = y + MP.ROW / 2;
    const n = p.startRank + i;
    ctx.fillStyle = K.row; miRR(ctx, PAD, y, W - PAD * 2, MP.ROW, 12); ctx.fill();
    if (n <= 3) { ctx.fillStyle = [K.r1, K.r2, K.r3][n - 1]; miRR(ctx, PAD, y, 6, MP.ROW, 3); ctx.fill(); }
    ctx.textAlign = 'center';
    ctx.fillStyle = n <= 3 ? K.r1 : K.dim; miFont(ctx, 42, true);
    ctx.fillText(String(n), PAD + 44, mid);
    ctx.textAlign = 'left'; ctx.fillStyle = K.txt; miFont(ctx, 42, true);
    // v1.73：可用寬其實到長條起點 1200（168 起、留 16px 間距）＝1016，原寫死 900 平白少 116px
    ctx.fillText(miFit(ctx, r.name, 1016), 168, mid);
    // 長條 1200–1620（右側次數欄 50px 右對齊 1848，「99 次」約 138px、起點約 1710，還留 90px）
    const bw = Math.max(10, Math.round(420 * (r.n / peak)));
    ctx.fillStyle = K.ln; miRR(ctx, 1200, mid - 10, 420, 20, 10); ctx.fill();
    ctx.fillStyle = accent; miRR(ctx, 1200, mid - 10, bw, 20, 10); ctx.fill();
    ctx.textAlign = 'right'; ctx.fillStyle = K.txt; miFont(ctx, 50, true);
    ctx.fillText(r.n + ' ' + p.unit, W - PAD, mid);
    ctx.textAlign = 'left';
  });
}

// ── v1.72 分段勾選與排序（站長裁定：不要替他決定順序）──────────────────────
//
// 站長沒有固定的影片腳本，每週想講的重點不一樣 ⇒ 由他自己勾選要輸出哪幾段、排成什麼順序。
// ⚠ **不做拖曳**：admin 是單一 HTML 檔，拖曳要一整組 pointer/touch 事件與捲動相容處理，
//   ▲▼ 兩顆按鈕就能達成同樣的事，越簡單越不會壞。
// ⚠ 狀態的真實來源是記憶體裡的 _crFullSel，localStorage 只負責「下次打開沿用」；
//   所以 Safari 無痕（setItem 會 throw）下勾選與排序照樣正常，只是不會被記住。
let _crFullSel = null;
function crFullSel() {
  if (!_crFullSel) _crFullSel = mpNormalizeSel(mpParseJson(mpLsGet(CR_FULL_LSKEY)));
  return _crFullSel;
}
function crFullSave() { mpLsSet(CR_FULL_LSKEY, JSON.stringify(_crFullSel)); }
/** 目前勾選的區段 key，**依畫面上的順序**（就是產圖的出頁順序）。 */
function crFullKeys() {
  return crFullSel().filter(function (x) { return x.on; }).map(function (x) { return x.k; });
}

// 按鈕改成先開設定視窗，真正產圖在 runChampionReportFullExport（下面）。
// ⚠ 這幾支寫成**具名函式宣告**再掛 window 別名（不是 `window.x = function`）：
//   它們彼此互相呼叫（champFullToggle → renderChampFullPicker），裸名稱要在模組作用域內
//   就解析得到；只掛 window 的話是靠「找不到就往全域找」才碰巧能動，守衛也抽不出來跑。
function openChampionReportFullExport() {
  if (_mpBusy) return;
  renderChampFullPicker();
}

function renderChampFullPicker() {
  const sel = crFullSel();
  const onCount = sel.filter(function (x) { return x.on; }).length;
  // ⚠⚠ 產圖進行中要把整個視窗鎖住：mpExportPages 是把進度寫進 #champ-full-run-btn 這個
  //   **元素**（「產生中… 3/12」）。使用者這時去點勾選／▲▼ 會重繪，舊按鈕被換掉並 detach ⇒
  //   進度從此寫進空氣、再按又被 _mpBusy 靜默擋掉，畫面看起來就是「卡住了」。
  const busy = _mpBusy;
  const dis = busy ? ' disabled' : '';
  const rows = sel.map(function (it, i) {
    const sec = CR_SECTIONS.filter(function (x) { return x.k === it.k; })[0] || { icon: '', title: it.k };
    return '<div style="display:flex;align-items:center;gap:8px;border:1px solid #dde2ea;'
      + 'border-radius:8px;padding:6px 10px;margin-bottom:6px;">'
      + '<label style="flex:1;display:flex;align-items:center;gap:8px;margin:0;cursor:pointer;">'
      + '<input type="checkbox"' + (it.on ? ' checked' : '') + dis + ' onchange="champFullToggle(' + i + ')">'
      + '<span>' + sec.icon + ' ' + sec.title + '</span></label>'
      + '<button class="ghost" style="padding:2px 10px;" onclick="champFullMove(' + i + ',-1)"'
      + (i === 0 || busy ? ' disabled' : '') + '>▲</button>'
      + '<button class="ghost" style="padding:2px 10px;" onclick="champFullMove(' + i + ',1)"'
      + (i === sel.length - 1 || busy ? ' disabled' : '') + '>▼</button>'
      + '</div>';
  }).join('');
  document.getElementById('modal-container').innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this&&!champFullBusy())closeModal()">'
    + '<div class="modal" style="max-width:560px;width:100%;">'
    + '<h3>🎬 奪冠報告・完整版（多頁 ZIP）</h3>'
    + '<div class="small muted" style="margin-bottom:10px;">勾選要輸出的段落，用 ▲▼ 調整順序'
    + '（影片就照這個順序一頁一頁播）。每段內部一律不省略任何一筆。設定會記在這台電腦，下次打開沿用。</div>'
    + rows
    + '<div class="small muted" style="margin:2px 0 6px;">※「冠軍牌組次數榜」在該期間只有 1 場網站賽時不會輸出'
    + '（內容會與「冠軍（逐場）」完全相同）；其他沒有資料的段落也會在產完後一併告知。</div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">'
    + '<button id="champ-full-run-btn" onclick="runChampionReportFullExport()"'
    + (onCount && !busy ? '' : ' disabled') + '>🎬 產生 ZIP</button>'
    + '<button class="ghost" onclick="closeModal()"' + dis + '>取消</button></div>'
    + (onCount ? '' : '<div class="small" style="margin-top:8px;color:#c0392b;">⚠ 至少要勾選一個段落才能產圖。</div>')
    + '</div></div>';
}
/** 產圖進行中？（modal-bg 的 inline onclick 要用，所以下面有掛 window。） */
function champFullBusy() { return _mpBusy; }

function champFullToggle(i) {
  if (_mpBusy) return;                   // 產圖中：UI 已經全 disabled，這是第二道保險
  const sel = crFullSel();
  if (!sel[i]) return;
  sel[i].on = !sel[i].on;
  crFullSave();
  renderChampFullPicker();
}
function champFullMove(i, dir) {
  if (_mpBusy) return;                   // 同上
  const sel = crFullSel();
  const j = i + dir;
  if (j < 0 || j >= sel.length) return;
  const t = sel[i]; sel[i] = sel[j]; sel[j] = t;
  crFullSave();
  renderChampFullPicker();
}

async function runChampionReportFullExport() {
  if (_mpBusy) return;
  const keys = crFullKeys();
  if (!keys.length) return;              // 按鈕本來就 disabled；這是第二道保險
  _mpBusy = true;
  renderChampFullPicker();               // ⭐ 先重繪一次把整個視窗鎖住，再去抓那顆按鈕
  const btn = document.getElementById('champ-full-run-btn');
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '產生中…'; }
  try {
    const d = await crLoadData();          // ⭐與單頁版同一支資料來源
    if (!d) return;
    const pages = mpPlanChampion(d, MP.PER_CHAMP, MP.PER, keys);
    // ⭐ 勾了卻不會出的段落，逐段講原因（不講的話站長剪片時才會發現素材缺一塊）。
    const skipped = keys.map(function (k) {
      const why = crSkipReason(d, k);
      if (!why) return null;
      const sec = CR_SECTIONS.filter(function (x) { return x.k === k; })[0] || { title: k };
      return '・' + sec.title + '：' + why;
    }).filter(Boolean);
    if (!pages.length) {
      alert('勾選的段落都沒有可輸出的內容：\n' + skipped.join('\n'));
      return;
    }
    // 只調整完整版的顯示順序，crNotes 本身與單頁版的呈現都不動。
    const notes = mpHoistCapNote(crNotes(d));
    for (const p of pages) { p.d = d; p.notes = notes; }
    const zip = await mpExportPages(pages, mpDrawChampion, btn);
    mpSaveBlob(zip, 'ptcg-champions-full-' + miStamp(Date.now()) + '.zip');
    closeModal();
    alert('已產生 ' + pages.length + ' 頁（01.png、02.png…），打包成 ZIP 下載。\n解壓後整批拖進 Canva 就是正確順序。'
      + (skipped.length ? '\n\n⚠ 以下勾選的段落沒有輸出：\n' + skipped.join('\n') : ''));
  } catch (e) {
    alert('產圖失敗：' + (e && e.message ? e.message : e));
  } finally {
    _mpBusy = false;
    if (btn) { btn.disabled = false; btn.textContent = label; }
    // 成功時上面已 closeModal()；失敗／中止時視窗還開著 ⇒ 重繪把 disabled 解開。
    if (document.getElementById('modal-container').innerHTML.indexOf('champ-full-run-btn') >= 0) {
      renderChampFullPicker();
    }
  }
}

window.archSort = function(key) {
  // 同一欄再點一次＝反向；換欄位時：文字欄預設升冪(A→Z)，數字欄預設降冪(大→小)
  if (_archSortKey === key) _archSortAsc = !_archSortAsc;
  else { _archSortKey = key; _archSortAsc = (key === 'name'); }
  renderArchetypeStats();
};

/** 依目前排序設定排一份新陣列（不動原資料）。 */
function sortArchRows(rows) {
  const k = _archSortKey, dir = _archSortAsc ? 1 : -1;
  return [...rows].sort((a, b) => {
    if (k === 'name') return String(a.name || '').localeCompare(String(b.name || ''), 'zh-Hant') * dir;
    const av = a[k], bv = b[k];
    // ⭐勝率可能是 null（沒有分出勝負的場次）→ 無論升冪降冪都排最後，不要混在數字中間
    if (av === null || av === undefined) return (bv === null || bv === undefined) ? 0 : 1;
    if (bv === null || bv === undefined) return -1;
    if (av === bv) return (b.usage - a.usage);   // 同值時用使用次數當第二排序，順序才穩定
    return (av - bv) * dir;
  });
}

function renderArchetypeStats() {
  const box = document.getElementById('arch-stats-box');
  if (!box) return;
  const d = _archStats;
  if (!d) { box.innerHTML = '<div class="empty">按上方「📊 計算統計」開始。</div>'; return; }
  const pct = (v) => (v === null || v === undefined) ? '-' : (v * 100).toFixed(1) + '%';
  const wrCell = (r) => {
    if (r.winRate === null) return '<td class="small muted">-</td>';
    const col = r.winRate > 0.55 ? '#2e7d32' : (r.winRate < 0.45 ? '#c62828' : '#1a2332');
    // 樣本太少的勝率灰掉：1 勝 0 負 =100% 會誤導
    if (!r.sampleOk) return '<td class="small muted" title="樣本不足 10 副，勝率僅供參考">' + pct(r.winRate) + ' <span class="small">(樣本少)</span></td>';
    return '<td style="color:' + col + ';font-weight:600;">' + pct(r.winRate) + '</td>';
  };
  const tbl = (title, blk, scannedText) => {
    if (!blk) return '';
    const sorted = sortArchRows(blk.rows || []);
    // v1.56：平手欄只在真的有平手資料時才顯示。
    //   錦標賽側統計本來就跳過無勝方的對局（draws 恆 0）；休閒側平局極罕見（引擎每條結束路徑都會定勝負）。
    //   ⚠後端的 draw 分支保留不動——時限平手判雙敗是真實存在的資料狀態，砍掉會在下次發生時炸統計。
    const showDraws = (blk.rows || []).some((r) => (r.draws || 0) > 0) || (blk.unclassified?.draws || 0) > 0;
    const arrow = (k) => _archSortKey === k ? (_archSortAsc ? ' ▲' : ' ▼') : '';
    const th = (k, label, title) =>
      '<th onclick="archSort(\'' + k + '\')" style="cursor:pointer;user-select:none;white-space:nowrap;"'
      + (title ? ' title="' + title + '"' : '') + '>' + label + arrow(k) + '</th>';
    // v1.56：牌組名可點 → 開該原型的牌組明細（代表 60 張／勝場版／遺珠之憾）
    const srcKey = (title.indexOf('錦標賽') >= 0) ? 'tourn' : 'casual';
    const rows = sorted.map((r, i) =>
      '<tr><td>' + (i + 1) + '</td>'
      + '<td><a href="#" class="player-name" title="看這個原型的代表牌組與推薦搭配"'
      + ' onclick="showArchetypeDetail(\'' + String(r.ruleId).replace(/'/g, '&apos;') + '\',\'' + srcKey + '\'); return false;"><b>'
      + escapeHtml(r.name) + '</b></a></td>'
      + '<td>' + r.usage + '</td>'
      + '<td>' + r.wins + '</td><td>' + r.losses + '</td>'
      + (showDraws ? '<td>' + (r.draws || 0) + '</td>' : '')
      + wrCell(r) + '</tr>').join('');
    const u = blk.unclassified || {};
    // v1.63 高頻卡改成可點的 chip：點一下就把該卡加進「支援型寶可夢」排除清單並重算。
    //   後端已先濾掉非寶可夢（老大的指令／基本能量這類通用卡對「該開什麼規則」沒有鑑別度）。
    const uTop = (u.topCards || []).slice(0, 20).map((c) =>
      '<span class="uncls-chip" title="點一下：設為支援型寶可夢（從此清單排除）"'
      + ' onclick="addSupportPokemon(\'' + String(c.name).replace(/'/g, '&apos;') + '\')">'
      + escapeHtml(c.name) + '<span class="uncls-n">×' + c.decks + '</span></span>').join('');
    const uFiltered = u.filteredOut || {};
    const headHtml = '<tr><th>#</th>' + th('name', '牌組原型') + th('usage', '使用次數')
      + th('wins', '勝') + th('losses', '負') + (showDraws ? th('draws', '平') : '')
      + th('winRate', '勝率', '樣本少於 10 副的勝率僅供參考，排序時會一併計入') + '</tr>';
    return '<h4 style="margin:14px 0 6px;">' + title + '</h4>'
      + '<div class="small muted" style="margin-bottom:6px;">' + scannedText + '</div>'
      + '<div class="stats-box" style="padding:8px;overflow-x:auto;">'
      + (rows
          ? '<table><thead>' + headHtml + '</thead><tbody>' + rows + '</tbody></table>'
          : '<div class="empty">目前的規則在這個資料源沒有任何命中。</div>')
      + '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed #dfe4ea;">'
      + '<b>未分類</b>：' + (u.usage || 0) + ' 副（勝 ' + (u.wins || 0) + ' / 負 ' + (u.losses || 0) + '，勝率 ' + pct(u.winRate) + '）'
      + (uTop
          ? '<div class="small muted" style="margin-top:6px;">未分類牌組裡最常出現的<b>寶可夢</b>（可據此開新規則；點卡片可設為支援型並排除）：</div>'
            + '<div class="uncls-chips">' + uTop + '</div>'
            + '<div class="small muted" style="margin-top:4px;">'
            + '已自動濾掉 ' + (uFiltered.nonPokemon || 0) + ' 種非寶可夢卡（物品／支援者／道具／能量）'
            + '，以及 ' + (uFiltered.support || 0) + ' 種你標記過的支援型寶可夢。'
            + ' <a href="#" onclick="openSupportPokemonEditor(); return false;">管理支援型清單</a></div>'
          : '')
      + '</div></div>';

// ══ v1.50 玩家總覽（批次1）══════════════════════════════════════════════════
//   目標：admin **任何**頁面點到玩家 email，都能開出同一份完整玩家檔案。
//   做法：全站一律呼叫 playerLink() 產生連結（禁止各頁自己手刻 onclick），
//         連結寫進網址 hash（#/player/xxx）→ 可分享、可重整、可上一頁。
//   ⚠沒有 email 的玩家（本機對戰 P2／匿名）天生無法建檔：matchRecords 只存 email 不存 uid，
//     此時退回純文字並標「匿名」，不要產生點了沒反應的假連結。
window.openPlayer = function(email) {
  if (!email || !String(email).includes('@')) return;
  location.hash = '#/player/' + encodeURIComponent(email);
};
/** 全站唯一的玩家連結產生器。label 省略時顯示 email 本身。 */
window.playerLink = function(email, label, cls) {
  const txt = escapeHtml(label != null && label !== '' ? String(label) : String(email || ''));
  if (!email || !String(email).includes('@')) {
    return '<span class="small muted">' + (txt || '（匿名）') + '</span>';
  }
  const safe = String(email).replace(/'/g, '&apos;');
  return '<a href="#/player/' + encodeURIComponent(email) + '" class="' + (cls || 'player-name')
    + '" title="開啟玩家總覽" onclick="openPlayer(\'' + safe + '\'); return false;">' + txt + '</a>';
};
// v1.54 批次4：賽事也做成可深連結的實體，玩家↔賽事↔對戰三者互通。
window.openEvent = function(eventId) {
  if (!eventId) return;
  location.hash = '#/event/' + encodeURIComponent(eventId);
};
/** 賽事連結（與 playerLink 同規格：全站唯一產生器，禁止各頁手刻）。 */
window.eventLink = function(eventId, label) {
  const txt = escapeHtml(label != null && label !== '' ? String(label) : String(eventId || ''));
  if (!eventId) return '<span class="small muted">' + txt + '</span>';
  const safe = String(eventId).replace(/'/g, '&apos;');
  return '<a href="#/event/' + encodeURIComponent(eventId) + '" class="player-name" title="開啟賽事賽程"'
    + ' onclick="openEvent(\'' + safe + '\'); return false;">' + txt + '</a>';
};
/** hash 路由：#/player/{email}、#/event/{eventId}。 */
window.handleAdminRoute = async function() {
  const h = String(location.hash || '');
  if (h.startsWith('#/player/')) {
    const em = decodeURIComponent(h.slice('#/player/'.length));
    if (em) showPlayerDetail(em);
  } else if (h.startsWith('#/event/')) {
    const ev = decodeURIComponent(h.slice('#/event/'.length));
    if (!ev) return;
    // tevShowBracket 讀的是「賽事統計」頁的快取（tournStatsCache 是模組層級變數，非 window 屬性）。
    //   從深連結直接進來時可能還沒載過 → 先補載；loadTournamentStats 需要該分頁的 DOM 容器存在，
    //   容器在 HTML 就寫死了（display:none 也讀得到），故不必先切分頁。
    if (!tournStatsCache || !(tournStatsCache.archives || []).length) {
      _tsModal('<div class="empty">載入賽事資料…（首次約 3-8 秒）</div>');
      try { await loadTournamentStats(false); } catch (e) { /* 失敗由下方 tevShowBracket 顯示訊息 */ }
    }
    tevShowBracket(encodeURIComponent(ev));
  }
};

// ── Messages modal (chat only, no game log) ─────────────────────
window.showMessagesModal = async function(code, source) {
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal"><h3>💬 房間 ${code} 的聊天紀錄</h3><div class="empty">Loading…</div></div>
    </div>
  `;
  const [msgsData, roomData] = await Promise.all([
    api('/api/admin/' + source + '/messages/' + code),
    api('/api/admin/' + source + '/rooms/' + code),
  ]);
  const messages = msgsData?.messages || [];
  const room = roomData?.room;
  // 建 uid → 玩家名稱 map（從 room.seats）
  const uidToName = {};
  // v0.72：建 uid → 角色 map（seats[0]=P1 / seats[1]=P2 / 其他=觀戰）
  const uidToRole = {};
  const seats = room?.seats || [];
  for (let i = 0; i < seats.length; i++) {
    const s = seats[i];
    if (s?.uid && s?.name) uidToName[s.uid] = s.name;
    if (s?.uid) {
      if (i === 0) uidToRole[s.uid] = 'p1';
      else if (i === 1) uidToRole[s.uid] = 'p2';
    }
  }
  const roleLabel = { p1: 'P1', p2: 'P2', spec: '觀戰' };
  const body = messages.length === 0
    ? '<div class="empty">（無聊天紀錄）</div>'
    : `<div class="chat-list">${messages.map(m => {
        const t = m.createdAt ? new Date(m.createdAt).toLocaleString('zh-TW') : '-';
        const name = uidToName[m.uid] || (m.uid?.slice(0, 8) + '…' ?? '?');
        const role = uidToRole[m.uid] || 'spec';
        return `
          <div class="chat-line chat-${role}">
            <div class="chat-meta"><span class="chat-role-badge role-${role}">${roleLabel[role]}</span><b>${escapeHtml(name)}</b> <span class="small">${t}</span></div>
            <div class="chat-text">${escapeHtml(m.text || '')}</div>
          </div>
        `;
      }).join('')}</div>`;
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal" style="min-width:520px;max-width:700px;">
        <h3>💬 房間 ${code} 的聊天紀錄（${messages.length}）</h3>
        ${body}
        <div style="margin-top:16px; text-align:right;">
          <button onclick="closeModal()">關閉</button>
        </div>
      </div>
    </div>
  `;
};

function renderUsers(el) {
  const total = allUsers.length;

  rebuildUidEmailMap();  // v0.5: users 載入完成 → 更新 email map

  // v6.275：50,000 掃描上限截斷警示（capped 才顯示）＋資料時間（伺服器 5 分鐘快取）
  const cappedWarn = _usersMeta.capped
    ? '<div id="users-capped-warn" style="background:#fdecea;border:1px solid #e57373;border-radius:6px;padding:8px 12px;margin:8px 0;color:#b71c1c;">⚠⚠ 名單已達伺服器 50,000 筆掃描上限，此列表<b>不是全部帳號</b>（上方總數統計同樣被截斷）。</div>'

  const dataAt = _usersMeta.cachedAt

    </div>
    <div class="table-wrap"><div id="tv-mount-users"></div></div>
  `;
  tvDefine({
    id: 'users',
    columns: {
      email: { get: (u) => (u.email || '').toLowerCase(), str: true },

      type: { get: (u) => (u.anonymous ? 2 : (u.emailVerified ? 0 : 1)) },
      lastSignIn: { get: (u) => (u.lastSignIn ? new Date(u.lastSignIn).getTime() : null) },
      createdAt: { get: (u) => (u.createdAt ? new Date(u.createdAt).getTime() : null) },
    },
    defaultSort: ['lastSignIn', 'desc'],
    searchText: (u) => ((u.email || '') + ' ' + (u.uid || '') + ' ' + (u.displayName || '')).toLowerCase(),

        + tvTh('users', 'email', 'Email') + tvTh('users', 'uid', 'UID') + tvTh('users', 'type', 'Type')
        + tvTh('users', 'lastSignIn', 'Last Sign-in') + tvTh('users', 'createdAt', 'Created')
