// ══ v1.64 牌組環境報告圖（匯出 PNG，供發佈給玩家看）════════════════════════
//
// 這張圖是要被轉發到 LINE／FB／Discord 的**傳播物**，設計約束跟網頁表格完全不同：
//   ・4:5 直式 1080×1350 —— 手機動態牆不裁切的最大直式比例（1:1 浪費列高、
//     16:9 在手機上字太小）。固定 2× 輸出＝2160×2700。
//     ⚠**不用 devicePixelRatio**：輸出檔是要傳給別人的，跟本機螢幕的 DPR 無關。
//   ・邏輯座標最小字級 22px：經 2× 放大再被 LINE 二次壓縮後仍讀得出來。
//   ・使用率畫長條、勝率用「大數字＋三段色」。⚠兩者**量綱不同**（份額 vs 比率），
//     都畫成長條的話讀者必然拿去互相比長短；且勝率集中在 40~60%，
//     畫成 bar 會全部一樣長、毫無解析度。
//
// 【趨勢】Wilson 要的是「使用率趨勢」，但後端只回單一時間窗的快照、沒有時間序列。
//   解法：usage/wins/losses/scanned 全都是「時間窗內的計數」→ 可加，
//   所以呼叫兩次端點（since=N 天、since=2N 天）相減就得到「前一個等長窗」。
//   ⚠**必須是 N 與 2N**：若用 30 天 vs 90 天，相減得到的是 60 天窗，
//     窗長不等 → 絕對量與佔比都不可比，算出來的箭頭是假的。
//   已逐行查證可加性成立：休閒側過濾用 endedAt:{$gte:since}、
//   錦標賽側用 finishedAt:{$gte:since}，兩者都是單純的時間下界。
const MI_URL = 'www.ptcg-tw-sim.com';
const MI = {
  W: 1080, H: 1350, S: 2, PAD: 48, TOPN: 10,
  // ⚠canvas 的 font 不吃 CSS 繼承、每次都要寫全字串，且**含空白的字體名一定要加引號**。
  F: '"Microsoft JhengHei UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif',
  // 色票刻意用短鍵名（bg0/txt/dim…）而不是 background/color：
  //   admin 有一條配色守衛會掃 `background:#xxx`／`color:#xxx` 這種 CSS 形態的字面，
  //   在 JS 裡寫成 `background: '#0F1726'` 有被它誤判成「頁面上的深色底」的風險。
  //   （這裡是畫進 canvas 的深色匯報圖，跟白底的 admin 頁面是兩回事。）
  K: {
    bg0: '#0F1726', bg1: '#1B2A45', row: '#223655', txt: '#F2F6FA', dim: '#8FA3BF',
    ln: '#31456B', up: '#4ADE80', dn: '#F87171', mid: '#AAB8CC',
    r1: '#F5C044', r2: '#C7D2E2', r3: '#D89A6A',
  },
  SRC: {
    casual: { label: '一般對戰', a1: '#3ED6C0', a2: '#57B8F0' },
    tourn: { label: '錦標賽', a1: '#F5C044', a2: '#F09A3E' },
  },
};
// 後端的查詢上限（依時間新到舊取）。撞到上限＝2N 窗的舊資料根本沒被掃到。
const MI_SCAN_CAP = { casual: ['casualMatches', 20000], tourn: ['tournEvents', 200] };

/** 圓角矩形。⚠不用 ctx.roundRect —— VM 端的瀏覽器版本不確定，自己畫 8 行最保險。 */
function miRR(ctx, x, y, w, h, r) {
  const k = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.lineTo(x + w - k, y); ctx.quadraticCurveTo(x + w, y, x + w, y + k);
  ctx.lineTo(x + w, y + h - k); ctx.quadraticCurveTo(x + w, y + h, x + w - k, y + h);
  ctx.lineTo(x + k, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - k);
  ctx.lineTo(x, y + k); ctx.quadraticCurveTo(x, y, x + k, y);
  ctx.closePath();
}
function miFont(ctx, px, bold) { ctx.font = (bold ? 'bold ' : '') + px + 'px ' + MI.F; }
/** 量測後截斷。⚠不可用「字數×平均寬」估算：原型名常混半形（例「蜜集大蛇ex」），寬度不均。 */
function miFit(ctx, s, maxW) {
  let t = String(s === null || s === undefined ? '' : s);
  if (ctx.measureText(t).width <= maxW) return t;
  while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
  return t + '…';
}
function miPct(v, d) { return (v === null || v === undefined) ? '—' : (v * 100).toFixed(d === undefined ? 1 : d) + '%'; }
function miDate(ms) { const d = new Date(ms); return (d.getMonth() + 1) + '/' + d.getDate(); }
function miStamp(ms) {
  const d = new Date(ms), p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
}

// logo 只載一次並快取。⚠`drawImage` 一張尚未 decode 完成的 Image 會**靜默不畫也不報錯**，
//   成品就是 logo 憑空消失、完全沒有線索。用 decode() 而非 onload：它連解碼都等完。
//   （icons/ 與 admin 頁面同源，所以畫進 canvas 不會 taint、toBlob 可正常匯出。）
let _miLogo = null, _miLogoTried = false;
async function miLogo() {
  if (_miLogo || _miLogoTried) return _miLogo;
  _miLogoTried = true;
  try {
    const img = new Image();
    // ⚠v1.65：用**主站**的紅白球 icon，不是 admin 自己的紫色 ADMIN icon ——
    //   這張圖是要發給玩家的，落款當然要是玩家認得的站台識別。
    //   ⚠但**不可以**直接連 www.ptcg-tw-sim.com 的圖：跨來源圖片會把 canvas 標成
    //     tainted，toBlob() 直接拋 SecurityError、整張圖匯不出來。
    //     所以是把主站的 icon 複製一份到 oracle-admin/icons/site-icon-192.png（同源）。
    //     update-admin-full.bat 本來就會整包上傳 icons/，會一併帶上去。
    img.src = 'icons/site-icon-192.png?v=1.65';
    await img.decode();
    _miLogo = img;
  } catch (e) { _miLogo = null; }   // 載不到就退成純文字站名，不讓整張圖產不出來
  return _miLogo;
}

/**
 * 由「本期(since=N)」與「寬窗(since=2N)」推導前一個等長窗的變化。
 * 回 { ok:false, reason } 或 { ok:true, by:Map(ruleId→{isNew|dPP}), prevFrom, prevTo }。
 * ⚠寬窗是**含本期**的累計，一定要相減才是前期。
 */
function miTrend(days, cur, wide, srcKey) {
  const off = (reason) => ({ ok: false, reason });
  if (!(days > 0)) return off('統計範圍選「全部時間」時沒有可對比的前期');
  if (!wide) return off('前期資料讀取失敗');
  const c = cur[srcKey], w = wide[srcKey];
  if (!c || !w) return off('前期資料缺這個資料源');
  // ⚠伺服器查詢有上限（休閒最多最近 20000 場、錦標賽最多最近 200 場賽事，皆新到舊）。
  //   撞到上限代表寬窗的舊資料根本沒被掃到，相減會憑空生出一整片「下降」。
  const cap = MI_SCAN_CAP[srcKey];
  if ((wide.scanned && wide.scanned[cap[0]] || 0) >= cap[1]) return off('資料量已達伺服器查詢上限，前期不完整');
  const dk = srcKey === 'casual' ? 'casualDecks' : 'tournDecks';
  const curN = (cur.scanned && cur.scanned[dk]) || 0;
  const prevN = ((wide.scanned && wide.scanned[dk]) || 0) - curN;
  if (curN <= 0) return off('本期沒有資料');
  // 前期明顯比本期少 → 多半是資料還沒累積滿兩期，這時算出來的「全面上升」是假象。
  if (prevN < curN * 0.3) return off('前期樣本過少（資料可能尚未累積滿兩期）');

  const wideUsage = new Map();
  for (const r of (w.rows || [])) wideUsage.set(String(r.ruleId), r.usage || 0);
  const by = new Map();
  for (const r of (c.rows || [])) {
    const id = String(r.ruleId);
    const prevUsage = (wideUsage.get(id) || 0) - (r.usage || 0);
    // 新原型（新彈剛發售）前期幾乎沒人用，算 Δ 會是無意義的暴漲 → 改標 NEW。
    if (prevUsage < 5) { by.set(id, { isNew: true }); continue; }
    const dPP = ((r.usage || 0) / curN - prevUsage / prevN) * 100;
    by.set(id, { isNew: false, dPP });
  }
  const now = Date.now();
  return { ok: true, by, curN, prevN, prevFrom: now - days * 2 * 86400000, prevTo: now - days * 86400000 };
}

/** 產生一張報告圖。回 canvas（該資料源沒有任何命中原型時回 null）。 */
async function miDraw(srcKey, cur, trend, days) {
  const blk = cur[srcKey];
  if (!blk || !(blk.rows || []).length) return null;
  const S = MI.SRC[srcKey], K = MI.K;
  const rows = (blk.rows || []).slice(0, MI.TOPN);      // rows 後端已依 usage 由大到小排序
  const dk = srcKey === 'casual' ? 'casualDecks' : 'tournDecks';
  // ⚠分母用 scanned 的副數，不要用 rows 的 usage 加總：未分類那一大塊不在 rows 裡，
  //   用加總當分母會把每個原型的佔比灌水。
  const total = (cur.scanned && cur.scanned[dk]) || 0;
  const share = (u) => (total > 0 ? u / total : 0);

  const cv = document.createElement('canvas');
  cv.width = MI.W * MI.S; cv.height = MI.H * MI.S;
  const ctx = cv.getContext('2d');
  ctx.scale(MI.S, MI.S);            // 之後一律用邏輯座標（1080×1350）
  // ⚠預設 textBaseline='alphabetic' 對中文的視覺垂直中心偏移很明顯、混排數字更亂。
  //   全圖統一 middle + 以列中心 y 定位，省掉所有手調。
  ctx.textBaseline = 'middle';

  // ── 背景 ──
  const bg = ctx.createLinearGradient(0, 0, 0, MI.H);
  bg.addColorStop(0, K.bg0); bg.addColorStop(1, K.bg1);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, MI.W, MI.H);
  // 裝飾：斜置的卡牌剪影（63:88＝實體卡長寬比）。純程式繪製，不用任何官方素材。
  ctx.save();
  ctx.strokeStyle = K.ln; ctx.globalAlpha = 0.45; ctx.lineWidth = 2;
  for (const d of [[960, 46, 0.22], [96, 1290, -0.18]]) {
    for (let i = 0; i < 3; i++) {
      ctx.save(); ctx.translate(d[0], d[1]); ctx.rotate(d[2] + i * 0.17);
      miRR(ctx, -63, -88, 126, 176, 10); ctx.stroke(); ctx.restore();
    }
  }
  ctx.restore();

  // ── 品牌帶（0–140）──
  const logo = await miLogo();
  let tx = MI.PAD;
  if (logo) { ctx.drawImage(logo, MI.PAD, 30, 76, 76); tx = MI.PAD + 94; }
  ctx.textAlign = 'left';
  ctx.fillStyle = K.txt; miFont(ctx, 38, true);
  ctx.fillText('PTCG 台灣線上對戰模擬器', tx, 56);
  ctx.fillStyle = K.dim; miFont(ctx, 26, false);
  ctx.fillText(MI_URL, tx, 92);
  ctx.textAlign = 'right';
  ctx.fillStyle = K.dim; miFont(ctx, 24, false);
  ctx.fillText('資料截至 ' + new Date().toLocaleDateString('zh-TW'), MI.W - MI.PAD, 56);

  // ── 標題帶（140–260）──
  ctx.fillStyle = S.a1;
  miRR(ctx, MI.PAD, 166, 8, 62, 4); ctx.fill();
  ctx.textAlign = 'left';
  ctx.fillStyle = K.txt; miFont(ctx, 54, true);
  ctx.fillText('本期牌組環境報告', MI.PAD + 24, 190);
  const period = days > 0
    ? miDate(Date.now() - days * 86400000) + '–' + miDate(Date.now())
    : '全部時間';
  ctx.fillStyle = K.dim; miFont(ctx, 28, false);
  ctx.fillText(S.label + '　・　' + period + '　・　共 ' + total.toLocaleString('zh-TW') + ' 副',
               MI.PAD + 24, 234);

  // ── 欄位表頭（玩家不會知道 bar 跟右邊那個大數字各是什麼，一定要標）──
  ctx.textAlign = 'left';
  ctx.fillStyle = K.dim; miFont(ctx, 22, false);
  ctx.fillText('牌組', 116, 268);
  ctx.fillText('使用率 ・ 使用次數', 508, 268);
  ctx.textAlign = 'right';
  ctx.fillText('勝率', 1012, 268);

  // ── 排行區（286–1173）：10 列 × 86，列距 3 ──
  // 版面：排名 48–102｜名稱與 bar 116–690｜勝率右對齊 1012
  const maxShare = Math.max.apply(null, rows.map((r) => share(r.usage))) || 1;
  rows.forEach((r, i) => {
    const y = 286 + i * 89;
    ctx.fillStyle = K.row; miRR(ctx, MI.PAD, y, MI.W - MI.PAD * 2, 86, 12); ctx.fill();
    if (i < 3) {   // 前三名左緣加獎牌色邊條
      ctx.fillStyle = [K.r1, K.r2, K.r3][i];
      miRR(ctx, MI.PAD, y, 5, 86, 3); ctx.fill();
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = i < 3 ? K.r1 : K.dim; miFont(ctx, 34, true);
    ctx.fillText(String(i + 1), MI.PAD + 34, y + 43);

    // 上層：原型名（＋趨勢）
    ctx.textAlign = 'left';
    ctx.fillStyle = K.txt; miFont(ctx, 32, true);
    ctx.fillText(miFit(ctx, r.name, 360), 116, y + 26);
    const t = trend && trend.ok ? trend.by.get(String(r.ruleId)) : null;
    if (t && t.isNew) {
      miFont(ctx, 22, true);
      const w = ctx.measureText('新登場').width + 20;
      ctx.fillStyle = K.r1; miRR(ctx, 500, y + 13, w, 27, 13); ctx.fill();
      ctx.fillStyle = K.bg1; ctx.textAlign = 'center';
      ctx.fillText('新登場', 500 + w / 2, y + 26);
      ctx.textAlign = 'left';
    } else if (t && typeof t.dPP === 'number') {
      // ±1.5 個百分點以內視為雜訊，畫成灰色「持平」。不設門檻的話 ±0.2 也會被讀成趨勢。
      // ⚠給玩家看的圖不寫「pp」「n=」這類統計術語，一律講人話。
      const up = t.dPP >= 1.5, dn = t.dPP <= -1.5;
      ctx.fillStyle = up ? K.up : (dn ? K.dn : K.mid); miFont(ctx, 24, true);
      ctx.fillText(up ? '▲ 較上期 +' + t.dPP.toFixed(1) + '%'
                 : (dn ? '▼ 較上期 ' + t.dPP.toFixed(1) + '%' : '－ 與上期持平'), 500, y + 26);
    }

    // 下層：使用率長條（以榜內最大佔比為滿長）＋ 佔比與樣本數
    const bw = Math.max(6, Math.round(380 * share(r.usage) / maxShare));
    const g = ctx.createLinearGradient(116, 0, 116 + bw, 0);
    g.addColorStop(0, S.a1); g.addColorStop(1, S.a2);
    ctx.fillStyle = K.ln; miRR(ctx, 116, y + 52, 380, 16, 8); ctx.fill();
    ctx.fillStyle = g; miRR(ctx, 116, y + 52, bw, 16, 8); ctx.fill();
    ctx.fillStyle = K.dim; miFont(ctx, 23, false);
    ctx.fillText(miPct(share(r.usage)) + '　・　' + r.usage + ' 次', 508, y + 60);

    // 右欄：勝率大數字（三段色）。⚠樣本 <10 副一律顯示「—」，不管實際值多少。
    ctx.textAlign = 'right';
    if (!r.sampleOk || r.winRate === null || r.winRate === undefined) {
      ctx.fillStyle = K.mid; miFont(ctx, 40, true);
      ctx.fillText('—', 1012, y + 32);
      ctx.fillStyle = K.dim; miFont(ctx, 21, false);
      ctx.fillText('資料太少', 1012, y + 64);
    } else {
      ctx.fillStyle = r.winRate >= 0.52 ? K.up : (r.winRate < 0.48 ? K.dn : K.mid);
      miFont(ctx, 46, true);
      ctx.fillText(miPct(r.winRate), 1012, y + 32);
      ctx.fillStyle = K.dim; miFont(ctx, 21, false);
      ctx.fillText('勝率', 1012, y + 64);
    }
  });

  // ── 未分類帶（1170–1250）──
  // 未分類刻意**不進排行**：它的 usage 常常是第一名，混進去會有一根巨大的「未分類」
  //   長條主宰整張圖、資訊量為零。改成獨立一行誠實揭露。
  const u = blk.unclassified || {};
  ctx.textAlign = 'left';
  ctx.strokeStyle = K.ln; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(MI.PAD, 1192); ctx.lineTo(MI.W - MI.PAD, 1192); ctx.stroke();
  ctx.fillStyle = K.dim; miFont(ctx, 24, false);
  ctx.fillText('未分類 ' + (u.usage || 0).toLocaleString('zh-TW') + ' 副（'
    + miPct(share(u.usage || 0)) + '　・　勝率 ' + (u.winRate === null || u.winRate === undefined ? '—' : miPct(u.winRate))
    + '）　・　分類規則持續擴充中', MI.PAD, 1222);

  // ── 頁腳（1250–1350）：網址在圖上出現兩次（頂部小、底部大置中），
  //    被裁切時至少留一個。──
  ctx.textAlign = 'center';
  const cx = MI.W / 2;
  miFont(ctx, 30, true);
  const uw = ctx.measureText(MI_URL).width;
  if (logo) ctx.drawImage(logo, cx - uw / 2 - 44, 1268, 32, 32);
  ctx.fillStyle = K.txt;
  ctx.fillText(MI_URL, cx + (logo ? 18 : 0), 1284);
  ctx.fillStyle = K.dim; miFont(ctx, 22, false);
  // ⚠給玩家看的圖，說明一律講人話 —— 不寫 pp / n= / 樣本數 這類統計術語。
  const foot = (trend && trend.ok)
    ? '▲▼ 是與上一期（' + miDate(trend.prevFrom) + '–' + miDate(trend.prevTo)
      + '）相比的使用率增減，變化不到 1.5% 視為持平　・　使用不到 10 次的牌組不顯示勝率'
    : '本期為單期成績，未與上期比較' + (trend && trend.reason ? '（' + trend.reason + '）' : '')
      + '　・　使用不到 10 次的牌組不顯示勝率';
  ctx.fillText(foot, cx, 1322);
  return cv;
}

let _miBusy = false;
let _miOut = { casual: null, tourn: null, stamp: '' };

window.openMetaImageExport = async function () {
  if (_miBusy) return;                       // 連點防呆
  if (!_archStats) { alert('請先按「📊 計算統計」。'); return; }
  const btn = document.getElementById('meta-img-btn');
  const label = btn ? btn.textContent : '';
  _miBusy = true;
  if (btn) { btn.disabled = true; btn.textContent = '產生中…'; }
  try {
    // ⚠先把資料與參數快照成區域變數：產圖期間使用者可能又去動了時間下拉。
    const cur = _archStats;
    const days = Number(currentArchSince() || 0);
    let wide = null;
    if (days > 0) {
      // 寬窗＝2N 天（含本期），相減才是「前一個等長窗」。失敗就降級成無趨勢快照，不整個失敗。
      try {
        const r = await api('/api/admin/deck-archetype-stats?source=all&since='
          + (Date.now() - days * 2 * 86400000));
        if (r && !r.error) wide = r;
      } catch (e) { wide = null; }
    }
    _miOut = {
      casual: await miDraw('casual', cur, miTrend(days, cur, wide, 'casual'), days),
      tourn: await miDraw('tourn', cur, miTrend(days, cur, wide, 'tourn'), days),
      stamp: miStamp(Date.now()),
    };
    if (!_miOut.casual && !_miOut.tourn) { alert('目前沒有任何命中的牌組原型，無法產圖。'); return; }

    alert('產圖失敗：' + (e && e.message ? e.message : e));
  } finally {
    _miBusy = false;
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
};

window.downloadMetaImage = function (srcKey) {
  const cv = _miOut[srcKey];
  if (!cv) return;
  cv.toBlob(function (blob) {          // ⚠toBlob 是 callback 非同步，不是回傳值
    if (!blob) { alert('產生檔案失敗'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    // 檔名全 ASCII：中文檔名在部分聊天軟體上傳時會有編碼問題。
    a.download = 'ptcg-meta-' + srcKey + '-' + (_miOut.stamp || miStamp(Date.now())) + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    // ⚠立即 revoke 會讓部分瀏覽器取消下載，要延遲。
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }, 'image/png');
};

window.archSort = function(key) {
  // 同一欄再點一次＝反向；換欄位時：文字欄預設升冪(A→Z)，數字欄預設降冪(大→小)
  if (_archSortKey === key) _archSortAsc = !_archSortAsc;
  else { _archSortKey = key; _archSortAsc = (key === 'name'); }
  renderArchetypeStats();
};

/** 依目前排序設定排一份新陣列（不動原資料）。 */
function sortArchRows(rows) {
  const k = _archSortKey, dir = _archSortAsc ? 1 : -1;
  return [...rows].sort((a, b) => {
    if (k === 'name') return String(a.name || '').localeCompare(String(b.name || ''), 'zh-Hant') * dir;
    const av = a[k], bv = b[k];
    // ⭐勝率可能是 null（沒有分出勝負的場次）→ 無論升冪降冪都排最後，不要混在數字中間
    if (av === null || av === undefined) return (bv === null || bv === undefined) ? 0 : 1;
    if (bv === null || bv === undefined) return -1;
    if (av === bv) return (b.usage - a.usage);   // 同值時用使用次數當第二排序，順序才穩定
    return (av - bv) * dir;
  });
}

function renderArchetypeStats() {
  const box = document.getElementById('arch-stats-box');
  if (!box) return;
  const d = _archStats;
  if (!d) { box.innerHTML = '<div class="empty">按上方「📊 計算統計」開始。</div>'; return; }
  const pct = (v) => (v === null || v === undefined) ? '-' : (v * 100).toFixed(1) + '%';
  const wrCell = (r) => {
    if (r.winRate === null) return '<td class="small muted">-</td>';
    const col = r.winRate > 0.55 ? '#2e7d32' : (r.winRate < 0.45 ? '#c62828' : '#1a2332');
    // 樣本太少的勝率灰掉：1 勝 0 負 =100% 會誤導
    if (!r.sampleOk) return '<td class="small muted" title="樣本不足 10 副，勝率僅供參考">' + pct(r.winRate) + ' <span class="small">(樣本少)</span></td>';
    return '<td style="color:' + col + ';font-weight:600;">' + pct(r.winRate) + '</td>';
  };
  const tbl = (title, blk, scannedText) => {
    if (!blk) return '';
    const sorted = sortArchRows(blk.rows || []);
    // v1.56：平手欄只在真的有平手資料時才顯示。
    //   錦標賽側統計本來就跳過無勝方的對局（draws 恆 0）；休閒側平局極罕見（引擎每條結束路徑都會定勝負）。
    //   ⚠後端的 draw 分支保留不動——時限平手判雙敗是真實存在的資料狀態，砍掉會在下次發生時炸統計。
    const showDraws = (blk.rows || []).some((r) => (r.draws || 0) > 0) || (blk.unclassified?.draws || 0) > 0;
    const arrow = (k) => _archSortKey === k ? (_archSortAsc ? ' ▲' : ' ▼') : '';
    const th = (k, label, title) =>
      '<th onclick="archSort(\'' + k + '\')" style="cursor:pointer;user-select:none;white-space:nowrap;"'
      + (title ? ' title="' + title + '"' : '') + '>' + label + arrow(k) + '</th>';
    // v1.56：牌組名可點 → 開該原型的牌組明細（代表 60 張／勝場版／遺珠之憾）
    const srcKey = (title.indexOf('錦標賽') >= 0) ? 'tourn' : 'casual';
    const rows = sorted.map((r, i) =>
      '<tr><td>' + (i + 1) + '</td>'
      + '<td><a href="#" class="player-name" title="看這個原型的代表牌組與推薦搭配"'
      + ' onclick="showArchetypeDetail(\'' + String(r.ruleId).replace(/'/g, '&apos;') + '\',\'' + srcKey + '\'); return false;"><b>'
      + escapeHtml(r.name) + '</b></a></td>'
      + '<td>' + r.usage + '</td>'
      + '<td>' + r.wins + '</td><td>' + r.losses + '</td>'
      + (showDraws ? '<td>' + (r.draws || 0) + '</td>' : '')
      + wrCell(r) + '</tr>').join('');
    const u = blk.unclassified || {};
    // v1.63 高頻卡改成可點的 chip：點一下就把該卡加進「支援型寶可夢」排除清單並重算。
    //   後端已先濾掉非寶可夢（老大的指令／基本能量這類通用卡對「該開什麼規則」沒有鑑別度）。
    const uTop = (u.topCards || []).slice(0, 20).map((c) =>
      '<span class="uncls-chip" title="點一下：設為支援型寶可夢（從此清單排除）"'
      + ' onclick="addSupportPokemon(\'' + String(c.name).replace(/'/g, '&apos;') + '\')">'
      + escapeHtml(c.name) + '<span class="uncls-n">×' + c.decks + '</span></span>').join('');
    const uFiltered = u.filteredOut || {};
    const headHtml = '<tr><th>#</th>' + th('name', '牌組原型') + th('usage', '使用次數')
      + th('wins', '勝') + th('losses', '負') + (showDraws ? th('draws', '平') : '')
      + th('winRate', '勝率', '樣本少於 10 副的勝率僅供參考，排序時會一併計入') + '</tr>';
    return '<h4 style="margin:14px 0 6px;">' + title + '</h4>'
      + '<div class="small muted" style="margin-bottom:6px;">' + scannedText + '</div>'
      + '<div class="stats-box" style="padding:8px;overflow-x:auto;">'

}

// ══ v1.50 玩家總覽（批次1）══════════════════════════════════════════════════
//   目標：admin **任何**頁面點到玩家 email，都能開出同一份完整玩家檔案。
//   做法：全站一律呼叫 playerLink() 產生連結（禁止各頁自己手刻 onclick），
//         連結寫進網址 hash（#/player/xxx）→ 可分享、可重整、可上一頁。
//   ⚠沒有 email 的玩家（本機對戰 P2／匿名）天生無法建檔：matchRecords 只存 email 不存 uid，
//     此時退回純文字並標「匿名」，不要產生點了沒反應的假連結。
window.openPlayer = function(email) {
  if (!email || !String(email).includes('@')) return;
  location.hash = '#/player/' + encodeURIComponent(email);
};
/** 全站唯一的玩家連結產生器。label 省略時顯示 email 本身。 */
window.playerLink = function(email, label, cls) {
  const txt = escapeHtml(label != null && label !== '' ? String(label) : String(email || ''));
  if (!email || !String(email).includes('@')) {
    return '<span class="small muted">' + (txt || '（匿名）') + '</span>';
  }
  const safe = String(email).replace(/'/g, '&apos;');
  return '<a href="#/player/' + encodeURIComponent(email) + '" class="' + (cls || 'player-name')
    + '" title="開啟玩家總覽" onclick="openPlayer(\'' + safe + '\'); return false;">' + txt + '</a>';
};
// v1.54 批次4：賽事也做成可深連結的實體，玩家↔賽事↔對戰三者互通。
window.openEvent = function(eventId) {
  if (!eventId) return;
  location.hash = '#/event/' + encodeURIComponent(eventId);
};
/** 賽事連結（與 playerLink 同規格：全站唯一產生器，禁止各頁手刻）。 */
window.eventLink = function(eventId, label) {
  const txt = escapeHtml(label != null && label !== '' ? String(label) : String(eventId || ''));
  if (!eventId) return '<span class="small muted">' + txt + '</span>';
  const safe = String(eventId).replace(/'/g, '&apos;');
  return '<a href="#/event/' + encodeURIComponent(eventId) + '" class="player-name" title="開啟賽事賽程"'
    + ' onclick="openEvent(\'' + safe + '\'); return false;">' + txt + '</a>';
};
/** hash 路由：#/player/{email}、#/event/{eventId}。 */
window.handleAdminRoute = async function() {
  const h = String(location.hash || '');
  if (h.startsWith('#/player/')) {
    const em = decodeURIComponent(h.slice('#/player/'.length));
    if (em) showPlayerDetail(em);
  } else if (h.startsWith('#/event/')) {
    const ev = decodeURIComponent(h.slice('#/event/'.length));
    if (!ev) return;
    // tevShowBracket 讀的是「賽事統計」頁的快取（tournStatsCache 是模組層級變數，非 window 屬性）。
    //   從深連結直接進來時可能還沒載過 → 先補載；loadTournamentStats 需要該分頁的 DOM 容器存在，
    //   容器在 HTML 就寫死了（display:none 也讀得到），故不必先切分頁。
    if (!tournStatsCache || !(tournStatsCache.archives || []).length) {
      _tsModal('<div class="empty">載入賽事資料…（首次約 3-8 秒）</div>');
      try { await loadTournamentStats(false); } catch (e) { /* 失敗由下方 tevShowBracket 顯示訊息 */ }
    }
    tevShowBracket(encodeURIComponent(ev));
  }
};

window.showMessagesModal = async function(code, source) {
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal"><h3>💬 房間 ${code} 的聊天紀錄</h3><div class="empty">Loading…</div></div>
    </div>
  `;
  const [msgsData, roomData] = await Promise.all([
    api('/api/admin/' + source + '/messages/' + code),
    api('/api/admin/' + source + '/rooms/' + code),
  ]);
  const messages = msgsData?.messages || [];
  const room = roomData?.room;
  // 建 uid → 玩家名稱 map（從 room.seats）
  const uidToName = {};
  // v0.72：建 uid → 角色 map（seats[0]=P1 / seats[1]=P2 / 其他=觀戰）
  const uidToRole = {};
  const seats = room?.seats || [];
  for (let i = 0; i < seats.length; i++) {
    const s = seats[i];
    if (s?.uid && s?.name) uidToName[s.uid] = s.name;
    if (s?.uid) {
      if (i === 0) uidToRole[s.uid] = 'p1';
      else if (i === 1) uidToRole[s.uid] = 'p2';
    }
  }
  const roleLabel = { p1: 'P1', p2: 'P2', spec: '觀戰' };
  const body = messages.length === 0
    ? '<div class="empty">（無聊天紀錄）</div>'
    : `<div class="chat-list">${messages.map(m => {
        const t = m.createdAt ? new Date(m.createdAt).toLocaleString('zh-TW') : '-';
        const name = uidToName[m.uid] || (m.uid?.slice(0, 8) + '…' ?? '?');
        const role = uidToRole[m.uid] || 'spec';
        return `
          <div class="chat-line chat-${role}">
            <div class="chat-meta"><span class="chat-role-badge role-${role}">${roleLabel[role]}</span><b>${escapeHtml(name)}</b> <span class="small">${t}</span></div>
            <div class="chat-text">${escapeHtml(m.text || '')}</div>
          </div>
        `;
      }).join('')}</div>`;
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal" style="min-width:520px;max-width:700px;">
        <h3>💬 房間 ${code} 的聊天紀錄（${messages.length}）</h3>
        ${body}
        <div style="margin-top:16px; text-align:right;">
          <button onclick="closeModal()">關閉</button>
        </div>
      </div>
    </div>
  `;
};

//   全部退役 —— 載入交給 single-flight fetchAllUsers()，排序分頁交給中央 tv 管線。
async function loadUsers(reset = false) {
  const el = document.getElementById('tab-users');
  // v1.60：資料取得完全交給 single-flight fetchAllUsers()。
  //   舊的 _loadingUsers / _usersLoaded / usersPageToken 三個旗標與 while 迴圈全部退役 ——
  //   它們正是「名單重複顯示」的成因（見 fetchAllUsers 上方說明）。
  if (!allUsers.length || reset) {
    el.innerHTML = '<h2>👤 玩家帳號</h2><div class="empty">Loading…（一次取回全部帳號，之後翻頁與排序都不再打伺服器）</div>';
  }
  try {
    allUsers = await fetchAllUsers(!!reset);
    _emailMapPrimed = true;
    rebuildUidEmailMap();
    renderUsers(el);
  } catch (e) {
    el.innerHTML = '<h2>👤 玩家帳號</h2><div class="empty">Error: ' + escapeHtml(e.message || String(e)) + '</div>';
  }
}

function renderUsers(el) {
  const total = allUsers.length;
  const named = allUsers.filter(u => !u.anonymous).length;
  rebuildUidEmailMap();  // v0.5: users 載入完成 → 更新 email map
  // v1.60 改走中央 tv 管線：每頁 50 筆 + 排序後翻頁不會被打回原序。
  //   搜尋框放在 mount 容器外，否則每敲一鍵重繪就會失去輸入焦點。
  el.innerHTML = `
    <h2>👤 玩家帳號（共 ${total} 個，註冊 ${named}，匿名 ${total - named}）</h2>
    <div class="toolbar">
      ${tvSearchBox('users', '🔎 搜尋 email / uid / displayName…')}
      <span class="small" style="color:#9aa3b0;">點欄位標題可排序；每頁 50 筆</span>
    </div>
    <div class="table-wrap"><div id="tv-mount-users"></div></div>
  `;
  tvDefine({
    id: 'users',
    columns: {
      email: { get: (u) => (u.email || '').toLowerCase(), str: true },
      uid: { get: (u) => u.uid, str: true },
      // Type 排序權重：已驗證 email=0、未驗證=1、匿名=2
      type: { get: (u) => (u.anonymous ? 2 : (u.emailVerified ? 0 : 1)) },
      lastSignIn: { get: (u) => (u.lastSignIn ? new Date(u.lastSignIn).getTime() : null) },
      createdAt: { get: (u) => (u.createdAt ? new Date(u.createdAt).getTime() : null) },
    },
    defaultSort: ['lastSignIn', 'desc'],
    searchText: (u) => ((u.email || '') + ' ' + (u.uid || '') + ' ' + (u.displayName || '')).toLowerCase(),
    mount: () => document.getElementById('tv-mount-users'),
    render: (v, tv) => {
      if (!v.total) return '<div class="empty">' + (tv.search ? '查無符合帳號' : '沒有帳號資料') + '</div>';
      return '<table><thead><tr>'
        + tvTh('users', 'email', 'Email') + tvTh('users', 'uid', 'UID') + tvTh('users', 'type', 'Type')
        + tvTh('users', 'lastSignIn', 'Last Sign-in') + tvTh('users', 'createdAt', 'Created')
        + '<th>Actions</th></tr></thead><tbody>' + renderUsersRows(v.pageRows) + '</tbody></table>';
    },
  });
  tvSetRows('users', allUsers);
}

async function loadFeedback(resetPage = true) {
  const el = document.getElementById('tab-feedback');
  el.innerHTML = '<h2>💬 意見回饋</h2><div class="empty">Loading…</div>';
  const data = await api('/api/admin/firebase/feedback');
  if (!data || data.error) { el.innerHTML = '<div class="empty">Error: ' + (data?.error || 'unknown') + '</div>'; return; }
  feedbackList = data.feedback || [];   // 端點已依 createdAt desc 排序（最新在前）
  if (resetPage) feedbackPage = 1;
  // v1.15: 直接渲染；email 由 renderFeedback 觸發「只查當前頁 10 個 uid」批次查詢（免載全量 users）
  renderFeedback(el);
}

function renderFeedback(el) {
  if (!feedbackList.length) { el.innerHTML = '<h2>💬 意見回饋</h2><div class="empty">No feedback</div>'; return; }
  const unreplied = feedbackList.filter(f => !f.reply).length;
  const total = feedbackList.length;
  const totalPages = Math.max(1, Math.ceil(total / FEEDBACK_PAGE_SIZE));
  // v1.13: clamp 頁碼（回覆/刪除後筆數變動仍安全）
  if (feedbackPage > totalPages) feedbackPage = totalPages;
  if (feedbackPage < 1) feedbackPage = 1;
  const start = (feedbackPage - 1) * FEEDBACK_PAGE_SIZE;
  const pageItems = feedbackList.slice(start, start + FEEDBACK_PAGE_SIZE);  // 只渲染當前頁 10 則
  const pager = renderFeedbackPager(feedbackPage, totalPages, total);
  el.innerHTML = `
    <h2>💬 意見回饋（${total}，未回覆 ${unreplied}）</h2>
    <div class="small" style="color:#9aa3b0; margin-bottom:12px;">
      💡 玩家在主站打開意見回饋視窗時，會看到自己提交過的歷史回饋與你在這裡寫的回覆。送出/編輯/刪除回覆會即時同步到玩家端。
    </div>
    ${pager}
    <div id="feedback-list">
      ${pageItems.map(f => renderFeedbackItem(f)).join('')}
    </div>
    ${pager}
  `;
  // v1.15: 只查當前頁可見的 uid 的 email（免載全量 users）
  ensureFeedbackEmails(pageItems);
}

// v1.15: 只查「當前頁可見」的 uid 批次查 email，寫入 fbEmailCache 後重渲染當前頁
async function ensureFeedbackEmails(pageItems) {
  const uids = [...new Set(pageItems.map(f => f.uid).filter(Boolean))];
  const need = uids.filter(u => !(u in fbEmailCache));
  if (!need.length) return;
  const res = await api('/api/admin/firebase/users/lookup', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ uids: need }),
  });
  if (!res || res.error) return;
  const emails = res.emails || {};
  for (const u of need) fbEmailCache[u] = (u in emails) ? emails[u] : null;
  const el = document.getElementById('tab-feedback');
  if (el && currentTab === 'feedback') renderFeedback(el);  // 補上 email 後重渲染
}

// v1.13: 意見回饋翻頁控制列（最新在前；每頁 10 則）
function renderFeedbackPager(page, totalPages, total) {
  const btn = (label, target, disabled) =>
    '<button class="fb-page-btn" ' + (disabled ? 'disabled' : 'onclick="fbGoPage(' + target + ')"') + '>' + label + '</button>';
  return `
    <div class="fb-pager" style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:10px 0;">
      ${btn('« 第一頁', 1, page <= 1)}
      ${btn('‹ 上一頁', page - 1, page <= 1)}
      <span class="small" style="color:#9aa3b0; padding:0 4px;">第 ${page} / ${totalPages} 頁（共 ${total} 則，每頁 ${FEEDBACK_PAGE_SIZE}）</span>
      ${btn('下一頁 ›', page + 1, page >= totalPages)}
      ${btn('最後一頁 »', totalPages, page >= totalPages)}
    </div>`;
}
window.fbGoPage = function(n) {
  feedbackPage = n;
  const el = document.getElementById('tab-feedback');
  if (el) { renderFeedback(el); el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
};

function renderFeedbackItem(f) {
  const created = f.createdAt ? new Date(f.createdAt).toLocaleString('zh-TW') : '-';
  const replied = f.repliedAt ? new Date(f.repliedAt).toLocaleString('zh-TW') : null;
  const uidShort = (f.uid || f.deviceId || 'unknown').slice(0, 16);
  const deviceShort = (f.deviceId || '').slice(0, 8);
  const hasReply = !!f.reply;
  const userAgent = f.userAgent || '';
  // v1.15: email 改用「當前頁 uid 批次查詢」結果快取（fbEmailCache）— 免載全量 users
  const fbLooked = f.uid ? (f.uid in fbEmailCache) : false;
  const fbEmail = fbLooked ? (fbEmailCache[f.uid] || '') : '';
  return `
    <div class="feedback-item" data-fbid="${f.id}">
      <div class="feedback-meta">
        📅 <b>${created}</b>
        · <span class="mono small">UID: ${uidShort}…</span>
        ${f.uid ? (fbLooked ? (fbEmail ? ' · <span class="mono small" style="font-weight:600;">✉ ' + playerLink(fbEmail) + '</span>' : ' · <span class="mono small" style="color:#b0b6c0;">✉ 無 email（匿名）</span>') : ' · <span class="mono small" style="color:#9aa3b0;">✉ 查詢中…</span>') : ''}
        ${deviceShort ? ' · <span class="mono small">device: ' + deviceShort + '</span>' : ''}
        ${hasReply ? '<span class="reply-badge">✓ 已回覆</span>' : '<span class="unreply-badge">⏳ 待回覆</span>'}
      </div>
      <div class="feedback-text">${escapeHtml(f.content || f.text || f.message || '')}</div>
      ${userAgent ? `<details class="ua-details"><summary class="small">▶ User Agent</summary><div class="small mono" style="margin-top:4px;color:#7a8898;">${escapeHtml(userAgent)}</div></details>` : ''}

      ${hasReply ? `
        <div class="reply-shown">
          <div class="reply-shown-header">
            💬 你的回覆 <span class="small">${replied || ''} ${f.repliedBy ? '· by ' + escapeHtml(f.repliedBy) : ''}</span>
          </div>
          <div class="reply-shown-text">${escapeHtml(f.reply)}</div>
        </div>
      ` : ''}

      <textarea class="reply-input" id="reply-${f.id}" placeholder="${hasReply ? '編輯回覆內容…' : '輸入回覆內容…'}" rows="3">${hasReply ? escapeHtml(f.reply) : ''}</textarea>

      <div class="feedback-actions">
        ${hasReply ? `<button class="btn-edit-reply" onclick="loadReplyDraft('${f.id}', ${JSON.stringify(f.reply || '').replace(/"/g, '&quot;')})">📝 編輯既有回覆</button>` : ''}
        <button class="btn-submit-reply" id="btn-reply-${f.id}" onclick="submitReply('${f.id}')">${hasReply ? '更新回覆' : '送出回覆'}</button>
        <button class="btn-delete-fb" onclick="deleteFeedback('${f.id}')">🗑️ 刪除</button>
      </div>
    </div>
  `;
}

window.loadReplyDraft = function(fbId, replyText) {
  const ta = document.getElementById('reply-' + fbId);
  if (ta) {
    ta.value = replyText;
    ta.focus();
  }
};

window.submitReply = async function(fbId) {
  const ta = document.getElementById('reply-' + fbId);
  if (!ta) return;
  const reply = ta.value.trim();
  if (!reply) { alert('回覆內容不能空白'); return; }
  const btn = document.getElementById('btn-reply-' + fbId);
  if (btn) { btn.disabled = true; btn.textContent = '送出中…'; }
  const res = await api('/api/admin/firebase/feedbacks/' + fbId + '/reply', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ reply }),
  });
  if (!res || res.error) {
    alert('送出失敗：' + (res?.error || 'unknown'));
    if (btn) { btn.disabled = false; btn.textContent = '送出回覆'; }
    return;
  }
  await loadFeedback(false);  // 重新拉資料更新顯示（保留當前頁）
};

window.deleteFeedback = async function(fbId) {
  if (!confirm('確定要刪除這筆意見回饋嗎？此動作無法復原。')) return;
  const res = await api('/api/admin/firebase/feedbacks/' + fbId, { method: 'DELETE' });
  if (!res || res.error) { alert('刪除失敗：' + (res?.error || 'unknown')); return; }
  await loadFeedback(false);
};

// ══════════════════════════════════════════════════════════════════════════════
// v0.80 Tab: Match Records (對戰歷史) — server v0.9 提供的 GET /api/admin/match-records
//   - 表格顯示：時間 / 房號 / 先攻(綠底=勝者) / 後攻(綠底=勝者) / 結束原因 / 回合 / 時長
//   - 點玩家名字 → modal 顯示這場用的牌組（lazy-load /cards/<set>.json 解析卡名）
//   - email filter（查特定玩家戰績）
//   - 分頁：50 筆 / 頁，按「載入更多」append
// ══════════════════════════════════════════════════════════════════════════════
let matchRecordsCache = [];
let matchRecordsTotal = 0;
let matchRecordsFilter = '';
let matchRecordsSearch = '';  // v1.23：全站搜尋字串（房號/玩家名/email/牌組）
let matchRecordsModeFilter = 'all';  // v0.82: 'all' | 'online' | 'local'（線上=有 roomCode，本機=無）
let matchRecordsLoading = false;
// v0.91: 真正翻頁取代「載入更多」append 模式
const MATCH_PAGE_SIZE = 50;
let matchRecordsPage = 0;  // 0-indexed; UI 顯示為「第 N+1 頁」
// v0.81: 不再用獨立 cardByIdPool — 共用既有的 cardInfoMap / ensureCardIndex (line 413)

async function loadMatchRecords(reset = false) {
  const el = document.getElementById('tab-matches');
  if (matchRecordsLoading) return;
  matchRecordsLoading = true;
  try {
    if (reset) {
      matchRecordsPage = 0;
      matchRecordsCache = [];
      matchRecordsTotal = 0;
    }
    if (matchRecordsCache.length === 0) {
      el.innerHTML = '<h2>📜 對戰歷史</h2><div class="empty">Loading…</div>';
    }
    // v0.91: 真正翻頁 — skip = page × 50 (取代 cache.length append)
    const params = new URLSearchParams({
      limit: String(MATCH_PAGE_SIZE),
      skip: String(matchRecordsPage * MATCH_PAGE_SIZE),
    });
    // v1.23：全站搜尋 — q（房號/玩家名/email 模糊）+ cardIds（牌組含此卡，client 解析寶可夢名）。
    if (matchRecordsSearch) {
      await ensureCardIndex(); await ensureCardTags();  // 牌組搜尋需卡片索引把名稱解析成 cardIds
      params.set('q', matchRecordsSearch);
      const ids = resolvePokemonCardIds(matchRecordsSearch);
      if (ids.length) params.set('cardIds', ids.join(','));
    }
    if (matchRecordsModeFilter === 'online' || matchRecordsModeFilter === 'local') {
      params.set('mode', matchRecordsModeFilter);
    }
    const data = await api('/api/admin/match-records?' + params.toString());
    if (!data || data.error) {
      el.innerHTML = '<h2>📜 對戰歷史</h2><div class="empty">Error: ' + (data?.error || 'unknown') + '</div>';
      return;
    }
    // v0.91: 直接 replace cache (不 concat) — 一頁 50 筆顯示
    matchRecordsCache = data.records || [];
    matchRecordsTotal = data.total ?? matchRecordsCache.length;
    renderMatchRecords(el);
    // v1.23：首次未載卡片索引時背景載入 → 補 ⚔️ 主力 badge（不擋初始 render）。
    if (!Object.keys(cardInfoMap).length) {
      Promise.all([ensureCardIndex(), ensureCardTags()]).then(() => {
        if (currentTab === 'matches') renderMatchRecords(el);
      });
    }
  } finally {
    matchRecordsLoading = false;
  }
}

// v0.91: 翻頁 helpers
window.gotoMatchPage = function(page) {
  const totalPages = Math.max(1, Math.ceil((matchRecordsTotal || 0) / MATCH_PAGE_SIZE));
  const p = Math.max(0, Math.min(totalPages - 1, page | 0));
  if (p === matchRecordsPage) return;
  matchRecordsPage = p;
  loadMatchRecords(false);
};
window.jumpMatchPage = function(inputEl) {
  const val = parseInt(inputEl?.value ?? '1', 10);
  if (!Number.isFinite(val)) return;
  // 使用者輸入 1-indexed → 內部 0-indexed
  window.gotoMatchPage(val - 1);
};

window.filterMatchRecordsByEmail = function(v) {
  matchRecordsFilter = (v || '').trim();
  matchRecordsCache = [];
  loadMatchRecords(true);
};

// v0.82：mode filter 切換（全部 / 線上 / 本機）
window.setMatchRecordsModeFilter = function(m) {
  if (m !== 'all' && m !== 'online' && m !== 'local') return;
  matchRecordsModeFilter = m;
  matchRecordsCache = [];
  loadMatchRecords(true);
};

// v0.82：刪除單筆對戰紀錄（測試資料清理用）
window.deleteMatchRecord = async function(matchId) {
  if (!matchId) return;
  if (!confirm('確定要刪除這筆對戰紀錄嗎？此動作無法復原。\n\nmatchId: ' + matchId)) return;
  try {
    const res = await api('/api/admin/match-records/' + encodeURIComponent(matchId), { method: 'DELETE' });
    if (!res || res.error) { alert('刪除失敗：' + (res?.error || 'unknown')); return; }
    // 從 cache 移除這筆 → 重新 render（不重打 API）
    const before = matchRecordsCache.length;
    matchRecordsCache = matchRecordsCache.filter(r => r._id !== matchId);
    matchRecordsTotal = Math.max(0, matchRecordsTotal - (before - matchRecordsCache.length));
    renderMatchRecords(document.getElementById('tab-matches'));
  } catch (err) {
    alert('刪除失敗：' + (err?.message || 'unknown'));
  }
};

function fmtMatchTime(ms) {
  if (!ms) return '-';
  const d = new Date(ms);
  return d.toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
}

function fmtMatchDuration(ms) {
  if (!ms || ms < 0) return '-';
  const sec = Math.floor(ms / 1000);
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + ':' + (s < 10 ? '0' + s : s);
}

// v0.91: 翻頁 UI helper
function renderMatchPagination() {
  const total = matchRecordsTotal || 0;
  const pageSize = MATCH_PAGE_SIZE;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  const curPage = matchRecordsPage;
  const curPage1 = curPage + 1;  // 顯示用 1-indexed
  const startN = total === 0 ? 0 : curPage * pageSize + 1;
  const endN = Math.min((curPage + 1) * pageSize, total);

  // 算要顯示哪些頁碼按鈕 (限制 7 個避免太長): 第 1 / 上 N / 當前 / 下 N / 最後
  const pageBtns = [];
  const addBtn = (p, label = null) => {
    const active = p === curPage;
    pageBtns.push(
      '<button onclick="gotoMatchPage(' + p + ')"' +
      (active ? ' style="background:#5b8def;color:#fff;border-color:#5b8def;"' : ' class="ghost"') +
      '>' + (label || (p + 1)) + '</button>'
    );
  };
  const addEllipsis = () => pageBtns.push('<span style="padding:0 4px;color:#7a8898;">…</span>');

  if (totalPages <= 7) {
    for (let i = 0; i < totalPages; i++) addBtn(i);
  } else {
    addBtn(0);
    if (curPage > 3) addEllipsis();
    const from = Math.max(1, curPage - 2);
    const to = Math.min(totalPages - 2, curPage + 2);
    for (let i = from; i <= to; i++) addBtn(i);
    if (curPage < totalPages - 4) addEllipsis();
    addBtn(totalPages - 1);
  }

  const prevDisabled = curPage === 0 ? 'disabled' : '';
  const nextDisabled = curPage >= totalPages - 1 ? 'disabled' : '';

  return `
    <div style="font-size:0.85rem; color:#9aaaaa; margin-right:10px;">
      第 ${startN}–${endN} 筆 / 共 ${total} 筆 (第 ${curPage1} / ${totalPages} 頁)
    </div>
    <button class="ghost" ${prevDisabled} onclick="gotoMatchPage(${curPage - 1})">‹ 上一頁</button>
    ${pageBtns.join('')}
    <button class="ghost" ${nextDisabled} onclick="gotoMatchPage(${curPage + 1})">下一頁 ›</button>
    <span style="margin-left:10px; font-size:0.85rem;">跳至：</span>
    <input type="number" min="1" max="${totalPages}" value="${curPage1}"
      style="width:60px; padding:4px; background:#ffffff; color:#1a2332; border:1px solid #d6dbe3; border-radius:4px;"
      onkeydown="if(event.key==='Enter')jumpMatchPage(this)" />
    <button onclick="jumpMatchPage(this.previousElementSibling)">跳頁</button>
  `;
}

// v1.22：matchRecord 的 cardCounts({id→count}) → entries 餵 detectMainPokemon 判主力牌組
function detectMainFromCardCounts(cc) {
  if (!cc || typeof cc !== 'object' || Array.isArray(cc)) return '';
  const entries = Object.keys(cc).map(cardId => ({ cardId, count: cc[cardId] }));
  return detectMainPokemon({ deckEntries: entries });
}
// v1.22：抽出單列渲染（搜尋過濾要重用）+ 玩家名下標示 ⚔️ 主力牌組
function renderMatchRow(r) {
  const p1Win = r.winner === 0;
  const p2Win = r.winner === 1;
  const p1Cls = p1Win ? 'winner-cell' : '';
  const p2Cls = p2Win ? 'winner-cell' : '';
  const p1Email = r.p1?.email ? playerLink(r.p1.email) : '<span style="color:#bbb;">匿名</span>';
  const p2Email = r.p2?.email ? playerLink(r.p2.email) : '<span style="color:#bbb;">匿名</span>';
  const mid = escapeHtml(r._id || '');
  const isOnline = !!r.roomCode;
  const modeBadge = isOnline
    ? '<span class="mode-badge mode-online" title="線上對戰">🌐</span>'
    : '<span class="mode-badge mode-local" title="本機雙人對戰">🏠</span>';
  const _mainBadge = (m) => m ? `<div class="small" style="color:#d98c3f;font-size:10px;font-weight:600">⚔️ ${escapeHtml(m)}</div>` : '';
  const p1MainBadge = _mainBadge(detectMainFromCardCounts(r.p1?.cardCounts));
  const p2MainBadge = _mainBadge(detectMainFromCardCounts(r.p2?.cardCounts));
  return `<tr>
    <td>${fmtMatchTime(r.endedAt)}</td>
    <td>${modeBadge} <code>${escapeHtml(r.roomCode || '本機')}</code></td>
    <td class="${p1Cls}">
      <span class="player-name" onclick="showMatchDeck('${mid}')">${escapeHtml(r.p1?.name || '先攻')}</span>
      <span class="player-email">${p1Email}</span>${p1MainBadge}
    </td>
    <td class="${p2Cls}">
      <span class="player-name" onclick="showMatchDeck('${mid}')">${escapeHtml(r.p2?.name || '後攻')}</span>
      <span class="player-email">${p2Email}</span>${p2MainBadge}
    </td>
    <td>${escapeHtml(r.winReason || '-')}</td>
    <td>${r.finalTurn ?? '-'}</td>
    <td>${fmtMatchDuration(r.durationMs)}</td>
    <td><button class="tiny danger" onclick="deleteMatchRecord('${mid}')" title="刪除此筆紀錄（測試資料清理用）">🗑</button></td>
  </tr>`;
}
// v1.23：把搜尋字串裡的寶可夢名解析成 cardId 清單（牌組搜尋用，送給 server 比對 cardCounts）。
//   只取「非支援型」寶可夢（同主力打手判定）；名稱子字串模糊比對。
function resolvePokemonCardIds(q) {
  const lc = (q || '').toLowerCase().trim();
  if (!lc) return [];
  const ids = [];
  for (const id in cardInfoMap) {
    const info = cardInfoMap[id];
    if (!info || info.supertype !== 'Pokemon') continue;
    if ((cardTagsCache[id] || []).includes('support')) continue;
    const nm = (info.displayName || info.name || '').toLowerCase();
    if (nm.includes(lc)) { ids.push(id); if (ids.length >= 300) break; }
  }
  return ids;
}
// v1.23：全站搜尋（取代 v1.22 本頁 client 過濾）— 設搜尋字串 → 重新從 server 抓第 1 頁（含分頁、全站範圍）。

  matchRecordsSearch = (q || '').trim();
  matchRecordsCache = [];

    <div class="small" style="margin: 4px 0 12px; color: #7a8898;">點玩家名字 → 看這場用的牌組（勝者綠底）· 🗑 刪除測試紀錄</div>
    ${records.length === 0 ? '<div class="empty">尚無對戰紀錄（符合目前 filter 條件）</div>' : `
      <div class="table-wrap"><table>
        <thead><tr>
          <th>結束時間</th>
          <th>模式 / 房號</th>
          <th>先攻 (email)</th>
          <th>後攻 (email)</th>
          <th>結束原因</th>
          <th>回合數</th>
          <th>對戰時長</th>
          <th>操作</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <div class="toolbar" style="margin-top:16px; justify-content:center; gap: 6px; flex-wrap: wrap;">
        ${renderMatchPagination()}
      </div>
    `}
  `;
}

// v0.81：showMatchDeck 重設計 — 仿 Oracle 對戰 deck modal 格式
//   - 兩欄並排：先攻 / 後攻
//   - 使用既有 ensureCardIndex / cardLabel infrastructure（保持風格一致）
//   - 讀 cardCounts (v5.006+ 新格式 Record<id,count>) 或 cardIds (v5.005 舊格式 fallback 視為 ×1)
//   - 「📋 複製全部牌組」按鈕 — 把兩邊牌組文字格式 copy to clipboard
window.showMatchDeck = async function(matchId) {
  // v0.99: push 當前 modal 到 stack (若有), 關閉時 popModal 回上層
  const _curForStack = document.getElementById('modal-container').innerHTML;
  if (_curForStack && _curForStack.trim()) window._modalStack.push(_curForStack);
  // v0.95: 支援多來源 — matchRecordsCache (對戰歷史 tab) 或 _playerMatchesById (玩家 modal 點房號)
  let record = matchRecordsCache.find(r => r._id === matchId);
  if (!record && window._playerMatchesById) {
    record = window._playerMatchesById[matchId];
  }
  if (!record) { alert('找不到該場紀錄'); return; }
  // 先彈窗顯示 loading
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)popModal()">
      <div class="modal" style="min-width:520px;"><h3>🃏 對戰牌組</h3><div class="empty">載入卡牌資料中…</div></div>
    </div>`;
  await ensureCardIndex();

  // 從 record.p1/p2 抽出 entries: [{ cardId, count }]，按 count 降序、name asc 排序
  const buildEntries = (player) => {
    if (!player) return [];
    let raw = {};
    if (player.cardCounts && typeof player.cardCounts === 'object' && !Array.isArray(player.cardCounts)) {
      raw = player.cardCounts;
    } else if (Array.isArray(player.cardIds)) {
      // 舊格式 fallback：每張卡視為 1
      for (const id of player.cardIds) raw[String(id)] = 1;
    }
    const entries = Object.entries(raw).map(([cardId, count]) => ({ cardId: String(cardId), count: Number(count) || 0 }));
    // 排序：count 多 → 少，同 count 用 cardLabel 字母排
    entries.sort((a, b) => {
      if (b.count !== a.count) return b.count - a.count;
      const la = cardLabel(a.cardId, 1).toLowerCase();
      const lb = cardLabel(b.cardId, 1).toLowerCase();
      return la.localeCompare(lb, 'zh-Hant');
    });
    return entries;
  };

  const e1 = buildEntries(record.p1);
  const e2 = buildEntries(record.p2);

  // 文字格式（給 copy 用）— 仿 Oracle 對戰 modal 看到的列表格式
  const formatSide = (label, player, entries) => {
    const total = entries.reduce((s, e) => s + e.count, 0);
    const lines = [`${label} — ${player?.name || '?'}`, `共 ${total} 張 / 種類 ${entries.length}`];
    for (const e of entries) lines.push(cardLabel(e.cardId, e.count));
    return lines.join('\n');
  };
  const copyText = formatSide('先攻', record.p1, e1) + '\n\n' + formatSide('後攻', record.p2, e2);
  // 存在 dataset 給複製按鈕用（avoid escape hell）
  window._lastMatchCopyText = copyText;

  // 渲染單側 HTML
  const renderSide = (label, player, entries, win) => {
    const total = entries.reduce((s, e) => s + e.count, 0);
    const emailLine = player?.email ? `<span class="player-email">(${playerLink(player.email)})</span>` : '<span class="player-email">(匿名)</span>';
    const winBadge = win ? '<span style="background:#4caf50;color:white;padding:2px 8px;border-radius:4px;font-size:12px;margin-left:6px;">勝</span>' : '';
    if (!entries.length) return `
      <div class="deck-col${win ? ' winner-side' : ''}">
        <h4>${label} — ${escapeHtml(player?.name || '?')} ${emailLine}${winBadge}</h4>
        <div class="empty">無牌組資料</div>
      </div>`;
    return `
      <div class="deck-col${win ? ' winner-side' : ''}">
        <h4>${label} — ${escapeHtml(player.name)} ${emailLine}${winBadge}</h4>
        <div class="small" style="margin-bottom:6px;">共 ${total} 張 / 種類 ${entries.length}</div>
        ${entries.map(e => `<div class="deck-entry">${escapeHtml(cardLabel(e.cardId, e.count))}</div>`).join('')}
      </div>`;
  };

  const p1Win = record.winner === 0;
  const p2Win = record.winner === 1;

  document.getElementById('modal-container').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)popModal()">
      <div class="modal" style="min-width:720px;">
        <h3>🃏 房間 ${escapeHtml(record.roomCode || '-')} 的牌組</h3>
        <div class="deck-grid">
          ${renderSide('先攻', record.p1, e1, p1Win)}
          ${renderSide('後攻', record.p2, e2, p2Win)}
        </div>
        <div style="margin-top:16px; display:flex; justify-content:space-between; align-items:center;">
          <button onclick="copyMatchDeck()">📋 複製全部牌組（文字）</button>
          <button onclick="popModal()">關閉</button>
        </div>
      </div>
    </div>`;
};

// 複製對戰牌組到 clipboard
window.copyMatchDeck = async function() {
  const text = window._lastMatchCopyText || '';
  if (!text) { alert('沒有可複製的內容'); return; }
  try {
    await navigator.clipboard.writeText(text);
    // 簡單的視覺回饋：找到剛按的按鈕暫時改文字
    const btns = document.querySelectorAll('.modal button');
    for (const b of btns) {
      if (b.textContent.includes('複製')) {
        const original = b.textContent;
        b.textContent = '✓ 已複製到剪貼簿';
        setTimeout(() => { b.textContent = original; }, 1500);
        break;
      }
    }
  } catch (err) {
    // fallback: 用舊版 execCommand
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      alert('已複製到剪貼簿（fallback 模式）');
    } catch (e2) {
      alert('複製失敗：' + (err.message || e2.message));
    }
  }
};

let statsOverviewCache = null;

let cardTagsCache = {};         // { cardId: ['support', ...] }
// ── v1.19 還原：對戰列表「主力打手偵測」（v1.17 曾有、被後續 clone-based admin 改動覆蓋掉）──
//   cardTagsCache 原僅統計頁 loadStats 載；對戰分頁也要用 → 抽 ensureCardTags（promise guard 只抓一次）。
let _cardTagsPromise = null;
async function ensureCardTags() {
  if (_cardTagsPromise) return _cardTagsPromise;
  _cardTagsPromise = (async () => {
    try {
      const tags = await api('/api/admin/cards/tags');
      if (tags && !tags.error) cardTagsCache = tags.tags || {};
    } catch (e) { console.warn('[admin] ensureCardTags failed:', e.message); }
  })();
  return _cardTagsPromise;
}
// 從玩家牌組（deckEntries）推測「主力打手寶可夢」，剔除功能牌（訓練家/能量 + 手動標『支援型』的寶可夢）。
//   評分：規則卡(ex)+1000 / 進化階級×100(Stage2=2,Stage1=1,Basic=0) / 張數×10 → 取最高。
//   需 cardInfoMap(ensureCardIndex) + cardTagsCache(ensureCardTags) 先載好。
function detectMainPokemon(seat) {
  const entries = seat?.deckEntries || [];
  if (!entries.length) return '';
  let bestName = '', bestScore = -1;
  for (const e of entries) {
    const info = cardInfoMap[e.cardId];
    if (!info || info.supertype !== 'Pokemon') continue;
    if ((cardTagsCache[e.cardId] || []).includes('support')) continue; // 排除手動標『支援型』的寶可夢
    const isRuleBox = info.subtype === 'ex';
    const stageRank = info.subtype === 'Stage2' ? 2 : (info.subtype === 'Stage1' ? 1 : 0);
    const score = (isRuleBox ? 1000 : 0) + stageRank * 100 + (e.count || 0) * 10;
    if (score > bestScore) { bestScore = score; bestName = info.displayName || info.name; }
  }
  return bestName;
}
let statsLoading = false;

// v0.84 Phase 2b caches

let statsWinrateCache = null;
let statsHeatmapCache = null;
let statsTrendsCache = null;
let trendsGranularity = 'day';  // 'day' | 'week' | 'month'
let trendsDays = 30;            // 30 | 90 | 365
let winrateFilterMode = 'main';  // v1.07 預設主力打手（'all' | 'main' | 'support'）
let winrateRange = 'all';       // v1.11: 'all' | '7d' | '24h' — 2.3 時間範圍（避免新卡包後看到舊統計）

async function loadStats(reset = false) {
  if (statsLoading) return;
  statsLoading = true;
  try {
    const el = document.getElementById('tab-stats');
    if (statsOverviewCache && statsCardsCache && !reset) {
      renderStats(el);
      return;
    }
    el.innerHTML = '<h2>📊 統計</h2><div class="empty">Loading… (aggregate matchRecords + 載入卡牌資料，約 5-15 秒)</div>';
    await ensureCardIndex();
    // v0.83 全局 mode filter — 傳給 server，過濾本機測試資料
    const modeQ = (statsMode !== 'all') ? '?mode=' + statsMode : '';
    const cardsQ = (statsMode !== 'all') ? '?mode=' + statsMode + '&limit=500' : '?limit=500';
    // v0.84 Phase 2b 額外 endpoints
    //   players: 排除 AI（玩家排行不算 AI 對手）
    //   winrate: 預設排除 AI（excludeAI=true）
    const playersQ = modeQ + (modeQ ? '&' : '?') + 'excludeAI=true';
    const _wrSince = winrateRange === '24h' ? (Date.now()-86400000) : (winrateRange === '7d' ? (Date.now()-7*86400000) : 0);  // v1.11
    const winrateQ = modeQ + (modeQ ? '&' : '?') + 'minDecks=5' + (_wrSince ? '&since=' + _wrSince : '');
    const trendsQ = modeQ + (modeQ ? '&' : '?') + 'days=' + trendsDays + '&granularity=' + trendsGranularity;
    const [overview, cards, tags, players, winrate, heatmap, trends] = await Promise.all([
      api('/api/admin/stats/overview' + modeQ),
      api('/api/admin/stats/cards' + cardsQ),
      api('/api/admin/cards/tags'),
      api('/api/admin/stats/players' + playersQ),
      api('/api/admin/stats/cards/winrate' + winrateQ),
      api('/api/admin/stats/heatmap' + modeQ),
      api('/api/admin/stats/trends' + trendsQ),
    ]);
    if (overview?.error) { el.innerHTML = '<h2>📊 統計</h2><div class="empty">Error overview: ' + overview.error + '</div>'; return; }
    if (cards?.error) { el.innerHTML = '<h2>📊 統計</h2><div class="empty">Error cards: ' + cards.error + '</div>'; return; }
    if (tags?.error) console.warn('cardTags load failed:', tags.error);
    if (players?.error) console.warn('players load failed:', players.error);
    if (winrate?.error) console.warn('winrate load failed:', winrate.error);
    if (heatmap?.error) console.warn('heatmap load failed:', heatmap.error);
    if (trends?.error) console.warn('trends load failed:', trends.error);
    statsOverviewCache = overview;
    statsCardsCache = cards;
    cardTagsCache = (tags?.tags) || {};
    statsPlayersCache = players;
    statsWinrateCache = winrate;
    statsHeatmapCache = heatmap;
    statsTrendsCache = trends;
    renderStats(el);
  } finally {
    statsLoading = false;
  }
}

// 1.1 對戰總覽 — 全部模式才顯示 線上/本機 breakdown；filter 時只顯示 vsAI 比例
function renderStatsOverview(s) {
  const t = s.total || {};
  const total = t.all || 0;
  // v1.07：近 24h vs 前 24h（24–48h 前）成長率 — 成長紅、衰退綠
  const cur24 = s.new24h || 0;

  } else if (cur24 > 0) {
    growthHtml = `<div class="small muted" style="font-size:12px; margin-top:3px;">前 24h 無對戰可比較</div>`;

// 1.2 先攻 vs 後攻勝率（三組 filter）
function renderFirstMover(s) {
  const fm = s.firstMover || {};

// 1.3 對戰時長 / 回合數
function renderDurationTurns(s) {
  const fmtMs = (ms) => { if (!ms) return '-'; const sec = Math.floor(ms / 1000); const m = Math.floor(sec / 60); const ss = sec % 60; return m + ':' + (ss < 10 ? '0' + ss : ss); };
  const d = s.duration || {};
  const t = s.turns || {};
  const dh = d.histogram || [];
  const dhMax = Math.max(1, ...dh.map(x => x.count));
  const dhLabels = { 0: '0-5 分', 300000: '5-10 分', 600000: '10-15 分', 900000: '15-20 分', 1200000: '20-25 分', 1500000: '25-30 分', 1800000: '30-40 分', 2400000: '40-50 分', 3000000: '50-60 分' };
  const td = t.distribution || [];
  const tdMax = Math.max(1, ...td.map(x => x.count));
  return `
    <section class="stats-section">
      <h3>⏱ 1.3 對戰時長 / 回合數</h3>
      <div class="stats-row">
        <div class="stats-box">
          <div class="stats-box-title">對戰時長（平均 ${fmtMs(d.avgMs)} / ${d.sampleCount || 0} 場）</div>
          ${dh.map(bin => {

// 1.4 勝因分佈
// v0.93: 勝因 normalize — 拿掉玩家名, 統一分類
//   原 winReason 含玩家名稱 (e.g. 「Wilson 取得所有獎勵牌」/「火箭隊的奇樹 沒有可上場的寶可夢」)
//   normalize 後: 「取得所有獎勵牌」/「對手沒有可上場的寶可夢」/「對手抽乾牌庫」 等通用分類
function normalizeWinReason(raw, firstTurn) {
  if (!raw) return '(空)';
  const s = String(raw).trim();
  if (/取得所有獎(賞|勵)(卡|牌)/.test(s)) return '🏆 取得所有獎賞卡';  // v1.25: 正名為官方用詞「獎賞卡」；regex 仍同時抓新舊詞合併
  if (/沒有可上場的寶可夢|沒有寶可夢可上場/.test(s)) return '🚫 對手沒有可上場的寶可夢';
  if (/抽乾牌庫|抽不到牌|牌庫空了/.test(s)) return '🃏 對手抽乾牌庫';
  if (/勝利象徵|特殊勝利條件/.test(s)) return '⭐ 特殊勝利條件 (勝利象徵)';
  if (/投降|認輸/.test(s)) return '🏳️ 對手投降';
  if (/超時|逾時|逾過/.test(s)) return '⏰ 對手超時';
  // v1.25: 離開類再依回合細分 — 第一回合(含開局設置)離開多為開房者掛機；其他回合離開多為中途認輸放棄
  if (/中途離開|離開房間|斷線|斷開|退出|不在場|disconnect|技不如人|先行離開/i.test(s)) return firstTurn ? '👋 玩家於第一回合離開' : '👋 玩家中途離開';  // v1.43 合併現行措辭「對手承認技不如人，先行離開了」(舊措辭=中途離開,同一事件)
  return '其他：' + s.slice(0, 30);
}
function renderWinReasons(s) {
  const wrRaw = s.winReasons || [];
  // v0.93: 先 normalize 再二次 group (同 normalized 分類合併)
  const merged = new Map();
  for (const x of wrRaw) {
    const k = normalizeWinReason(x.reason, x.firstTurn);  // v1.25: 傳入 firstTurn 細分離開類
    merged.set(k, (merged.get(k) || 0) + x.count);
  }
  const wr = [...merged.entries()].map(([reason, count]) => ({ reason, count })).sort((a,b)=>b.count-a.count);
  const total = wr.reduce((sum, x) => sum + x.count, 0);
  if (total === 0) return '<section class="stats-section"><h3>🏁 1.4 勝因分佈</h3><div class="empty">無資料</div></section>';
  const maxCount = wr[0]?.count || 1;
  return `
    <section class="stats-section">
      <h3>🏁 1.4 勝因分佈 <span class="small muted">（共 ${total} 場；同類已合併）</span></h3>
      <div class="stats-box">
        ${wr.slice(0, 15).map(x => {
          const pct = (x.count / total * 100).toFixed(1);
          const barPct = Math.round(x.count / maxCount * 100);
          return `<div class="histo-row" style="grid-template-columns: 280px 1fr 140px;"><span class="histo-lbl">${escapeHtml(x.reason)}</span><div class="histo-bar" style="width:${barPct}%"></div><span class="histo-cnt">${x.count} (${pct}%)</span></div>`;
        }).join('')}
      </div>
    </section>
  `;
}

// v0.83 將 server 回的 raw cardId stats 依 canonicalKey 合併（同名同效不同版本算同一張）
//   注意：deckCount 是各 cardId 的簡單加總，若同副牌組同時收錄兩種版本會 double-count，
//   但實務上極罕見，先接受這個誤差。
function groupCardsByCanonical(cards) {
  const groups = new Map();
  for (const card of (cards || [])) {
    const info = cardInfoMap[card.cardId];
    if (!info?.canonicalKey) continue;
    const key = info.canonicalKey;
    if (!groups.has(key)) {
      groups.set(key, {
        canonicalKey: key,
        repInfo: info,
        repCardId: card.cardId,
        cardIds: [],
        totalCount: 0,
        deckCount: 0,
        variants: 0,
      });
    }
    const g = groups.get(key);
    g.cardIds.push(card.cardId);
    g.totalCount += card.totalCount;
    g.deckCount += card.deckCount;
    g.variants++;
    // 用 deckCount 最多的版本當代表（最常被牌組採用的版本）
    if (card.deckCount > (g.repDeckCount ?? -1)) {
      g.repInfo = info;
      g.repCardId = card.cardId;
      g.repDeckCount = card.deckCount;
    }
  }
  return [...groups.values()].sort((a, b) => b.totalCount - a.totalCount);
}

// 1.8 能量類型分佈
// v0.93: 基本能量 cardInfo.pokemonType 通常 undefined (game 端 ENERGY_TYPE_MAP 在 client),
//   admin 需用名稱對照. 修前只有特殊能量被歸類, 基本能量全 fallthrough → 顯示空.
const ENERGY_NAME_TO_TYPE = {
  '基本草能量': 'Grass', '基本火能量': 'Fire', '基本水能量': 'Water', '基本雷能量': 'Lightning',
  '基本超能量': 'Psychic', '基本鬥能量': 'Fighting', '基本惡能量': 'Darkness', '基本鋼能量': 'Metal',
  '基本【草】能量': 'Grass', '基本【火】能量': 'Fire', '基本【水】能量': 'Water', '基本【雷】能量': 'Lightning',
  '基本【超】能量': 'Psychic', '基本【鬥】能量': 'Fighting', '基本【惡】能量': 'Darkness', '基本【鋼】能量': 'Metal',
};
function renderEnergyDistribution(c) {
  const energy = (c.cards || []).filter(x => cardInfoMap[x.cardId]?.supertype === 'Energy');
  const basicByType = {};
  let specialTotal = 0, specialDecks = 0;
  for (const e of energy) {
    const info = cardInfoMap[e.cardId];
    if (!info) continue;
    // v0.93: subtype 'Basic' 直接歸基本; 用 pokemonType 或 ENERGY_NAME_TO_TYPE 推 type
    const isBasic = info.subtype === 'Basic';
    const energyType = info.pokemonType || ENERGY_NAME_TO_TYPE[info.name];
    if (isBasic && energyType) {
      if (!basicByType[energyType]) basicByType[energyType] = { totalCount: 0, deckCount: 0 };
      basicByType[energyType].totalCount += e.totalCount;
      basicByType[energyType].deckCount += e.deckCount;
    } else if (info.subtype === 'Special' || info.subtype === 'Special Energy') {
      specialTotal += e.totalCount; specialDecks += e.deckCount;
    } else if (energyType) {
      // 非 Basic / Special 但有 pokemonType → 也歸對應屬性 (寶石能量類型 fallback)
      if (!basicByType[energyType]) basicByType[energyType] = { totalCount: 0, deckCount: 0 };
      basicByType[energyType].totalCount += e.totalCount;
      basicByType[energyType].deckCount += e.deckCount;
    } else {
      // 完全無 type → 歸特殊
      specialTotal += e.totalCount; specialDecks += e.deckCount;
    }
  }
  const TYPE_LABELS = { Grass: '🌿 草', Fire: '🔥 火', Water: '💧 水', Lightning: '⚡ 雷', Psychic: '👻 超', Fighting: '✊ 鬥', Darkness: '🌑 惡', Metal: '⚙️ 鋼', Dragon: '🐲 龍', Fairy: '🧚 妖', Colorless: '⭐ 無' };
  const entries = Object.entries(basicByType).sort((a, b) => b[1].totalCount - a[1].totalCount);
  const maxCount = Math.max(1, ...entries.map(([, v]) => v.totalCount), specialTotal);
  return `
    <section class="stats-section">
      <h3>⚡ 1.8 能量類型分佈</h3>
      <div class="stats-box">
        ${entries.length === 0 && specialTotal === 0 ? '<div class="empty">無能量卡資料</div>' : entries.map(([type, v]) => {
          const pct = Math.round(v.totalCount / maxCount * 100);
          const label = TYPE_LABELS[type] || type;
          return `<div class="histo-row"><span class="histo-lbl">${label}</span><div class="histo-bar" style="width:${pct}%"></div><span class="histo-cnt">${v.totalCount} 張 / ${v.deckCount} 副</span></div>`;
        }).join('')}
        ${specialTotal > 0 ? `<div class="histo-row"><span class="histo-lbl">🌈 特殊能量</span><div class="histo-bar special" style="width:${Math.round(specialTotal/maxCount*100)}%"></div><span class="histo-cnt">${specialTotal} 張 / ${specialDecks} 副</span></div>` : ''}
      </div>
    </section>
  `;
}

//   - server 端用 email || name 為複合 key 分組
//   - 多數匿名玩家無 email，仍能依 name 出現在排行（接受不同人同名會合併的次要瑕疵）
function renderPlayerRanking(p) {
  if (!p) return '<section class="stats-section"><h3>👤 2.1 玩家排行榜</h3><div class="empty">無資料</div></section>';
  const players = p.players || [];
  // v1.42 中離率（排序+顯示用）：midLeaves / 總場次
  players.forEach(x => { x.midLeaves = x.midLeaves || 0; x.midLeaveRate = (x.matches > 0) ? (x.midLeaves / x.matches) : null; });
  const debug = p.debug || {};
  if (!players.length) {
    const db = debug.dataBreakdown || {};
    const q = debug.query || {};
    const sample = debug.sampleAfterBaseMatch;
    return `<section class="stats-section"><h3>👤 2.1 玩家排行榜</h3>
      <div class="empty" style="text-align:left;">
        無玩家對戰資料
        <div class="small" style="margin-top:12px; color:#555;">
          <b>📊 資料庫實際內容（v0.87 完整 diagnostic）</b><br>
          當前查詢：<code>mode=${q.mode || '?'} excludeAI=${q.excludeAI ?? '?'}</code><br>
          <br>
          <b>整體 matchRecords：</b> ${db.totalRecords ?? '?'} 筆<br>
          ├─ 線上對戰（roomCode 有值）：${db.onlineRecords ?? '?'} 筆<br>
          ├─ 本機（roomCode = null）：${db.localRecords ?? '?'} 筆<br>
          ├─ vs AI 場：${db.vsAIRecords ?? '?'} 筆<br>
          └─ 非 AI 場：${db.nonAIRecords ?? '?'} 筆<br>
          <br>
          <b>經過當前 filter 後：</b> ${db.afterBaseMatchFilter ?? '?'} 筆<br>
          ├─ asP1 (有 p1.name)：${debug.asP1Count ?? '?'}<br>
          ├─ asP2 (有 p2.name)：${debug.asP2Count ?? '?'}<br>
          ├─ 合併後：${debug.mergedCount ?? '?'} 位玩家<br>
          └─ 含 email：${debug.withEmail ?? '?'} 位<br>
          <br>
          ${sample ? `<b>最新 1 筆 sample：</b><br><code style="font-size:11px; display:block; padding:6px; background:#f5f5f5; border-radius:4px; margin-top:4px; word-break:break-all;">${escapeHtml(JSON.stringify(sample))}</code>` : '<b>樣本：</b>無'}
          <br><br>
          <b>解讀：</b> 若 afterBaseMatchFilter > 0 但 asP1+asP2 = 0，則 p1.name / p2.name 都是空 — 需要查 matchRecord 寫入端。
          若 afterBaseMatchFilter = 0，則當前 mode/excludeAI 過濾掉全部 — 試著切換上方的「全部資料」/「線上對戰」/「本機」按鈕。
        </div>
      </div>
    </section>`;
  }
  // v1.60 排序/搜尋/分頁全交給中央 tv 管線（原本只顯示前 50 名、沒有翻頁，
  //   而且搜尋與排序各走一套；現在統一成 filter → sort → slice 一條管線）。
  _playerRows = players;
  const withEmailCount = players.filter(x => x.email).length;
  return `
    <section class="stats-section">
      <h3>👤 2.1 玩家排行榜 <span class="small muted">（共 ${players.length} 位玩家；已排除 AI；含 email ${withEmailCount} 位 / 匿名 ${players.length - withEmailCount} 位；點玩家名看個人戰績）</span></h3>

}

// v1.01：2.3 即時搜尋 + 點卡看代表牌組
let winrateSearch = '';
let _winrateGroups = [];
let winratePage = 0;
const WINRATE_PAGE_SIZE = 50;
function winrateFilteredList() {
  const q = (winrateSearch || '').trim().toLowerCase();
  let list = _winrateGroups;
  if (q) list = list.filter(g => (((g.repInfo && (g.repInfo.displayName || g.repInfo.name)) || '').toLowerCase().includes(q)));
  return list;
}
function winratePagerHtml() {
  const total = winrateFilteredList().length;
  const maxPage = Math.max(0, Math.ceil(total / WINRATE_PAGE_SIZE) - 1);
  if (winratePage > maxPage) winratePage = maxPage;
  const from = total === 0 ? 0 : winratePage * WINRATE_PAGE_SIZE + 1;
  const to = Math.min(total, (winratePage + 1) * WINRATE_PAGE_SIZE);
  return `<div style="display:flex; gap:10px; align-items:center; justify-content:center; margin-top:10px;"><button ${winratePage <= 0 ? 'disabled' : ''} onclick="winrateSetPage(-1)">◀ 上一頁</button><span class="small muted">${from}–${to} / 共 ${total} 張（第 ${winratePage + 1} / ${maxPage + 1} 頁）</span><button ${winratePage >= maxPage ? 'disabled' : ''} onclick="winrateSetPage(1)">下一頁 ▶</button></div>`;
}
window.winrateSetPage = function(delta) {
  winratePage += delta;
  const tb = document.getElementById('winrate-tbody'); if (tb) tb.innerHTML = winrateRowsHtml();
  const pg = document.getElementById('winrate-pager'); if (pg) pg.innerHTML = winratePagerHtml();
};
window.filterWinrate = function(q) {
  winrateSearch = q; winratePage = 0;
  const tb = document.getElementById('winrate-tbody'); if (tb) tb.innerHTML = winrateRowsHtml();
  const pg = document.getElementById('winrate-pager'); if (pg) pg.innerHTML = winratePagerHtml();
};
function winrateRowHtml(g, i) {
  const info = g.repInfo;
  if (!info) return '';
  // v1.11：標支援型按鈕（複用 1.6 同一套 toggleSupportTag / cardTagsCache）
  const isSupport = g.cardIds.some(id => (cardTagsCache[id] || []).includes('support'));
  const tagBtn = `<button class="tag-btn ${isSupport ? 'tagged' : ''}" onclick="event.stopPropagation(); toggleSupportTag('${escapeHtml(g.repCardId)}')" title="${isSupport ? '取消支援型' : '標為支援型'}">${isSupport ? '⭐ 支援型' : '☆ 標支援型'}</button>`;
  const verBadge = g.variants > 1 ? ` <span class="ver-multi" title="${g.cardIds.length} 種版本">${g.variants} 版本</span>` : '';
  const wrPct = (g.winRate * 100).toFixed(1);
  const wrColor = g.winRate > 0.55 ? '#2e7d32' : (g.winRate < 0.45 ? '#c62828' : '#1a2332');
  const ids = g.cardIds.join(',');
  return `<tr>
    <td>${i + 1}</td>
    <td><span style="color:#1565c0; cursor:pointer; text-decoration:underline dotted;" title="看含此卡的代表牌組" onclick="showCardArchetype('${ids}')">${escapeHtml(info.displayName || info.name)}</span>${verBadge} <span class="small muted">${info.setCode}·${info.collectorNumber}</span> ${tagBtn}</td>
    <td><span class="small muted">${info.supertype || ''}</span></td>
    <td>${g.totalDecksAgg}</td>
    <td>${g.winDecks}</td>
    <td style="color:${wrColor}; font-weight:600;">${wrPct}%</td>
  </tr>`;
}
function winrateRowsHtml() {
  const list = winrateFilteredList();
  const maxPage = Math.max(0, Math.ceil(list.length / WINRATE_PAGE_SIZE) - 1);
  if (winratePage > maxPage) winratePage = maxPage;
  if (winratePage < 0) winratePage = 0;
  const start = winratePage * WINRATE_PAGE_SIZE;
  const pageItems = list.slice(start, start + WINRATE_PAGE_SIZE);
  if (pageItems.length === 0) return '<tr><td colspan="6" class="empty" style="text-align:center; padding:18px;">查無符合卡牌</td></tr>';
  return pageItems.map((g, idx) => winrateRowHtml(g, start + idx)).join('');
}

// v1.01：點 2.3 卡牌 → 聚合「含該卡的牌組」算出代表性 60 張牌組
