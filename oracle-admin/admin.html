<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', -apple-system, sans-serif; background: #f5f7fa; color: #1a2332; margin: 0; padding: 0; }
  header { background: #ffffff; padding: 14px 24px; border-bottom: 2px solid #5b8def; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  header h1 { margin: 0; color: #5b8def; font-size: 18px; }

  button.danger:hover { background: #ef5350; }
  button.ghost { background: transparent; color: #5b8def; border: 1px solid #5b8def; }

  .tabs { display: flex; background: #ffffff; padding: 0 24px; border-bottom: 1px solid #c5cdd7; overflow-x: auto; }

  .tab.active { color: #5b8def; border-bottom-color: #5b8def; font-weight: 600; }
  .tab .badge { margin-left: 4px; background: #c5cdd7; padding: 2px 6px; border-radius: 8px; font-size: 10px; }
  /* v0.7：桌機版加寬到 1920px（原 1500px 留太多側白邊）；padding 也微調讓內容更貼近邊緣 */
  main { padding: 18px 28px; max-width: 1920px; margin: 0 auto; }
  h2 { color: #5b8def; margin: 0 0 16px; font-size: 17px; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .stat-card { background: #ffffff; border: 1px solid #e3e8ef; padding: 14px; border-radius: 6px; }
  .stat-label { color: #9aa3b0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 26px; font-weight: bold; color: #5b8def; margin-top: 2px; }
  .stat-card.firebase { border-color: #fb8c00; }
  .stat-card.firebase .stat-value { color: #fa6; }
  .stat-section-label { color: #9aa3b0; font-size: 11px; text-transform: uppercase; margin: 8px 0 4px; letter-spacing: 1px; }
  .sortable-th { cursor: pointer; user-select: none; }
.sortable-th:hover { background: rgba(0, 0, 0, 0.05); }
table { width: 100%; border-collapse: collapse; background: #ffffff; border-radius: 6px; overflow: hidden; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid #e3e8ef; font-size: 12px; vertical-align: middle; }
  th { background: #e3e8ef; color: #5b8def; font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; }
  tr:hover { background: #f1f3f7; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
  .pill.lobby { background: #e3f2fd; color: #6b87cf; }
  .pill.playing { background: #c8e6c9; color: #4caf50; }
  .pill.ended { background: #c5cdd7; color: #7a8898; }
  /* v0.3 status badge with icon + label */
  .status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .status-badge.status-playing { background: #c8e6c9; color: #4caf50; }
  .status-badge.status-lobby { background: #fff8e1; color: #fb6; }
  .status-badge.status-ended { background: #e3e8ef; color: #7a8898; }
  /* P1/P2 winner highlight */
  .winner-cell { color: #fa0; font-weight: bold; background: rgba(255, 170, 0, 0.08); }
  /* Deck / message buttons */
  .btn-deck { background: #2e7d32; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .btn-deck:hover { background: #43a047; }
  .btn-msg { background: #7c4dff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .btn-msg:hover { background: #9575cd; }
  .btn-msg.empty { background: #c5cdd7; color: #9aa3b0; }
  .btn-msg.empty:hover { background: #a3acb8; color: #7a8898; }
  .btn-msg.has-msg { background: #7c4dff; }
  .num-cell { text-align: center; }
  /* Chat modal */
  .chat-list { max-height: 60vh; overflow-y: auto; padding: 4px; }
  .chat-line { background: #eef1f5; padding: 10px 12px; margin: 6px 0; border-radius: 6px; border-left: 3px solid #7c4dff; }
  .chat-meta { font-size: 11px; color: #7a8898; margin-bottom: 4px; }
  .chat-text { font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
  /* v0.72：聊天紀錄按角色分色 — P1 藍 / P2 橙 / 觀戰 紫 */
  .chat-line.chat-p1 { background: #e3f2fd; border-left-color: #5b8def; }
  .chat-line.chat-p2 { background: #fff4e3; border-left-color: #fb8c00; }
  .chat-line.chat-spec { background: #f5e9ff; border-left-color: #9c70d8; }
  .chat-role-badge { display: inline-block; padding: 1px 7px; border-radius: 8px; font-size: 10px; font-weight: 600; margin-right: 6px; vertical-align: middle; }
  .chat-role-badge.role-p1 { background: #5b8def; color: white; }
  .chat-role-badge.role-p2 { background: #fb8c00; color: white; }
  .chat-role-badge.role-spec { background: #9c70d8; color: white; }
  /* v0.32: sortable column headers */
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { background: #d5dce5; }
  .sort-arrow { font-size: 10px; }
  .sort-arrow.inactive { color: #7a8898; }
  .sort-arrow.active { color: #5b8def; font-weight: bold; }
  .actions { display: flex; gap: 5px; }
  .small { font-size: 10px; color: #9aa3b0; }
  .mono { font-family: 'Cascadia Code', Consolas, monospace; }
  /* v0.7：桌機版加寬後，各欄位 max-width 也放大讓內容少被截斷（房間名 / 玩家名 / email 等） */
  .truncate { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* v0.31: td 內 wrapping div 才能真的截斷超長字串（單 td max-width 在 table-auto 下常被忽略） */
  .trunc-inner { display: inline-block; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
  .trunc-inner.wide { max-width: 320px; }
  /* v0.71/v0.73/v0.74：對戰房間表格 — 縮欄距、放大字體、固定欄位真正 shrink-to-fit。
     關鍵技巧：`width: 1%` + `nowrap` = 瀏覽器把欄寬縮到剛好容納內容（1% 太小被內容撐開到 min），
     剩餘空間全部分給沒設 width 的欄位（房間名稱 / P1 / P2）。
     v0.74：字體再放大到 17px、padding 拉到 14px vertical，每列 ~85px → 一頁約 8 列。 */
  .match-table th, .match-table td { padding: 14px 10px; font-size: 17px; white-space: nowrap; width: 1%; }
  .match-table th { font-size: 13px; padding: 12px 10px; }  /* 表頭略小但加粗，padding 略小於 td */
  /* 房間名稱(2) / P1(3) / P2(4) — 取消 width:1% 改 auto，吃掉所有剩餘空間 */
  .match-table th:nth-child(2), .match-table td:nth-child(2),
  .match-table th:nth-child(3), .match-table td:nth-child(3),
  .match-table th:nth-child(4), .match-table td:nth-child(4) { width: auto; white-space: normal; }
  /* match-table 內的 .trunc-inner 改 240px / 340px — 字體放大後同步調整截斷上限 */
  .match-table .trunc-inner { max-width: 240px; }
  .match-table .trunc-inner.wide { max-width: 340px; }
  /* v0.74：放大表格內的 badge / pill / button 等元素，避免字大但 badge 還是 11px */
  .match-table .status-badge { font-size: 13px; padding: 5px 12px; }
  .match-table .pill { font-size: 13px; padding: 3px 10px; }
  .match-table button { font-size: 13px; padding: 6px 12px; }
  .match-table .small { font-size: 12px; }
  .detail-panel { background: #eef1f5; padding: 14px; margin: 8px 0 16px; border-radius: 6px; border: 1px solid #e3e8ef; white-space: pre-wrap; font-family: 'Cascadia Code', Consolas, monospace; font-size: 11px; max-height: 480px; overflow: auto; line-height: 1.5; }

<script type="module">

const firebaseConfig = {

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);

let currentUser = null;
let currentTab = 'overview';
let allUsers = [];
// v0.5: uid → email 快取，供對戰紀錄 P1/P2 欄反查使用
const uidEmailMap = new Map();
function rebuildUidEmailMap() {
  uidEmailMap.clear();
  for (const u of allUsers) {
    if (u.uid && u.email) uidEmailMap.set(u.uid, u.email);
  }
}
// v0.5: 確保 uid→email map 至少嘗試載入過一次（不阻塞房間 tab 渲染）
let _emailMapPrimed = false;
async function primeEmailMap() {
  if (_emailMapPrimed) return;
  // v0.77 修：原本 `_emailMapPrimed = true` 設在 try 外是 fail-fast — 首次 API
  //   失敗（例如 v0.76 之前的 stale token 拿 403）會永久 disable，導致對戰紀錄
  //   永遠顯示「(匿名)」。改為「成功才 set primed；失敗 return 不 set，下次可重試」。
  try {
    // v0.5b: 修 endpoint 為 /api/admin/firebase/users 並處理 pagination
    let pageToken = null;
    const collected = [];  // v0.77: 不污染 global allUsers 直到全部成功
    while (true) {
      const url = '/api/admin/firebase/users' + (pageToken ? '?pageToken=' + encodeURIComponent(pageToken) : '');
      const data = await api(url);
      if (!data || data.error) {
        console.warn('[admin] primeEmailMap fetch failed:', data && data.error, '— 下次 polling 會重試');
        return;  // 不 set primed=true，下次能 retry
      }
      if (Array.isArray(data.users)) collected.push(...data.users);
      pageToken = data.pageToken;
      if (!pageToken) break;
    }
    allUsers = collected;
    _emailMapPrimed = true;
    rebuildUidEmailMap();
    console.log('[admin] primeEmailMap: 載入', allUsers.length, 'users，uidEmailMap.size =', uidEmailMap.size);
    // 若房間表已渲染，重新渲染讓新 email 反映上去
    if (typeof oracleRoomsCache !== 'undefined' && oracleRoomsCache.length > 0) {

      const el = document.getElementById('tab-firebase-rooms');
      if (el && el.innerHTML) renderRoomsTab(el, 'firebase', firebaseRoomsCache);
    }
  } catch (e) {
    console.warn('[admin] primeEmailMap failed', e);
    // 不 set primed=true，下次能 retry
  }
}
let usersPageToken = null;

// ── Card index loader (lazy, fetch from GitHub Pages canonical) ─────
// v4.91：改用 GitHub Pages 絕對 URL，避免 Oracle web/ 落後於主站 push 時
// 卡牌資料庫不同步（M5 卡顯示為 #50265 數字 ID 的 root cause）。
// GitHub Pages 在每次 git push 後自動 deploy，永遠是最新版本。
const CARDS_BASE = 'https://suenz001.github.io/ptcg-tw-sim/cards';
let cardInfoMap = {};
let cardCanonicalMap = new Map();  // v0.83: canonicalKey → [cardId, ...]（同名同效不同版本聚合）
let _cardLoadPromise = null;

// v0.83 canonical key：同名 + 同 supertype/subtype + 同 attacks + 同 abilities + 同 rulesText = 同一張卡
//   不同版本（不同 setCode/collectorNumber/art）會合併為同一個邏輯卡，避免統計重複計算同卡。
function computeCanonicalKey(c) {
  if (!c) return '';
  const attacksKey = (c.attacks || []).map(a =>
    `${a.name || ''}|${a.damage || ''}|${(a.effect || '').slice(0, 150)}`
  ).sort().join('||');
  const abilitiesKey = (c.abilities || []).map(a =>
    `${a.name || ''}|${(a.effect || '').slice(0, 150)}`
  ).sort().join('||');
  const rulesKey = (c.rulesText || '').slice(0, 150);
  // v0.93: name 先 strip 中英括號註解 (例「老大的指令（烏羽）」→「老大的指令」)
  //   讓不同插畫版同名同效卡合併到同一 canonical key.
  const baseName = (c.name || '').replace(/[（(][^）)]*[）)]/g, '').trim();
  return `${c.supertype || ''}|${c.subtype || ''}|${baseName}|A:${attacksKey}|B:${abilitiesKey}|R:${rulesKey}`;
}
async function ensureCardIndex() {
  if (_cardLoadPromise) return _cardLoadPromise;
  _cardLoadPromise = (async () => {
    try {
      const sets = await (await fetch(CARDS_BASE + '/index.json')).json();
      const map = {};
      const canonicalMap = new Map();  // canonicalKey → [cardId, ...]（v0.83 同名同效合併）
      await Promise.all(sets.map(async (s) => {
        try {
          const cards = await (await fetch(CARDS_BASE + '/' + s.code + '.json')).json();
          for (const c of cards) {
            // v0.83 擴充：加 supertype/subtype/pokemonType 供統計分群用 + 預計算 canonicalKey
            const canonicalKey = computeCanonicalKey(c);
            // v0.94: displayName = name strip 括號註解 (「老大的指令（烏羽）」→「老大的指令」)
            const displayName = (c.name || '').replace(/[（(][^）)]*[）)]/g, '').trim() || c.name;
            map[c.id] = {
              name: c.name,
              displayName,
              setCode: c.setCode || s.code,
              collectorNumber: c.collectorNumber || '',
              regulationMark: c.regulationMark || '',
              supertype: c.supertype || '',
              subtype: c.subtype || '',
              pokemonType: c.pokemonType || '',
              isAceSpec: !!(c.tags && c.tags.includes('ACE SPEC')),  // v1.03：ACE SPEC 整副 1 張上限用
              canonicalKey,
            };
            if (!canonicalMap.has(canonicalKey)) canonicalMap.set(canonicalKey, []);
            canonicalMap.get(canonicalKey).push(String(c.id));
          }
        } catch {}
      }));
      // v1.00: M5 JP→TW cardId alias (跟 game src/lib/decks/cardIdMigration.ts 同 table).
      //   舊 matchRecord / 玩家牌組可能存 JP cardId (50220-50300), v5.300 game 已 migrate but
      //   admin 直接讀 raw → cardLabel 顯示 #50285. 加 alias 讓 lookup 走 TW info.
      //   range: 50220-50300 → -31075 → 19145-19225 (81 卡 linear shift)
      for (let jp = 50220; jp <= 50300; jp++) {
        const tw = String(jp - 31075);
        if (map[tw]) map[String(jp)] = map[tw];
      }
      cardCanonicalMap = canonicalMap;
      cardInfoMap = map;
      console.log('[admin] card index loaded:', Object.keys(map).length, 'cards');
    } catch (err) {
      console.error('[admin] card index load failed:', err);
    }
  })();
  return _cardLoadPromise;
}

function cardLabel(cardId, count) {
  const info = cardInfoMap[cardId];
  if (!info) return `#${cardId} × ${count}`;
  const parts = [info.name, info.setCode];
  if (info.collectorNumber) parts.push('· ' + info.collectorNumber);
  if (info.regulationMark) parts.push('· ' + info.regulationMark);
  return parts.join(' ') + ' × ' + count;
}
let oracleRoomsCache = [];
let firebaseRoomsCache = [];
let statusFilter = 'all'; // all | lobby | playing | ended

// Auth state listener
// v0.76: onAuthStateChanged 改 async，每次切 user 都先 force-refresh idToken。
//   理由：firebase SDK 內部偶有 cross-tab anonymous user cache 污染 — currentUser
//   顯示是 admin email 但 cached idToken 還是 anonymous user 的（無 email claim）。
//   force-refresh 強制 Firebase 拿這個 user 的全新 token，避免拿到污染後的 cached token。
onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  _forbiddenAlerted = false;  // v0.3: 換帳號 / 重新登入時 reset
  if (user) {
    // v0.76: 在 showApp 之前 force-refresh，確保第一次 API call 帶到 fresh email claim
    try {
      await user.getIdToken(true);
    } catch (e) {
      console.warn('[admin] init token refresh failed:', e.message);
    }
    document.getElementById('my-email').textContent = user.email || '(無 email)';
    // v0.81 (main v4.985): 設 localStorage flag，告知同 origin 的 game/decks 分頁
    //   不要觸發匿名 sign-in（避免覆蓋 IndexedDB 內 admin user，導致 polling 拿 anonymous token → 403）。
    //   只有 password provider + 有 email 時才設，避免 anonymous 也設此 flag。
    if (user.email && user.providerData && user.providerData.some(p => p.providerId === 'password')) {
      try { localStorage.setItem('ptcg_admin_active', user.email); } catch (e) { /* ignore quota */ }
    }
    showApp();
  } else {
    // v0.81: 登出 / token 失效 → 清掉 flag，game/decks 分頁恢復正常匿名 sign-in
    try { localStorage.removeItem('ptcg_admin_active'); } catch (e) { /* ignore */ }
    showLogin();
  }
});

window.doLogin = async function() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = 'Email + password required'; return; }
  try {
    await signInWithEmailAndPassword(auth, email, password);
    // v0.76: signInWithEmailAndPassword 後立刻 force-refresh 一次 — Firebase 偶有
    //   cached anonymous token 還未隨 sign-in 同步更新的情況。
    //   onAuthStateChanged 的 user.getIdToken(true) 也會跑，這裡是雙保險。
    if (auth.currentUser) {
      try { await auth.currentUser.getIdToken(true); } catch (e) { /* ignore — onAuthStateChanged 會處理 */ }
    }
    // onAuthStateChanged will fire and show app
  } catch (err) {
    errEl.textContent = '登入失敗：' + (err.code || err.message);
  }
};

window.doLogout = async function() {
  await signOut(auth);
};

function showLogin() {
  document.getElementById('login-section').style.display = 'block';
  document.getElementById('app-section').style.display = 'none';
}

function showApp() {
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('app-section').style.display = 'block';
  loadActive();
  // Auto refresh every 30s while tab visible
  // v0.21: 不自動刷新 users / feedback / firebase-rooms tab（內容相對靜態，避免無限循環）
  if (!window._adminInterval) {
    window._adminInterval = setInterval(() => {
      if (document.visibilityState !== 'visible' || !currentUser) return;
      // 只自動刷新動態 tab
      if (currentTab === 'overview' || currentTab === 'oracle-rooms') {
        loadActive();
      }
    }, 30000);
  }
}

// ── API wrapper (Firebase ID token) ──────────────────────────────
let _forbiddenAlerted = false;  // v0.3: 只在第一次 403 跳 alert，避免連環彈窗
// v0.75: 閒置後 polling 偶有 stale idToken → server 回 403 'no email'。
//   修法：401/403 時先 force-refresh token 重試一次，只有 retry 後仍 403 才警報。
async function api(path, options = {}) {
  if (!currentUser) return { error: 'not logged in' };
  async function fetchWithToken(forceRefresh) {
    const idToken = await currentUser.getIdToken(forceRefresh);
    return fetch(path, {
      ...options,
      headers: {
        'Authorization': 'Bearer ' + idToken,
        ...(options.headers || {}),
      },
    });
  }
  try {
    let res = await fetchWithToken(false);
    // v0.75: 401/403 → 先 force-refresh token 重試一次。
    //   stale token 場合 retry 會成功；若 user 真的 sign out / revoke → retry 也會 401/403。
    if (res.status === 401 || res.status === 403) {
      try {
        res = await fetchWithToken(true);
      } catch (refreshErr) {
        // force refresh 失敗（network 斷 / token revoked）— 走原 401/403 處理
        console.warn('[admin] token force-refresh failed:', refreshErr.message);
      }
    }
    if (res.status === 401 || res.status === 403) {
      const text = await res.text();
      console.error('Auth error', res.status, text, '(retried with force-refresh)');
      if (res.status === 403 && !_forbiddenAlerted) {
        _forbiddenAlerted = true;
        // v0.76: 把 token payload decode 出來，讓玩家截圖回報。
        //   常見原因：cross-tab 污染、anonymous user contamination、provider 沒 email claim。
        let tokenDebug = '';
        try {
          const tok = await currentUser.getIdToken(false);
          const parts = tok.split('.');
          if (parts.length === 3) {
            const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
            tokenDebug = '\n\n[Debug] Token claims：'
              + '\n  email: ' + (payload.email || '(none)')
              + '\n  uid: ' + (payload.user_id || payload.sub || '(none)')
              + '\n  provider: ' + (payload.firebase && payload.firebase.sign_in_provider || '(none)')
              + '\n  iat: ' + new Date((payload.iat || 0) * 1000).toLocaleString('zh-TW')
              + '\n  exp: ' + new Date((payload.exp || 0) * 1000).toLocaleString('zh-TW')
              + '\n  client currentUser.email: ' + (currentUser.email || '(none)')
              + '\n  client currentUser.uid: ' + (currentUser.uid || '(none)');
          }
        } catch (e) {
          tokenDebug = '\n\n[Debug] Token decode 失敗：' + e.message;
        }
        alert('您的 email (' + (currentUser.email || '?') + ') 不在 admin 白名單。\n\nServer 訊息：' + text + tokenDebug + '\n\n請聯絡管理員加入白名單，或登出後改用授權帳號登入。');
        // 403 表示 email 不對，直接登出避免後續一直叫
        await doLogout();
      }
      return { error: text };
    }
    if (!res.ok) {
      const text = await res.text();
      return { error: text };
    }
    return await res.json();
  } catch (err) {
    return { error: err.message };
  }
}

// v0.92: Firestore 寫入 audit — 列各 collection 過去 1h / 24h 新增/更新 doc 數
window.runFirestoreAudit = async function() {

      </thead>
      <tbody>${rows}</tbody>
    </table>
    <p class="small" style="color:#888;margin-top:0.5rem">提示：1h 寫入 &gt; 100 的 collection 即元兇。createdAt 計新建、updatedAt 計更新；某 collection 缺對應 timestamp 欄位顯示「err」。</p>

};

function renderRoomsTab(el, source, rooms) {
  const counts = { lobby: 0, playing: 0, ended: 0 };
  for (const r of rooms) counts[r.status] = (counts[r.status] || 0) + 1;
  const filtered = statusFilter === 'all' ? rooms : rooms.filter(r => r.status === statusFilter);
  const sourceLabel = source === 'oracle' ? '🎮 Oracle 對戰' : '🔥 Firebase 對戰';
  // v0.90: Firebase rooms 也可刪 — 解決 zombie ended 房無法清理問題
  const showDelete = true;
  // v5.276: 翻頁 — 50 筆/頁
  const totalPages = Math.max(1, Math.ceil(filtered.length / ROOMS_PAGE_SIZE));
  const curPage = source === 'oracle' ? oracleRoomsPage : firebaseRoomsPage;
  const page = Math.min(Math.max(1, curPage), totalPages);
  if (source === 'oracle') oracleRoomsPage = page; else firebaseRoomsPage = page;
  const start = (page - 1) * ROOMS_PAGE_SIZE;
  const pageRooms = filtered.slice(start, start + ROOMS_PAGE_SIZE);
  const pagerHtml = totalPages > 1 ? `
    <div class="rooms-pager" style="display:flex;gap:0.4rem;align-items:center;justify-content:center;margin:0.6rem 0;flex-wrap:wrap">
      <button class="ghost" onclick="setRoomsPage(1, '${source}')" ${page === 1 ? 'disabled' : ''}>« 第一頁</button>
      <button class="ghost" onclick="setRoomsPage(${page - 1}, '${source}')" ${page === 1 ? 'disabled' : ''}>‹ 上一頁</button>
      <span style="font-size:0.9rem;color:#9bbcef">第 ${page} / ${totalPages} 頁 (共 ${filtered.length} 筆)</span>
      <button class="ghost" onclick="setRoomsPage(${page + 1}, '${source}')" ${page === totalPages ? 'disabled' : ''}>下一頁 ›</button>
      <button class="ghost" onclick="setRoomsPage(${totalPages}, '${source}')" ${page === totalPages ? 'disabled' : ''}>最後一頁 »</button>
      <span style="margin-left:0.4rem;font-size:0.85rem;color:#bbb">跳至：</span>
      <input id="rooms-page-input-${source}" type="number" min="1" max="${totalPages}" value="${page}" style="width:4.5rem;padding:0.2rem 0.3rem;background:#222;color:#eee;border:1px solid #555;border-radius:4px" onkeydown="if(event.key==='Enter')jumpRoomsPage('${source}')" />
      <button class="ghost" onclick="jumpRoomsPage('${source}')">跳頁</button>
    </div>
  ` : '';
  el.innerHTML = `
    <h2>${sourceLabel} <span class="small">(共 ${rooms.length})</span></h2>
    <div class="toolbar">
      <span class="filter-btn ${statusFilter === 'all' ? 'active' : ''}" onclick="setStatusFilter('all', '${source}')">全部 (${rooms.length})</span>
      <span class="filter-btn ${statusFilter === 'playing' ? 'active' : ''}" onclick="setStatusFilter('playing', '${source}')">⚔️ 進行中 (${counts.playing || 0})</span>
      <span class="filter-btn ${statusFilter === 'lobby' ? 'active' : ''}" onclick="setStatusFilter('lobby', '${source}')">🏠 等待中 (${counts.lobby || 0})</span>
      <span class="filter-btn ${statusFilter === 'ended' ? 'active' : ''}" onclick="setStatusFilter('ended', '${source}')">✅ 已結束 (${counts.ended || 0})</span>
      <input class="search-box" placeholder="搜尋 房號 / 玩家名" oninput="filterRoomsBySearch(this.value, '${source}')" />
    </div>
    ${pagerHtml}
    <div class="table-wrap"><table class="match-table"><thead><tr>
      <th>房號</th><th>房間名稱</th><th>P1</th><th>P2</th><th>狀態</th>
      <th>回合</th><th>最後更新</th><th>牌組</th><th>訊息</th><th>觀戰</th>${showDelete ? '<th></th>' : ''}
    </tr></thead><tbody id="${source}-rooms-tbody">
    ${pageRooms.map(r => renderRoomRow(r, source)).join('')}
    </tbody></table></div>
    ${pagerHtml}
  `;
}

// v0.5: Admin 隱身觀戰 — 新分頁開玩家前端，帶 ?spectate=ROOM&admin=1

window.openSpyWindow = function(roomCode, source) {
  // v0.5c: source-aware base URL + base64 admin email token
  //   Oracle build 的 game 頁 (www.ptcg-tw-sim.com) 只能訂 Oracle backend 房間
  //   Firebase build 的 game 頁 (suenz001.github.io) 只能訂 Firestore 房間
  //   admin email 用 base64 編進 URL，game 頁 decode 後比對 ADMIN_EMAILS 白名單。
  //   這樣 game 頁不需要登入 admin 帳號（只在 admin.html 登入即可）。
  if (!currentUser || !currentUser.email) {

  }

    ? 'https://suenz001.github.io/ptcg-tw-sim/game'

// v5.276: 翻頁 state (per source) + PAGE_SIZE
const ROOMS_PAGE_SIZE = 50;
let oracleRoomsPage = 1;
let firebaseRoomsPage = 1;
window.setRoomsPage = function(p, source) {
  if (source === 'oracle') oracleRoomsPage = Math.max(1, p);
  else firebaseRoomsPage = Math.max(1, p);
  if (source === 'oracle') renderRoomsTab(document.getElementById('tab-oracle-rooms'), 'oracle', oracleRoomsCache);
  else renderRoomsTab(document.getElementById('tab-firebase-rooms'), 'firebase', firebaseRoomsCache);
};
window.jumpRoomsPage = function(source) {
  const inp = document.getElementById('rooms-page-input-' + source);
  if (!inp) return;
  const p = parseInt(inp.value, 10);
  if (Number.isFinite(p) && p >= 1) window.setRoomsPage(p, source);
};

window.setStatusFilter = function(s, source) {
  statusFilter = s;
  if (source === 'oracle') oracleRoomsPage = 1;  // v5.276: 切 filter 重置頁碼
  else firebaseRoomsPage = 1;
  if (source === 'oracle') renderRoomsTab(document.getElementById('tab-oracle-rooms'), 'oracle', oracleRoomsCache);
  else renderRoomsTab(document.getElementById('tab-firebase-rooms'), 'firebase', firebaseRoomsCache);
};

window.filterRoomsBySearch = function(q, source) {
  // v5.276: 搜尋也走翻頁 — 完整 re-render (含 pager) 而非只更新 tbody
  if (source === 'oracle') oracleRoomsPage = 1;
  else firebaseRoomsPage = 1;
  const rooms = source === 'oracle' ? oracleRoomsCache : firebaseRoomsCache;
  // 過濾 cache 內 rooms 後重 render. statusFilter + search 都套用.
  const lc = q.toLowerCase();
  const filtered = rooms.filter(r => {
    if (statusFilter !== 'all' && r.status !== statusFilter) return false;
    if (!q) return true;
    if (r._id.toLowerCase().includes(lc)) return true;
    if ((r.roomName || '').toLowerCase().includes(lc)) return true;
    return (r.seats || []).some(s => s?.name && s.name.toLowerCase().includes(lc));
  });
  // tbody-only 更新 (不重 render pager — 搜尋當下不換頁碼避免閃爍)
  document.getElementById(source + '-rooms-tbody').innerHTML = filtered.slice(0, ROOMS_PAGE_SIZE).map(r => renderRoomRow(r, source)).join('');
};

function renderRoomRow(r, source) {
  const updated = r.updatedAt ? new Date(r.updatedAt) : null;
  const ageMin = updated ? Math.round((Date.now() - r.updatedAt) / 60000) : null;
  const updatedStr = updated ? updated.toLocaleString('zh-TW') : '-';
  const p1 = r.seats?.[0];
  const p2 = r.seats?.[1];
  const gs = r.gameStateSummary;
  const winnerIdx = (gs && gs.winner != null) ? gs.winner : null;
  const p1Class = winnerIdx === 0 ? 'winner-cell' : '';
  const p2Class = winnerIdx === 1 ? 'winner-cell' : '';
  // v0.5: 顯示「暱稱 (email)」，匿名玩家無 email 則只顯示暱稱
  // v0.77: 查無 email 時改顯示 uid 前 8 碼方便辨識
  // v0.78: 優先用 server enrich 的 seat.email
  // v0.79: server 認 'anon_*' 為 session-anon provider（client 自產的訪客 id，非 firebase
  //   auth uid），改顯示「🎲 訪客 anon_xxx…」而非誤導的「已刪除」。
  function seatLabel(seat) {
    if (!seat?.uid) return '<span class="small">（空）</span>';
    const nm = escapeHtml(seat.name || '?');
    // (1) server enrich 給了 email — 最準確
    if (seat.email) {
      return nm + '<div class="small" style="color:#7aa3ef;font-size:10px">' + escapeHtml(seat.email) + '</div>';
    }
    // (2) v0.79: session anon (client 自產 anon_xxx，非 firebase auth uid)
    if (seat.provider === 'session-anon') {
      const uidShort = escapeHtml(String(seat.uid).slice(0, 12));
      return nm + '<div class="small" style="color:#9aa3b0;font-size:10px">🎲 訪客 ' + uidShort + '…</div>';
    }
    // (3) server enrich 但這個 user 是真匿名 firebase auth user
    if (seat.isAnonymous === true) {
      const uidShort = escapeHtml(String(seat.uid).slice(0, 8));
      return nm + '<div class="small" style="color:#9aa3b0;font-size:10px">🕶️ 匿名 ' + uidShort + '…</div>';
    }
    // (4) server enrich provider='not-found' — Firebase Auth 真的刪過此 user
    if (seat.provider === 'not-found') {
      const uidShort = escapeHtml(String(seat.uid).slice(0, 8));
      return nm + '<div class="small" style="color:#c87a7a;font-size:10px">⚠️ 已刪除 ' + uidShort + '…</div>';
    }
    // (5) Fallback：server 沒 enrich（舊版 server），用 client uidEmailMap
    const em = uidEmailMap.get(seat.uid);
    if (em) return nm + '<div class="small" style="color:#7aa3ef;font-size:10px">' + escapeHtml(em) + '</div>';
    const uidPrefix = escapeHtml(String(seat.uid).slice(0, 8));
    return nm + '<div class="small" style="color:#9aa3b0;font-size:10px">' + uidPrefix + '… (查無)</div>';
  }
  const p1Name = seatLabel(p1);
  const p2Name = seatLabel(p2);
  const turn = (gs?.turn != null) ? gs.turn : '<span class="small">-</span>';
  // v0.90: Firebase rooms 也可刪
  const showDelete = true;
  // 狀態 badge with icon + Chinese
  let statusBadge;
  if (r.status === 'playing') statusBadge = '<span class="status-badge status-playing">⚔️ 進行中</span>';
  else if (r.status === 'lobby') statusBadge = '<span class="status-badge status-lobby">🏠 等待中</span>';
  else statusBadge = '<span class="status-badge status-ended">✅ 已結束</span>';
  // 訊息按鈕 + 計數 badge
  const msgCount = r.messageCount;
  let msgBtn;
  if (msgCount === undefined) {
    msgBtn = `<button class="btn-msg" onclick="showMessagesModal('${r._id}', '${source}')">💬 訊息</button>`;
  } else if (msgCount === 0) {
    msgBtn = `<button class="btn-msg empty" onclick="showMessagesModal('${r._id}', '${source}')">💬 0</button>`;
  } else {
    msgBtn = `<button class="btn-msg has-msg" onclick="showMessagesModal('${r._id}', '${source}')">💬 ${msgCount}則</button>`;
  }
  // v0.31: 用 trunc-inner div 包住，避免長名字撐爆 row
  const p1FullName = p1?.uid ? (p1.name || '?') : '';
  const p2FullName = p2?.uid ? (p2.name || '?') : '';
  const roomNameFull = r.roomName || '';
  return `
    <tr>
      <td class="mono"><b>${r._id}</b></td>
      <td title="${escapeHtml(roomNameFull)}"><div class="trunc-inner">${escapeHtml(roomNameFull)}</div></td>
      <td class="${p1Class}" title="${escapeHtml(p1FullName)}"><div class="trunc-inner">${p1Name}</div></td>
      <td class="${p2Class}" title="${escapeHtml(p2FullName)}"><div class="trunc-inner">${p2Name}</div></td>
      <td>${statusBadge}</td>
      <td class="num-cell">${turn}</td>
      <td>${updatedStr}${ageMin !== null ? `<div class="small">${ageMin}m ago</div>` : ''}</td>
      <td><button class="btn-deck" onclick="showDeckModal('${r._id}', '${source}')">🃏 牌組</button></td>
      <td>${msgBtn}</td>
      <td>${r.status === 'playing' ? `<button class="btn-deck" style="background:#1976d2;color:#ffffff" onclick="openSpyWindow('${r._id}', '${source}')" title="Admin 隱身觀戰">\ud83d\udd0d 偷看</button>` : '<span class="small">-</span>'}</td>
      ${showDelete ? `<td><button class="tiny danger" onclick="deleteRoomBySource('${r._id}', '${source}')" title="${source === 'firebase' ? '刪除 Firebase 房間（含 messages 子集合）' : '刪除 Oracle 房間'}">刪除</button></td>` : ''}
    </tr>
  `;
}

function escapeHtml(s) {
  return String(s || '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
}

// ── Deck modal (room decks) ──────────────────────────────────────
window.showDeckModal = async function(code, source) {
  // 先彈窗顯示 loading，再等卡片資料 + 房間資料
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal"><h3>🃏 房間 ${code} 的牌組</h3><div class="empty">Loading…</div></div>
    </div>
  `;
  const [room] = await Promise.all([
    api('/api/admin/' + source + '/rooms/' + code).then(d => d?.room),
    ensureCardIndex(),
  ]);
  if (!room) { document.getElementById('modal-container').innerHTML = ''; alert('Room not found'); return; }
  const s0 = room.seats?.[0];

// v0.96: 牌組明細 modal — 從玩家儲存牌組 list 觸發
window.showDeckDetail = async function(deckId) {
  // v0.99: push 當前 modal 到 stack (若有), 關閉時 popModal 回上層
  const _curForStack = document.getElementById('modal-container').innerHTML;
  if (_curForStack && _curForStack.trim()) window._modalStack.push(_curForStack);
  const deck = window._lastPlayerDecks?.[deckId];
  if (!deck) { alert('找不到該牌組'); return; }
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)popModal()">
      <div class="modal" style="min-width:520px;"><h3>🃏 牌組明細</h3><div class="empty">載入卡牌資料中…</div></div>
    </div>`;
  await ensureCardIndex();
  // 排序: 寶可夢→物品→支援者→場地→能量, 同類內 count desc, 同 count 用 name
  const typeRank = (info) => {
    if (!info) return 9;
    if (info.supertype === 'Pokemon') return 1;
    if (info.supertype === 'Trainer') {
      if (info.subtype === 'Supporter') return 3;
      if (info.subtype === 'Stadium') return 4;
      return 2;
    }
    if (info.supertype === 'Energy') return 5;
    return 9;
  };
  const entries = (deck.entries || []).slice().sort((a, b) => {
    const ia = cardInfoMap[a.cardId], ib = cardInfoMap[b.cardId];
    const ra = typeRank(ia), rb = typeRank(ib);
    if (ra !== rb) return ra - rb;
    if (b.count !== a.count) return b.count - a.count;
    return (ia?.name || '').localeCompare(ib?.name || '', 'zh-Hant');
  });
  const totalCards = entries.reduce((s, e) => s + (e.count || 0), 0);
  // v1.00: 改用 cardLabel 統一格式 (同 showMatchDeck 對戰牌組), 玩家可直接複製貼到牌組編輯器匯入
  //   第一行: 「{牌組名}」
  //   第二行: 「共 N 張 / 種類 M」
  //   每張卡: cardLabel(id, count) = 「卡名 setCode · 編號 · 賽季 × N」
  const headerLines = [
    `${deck.name || '(未命名)'}`,
    `共 ${totalCards} 張 / 種類 ${entries.length}`,
  ];
  const cardLines = entries.map(e => cardLabel(e.cardId, e.count));
  const copyText = headerLines.concat(cardLines).join('\n');
  window._lastDeckCopyText = copyText;
  // 預覽用 <pre> 顯示原始文字 (跟複製出的內容一致, 玩家直接 select 也可)
  pushModal(`
    <div class="modal-bg" onclick="if(event.target===this)popModal()">
      <div class="modal" style="min-width:600px; max-width:760px; max-height:88vh; overflow-y:auto;">
        <h3>🃏 牌組明細：${escapeHtml(deck.name || '(未命名)')}</h3>
        <div class="small muted" style="margin-bottom:8px;">共 <b>${totalCards}</b> 張 / 種類 <b>${entries.length}</b> · 更新 ${escapeHtml(String(deck.updatedAt || '-')).slice(0, 19)} · 可貼到牌組編輯器「匯入文字」</div>
        <pre style="background:#f5f5f5; padding:10px; border-radius:4px; font-family:Consolas,Menlo,monospace; font-size:12px; line-height:1.6; max-height:60vh; overflow:auto; white-space:pre-wrap; user-select:text;">${escapeHtml(copyText)}</pre>
        <div style="margin-top:14px; display:flex; gap:8px; justify-content:flex-end;">
          <button onclick="navigator.clipboard.writeText(window._lastDeckCopyText || ''); this.textContent='✅ 已複製'; setTimeout(()=>this.textContent='📋 複製全部',2000);">📋 複製全部</button>
          <button onclick="popModal()">關閉</button>
        </div>
      </div>
    </div>`);
};

// v0.99: modal stack — 跨層 modal (玩家 → 牌組明細 / 對戰牌組) 點關閉回上層

window.pushModal = function(html) {

};

// ── Tab: Users (auto-load all pages, with re-entry guard) ───────
let _loadingUsers = false;
let _usersLoaded = false;  // 已載入過就 cache，不重複載
// v0.32: 排序狀態
let usersSortKey = 'lastSignIn';  // 預設依最後登入時間排序
let usersSortDir = 'desc';         // desc=新到舊, asc=舊到新
async function loadUsers(reset = false) {
  const el = document.getElementById('tab-users');
  // v0.21: re-entry guard 防止 setInterval 自動刷新 + manual click 同時觸發
  if (_loadingUsers) {
    console.log('[admin] loadUsers already in progress, skipping');
    return;
  }
  // v0.21: 已載入過則使用 cache（除非明確要求 reset，但 switchTab 不該強制 reset）
  if (_usersLoaded && !reset && allUsers.length > 0) {
    renderUsers(el);
    return;
  }
  _loadingUsers = true;
  try {
    if (reset || allUsers.length === 0) {
      allUsers = [];
      usersPageToken = null;
      el.innerHTML = '<h2>👤 玩家帳號</h2><div class="empty">Loading…</div>';
    }
    while (true) {
      const url = '/api/admin/firebase/users' + (usersPageToken ? '?pageToken=' + encodeURIComponent(usersPageToken) : '');
      const data = await api(url);
      if (!data || data.error) {
        el.innerHTML = '<h2>👤 玩家帳號</h2><div class="empty">Error: ' + (data?.error || 'unknown') + '</div>';
        return;
      }
      allUsers = allUsers.concat(data.users);
      usersPageToken = data.pageToken;
      if (!usersPageToken) break;
      el.innerHTML = `<h2>👤 玩家帳號</h2><div class="empty">Loading... ${allUsers.length} loaded so far</div>`;
    }
    _usersLoaded = true;
    renderUsers(el);
  } finally {
    _loadingUsers = false;
  }
}

function renderUsers(el) {
  const total = allUsers.length;
  const named = allUsers.filter(u => !u.anonymous).length;
  rebuildUidEmailMap();  // v0.5: users 載入完成 → 更新 email map
  const sorted = sortUsers(allUsers);
  el.innerHTML = `
    <h2>👤 玩家帳號（共 ${total} 個，註冊 ${named}，匿名 ${total - named}）</h2>
    <div class="toolbar">
      <input class="search-box" placeholder="搜尋 email / uid / displayName" oninput="filterUsers(this.value)" />
      <span class="small" style="color:#9aa3b0;">點欄位標題可排序</span>
    </div>
    <div class="table-wrap"><table><thead><tr>
      <th class="sortable" onclick="sortUsersBy('email')">Email${sortArrow('email')}</th>
      <th class="sortable" onclick="sortUsersBy('uid')">UID${sortArrow('uid')}</th>
      <th class="sortable" onclick="sortUsersBy('type')">Type${sortArrow('type')}</th>
      <th class="sortable" onclick="sortUsersBy('lastSignIn')">Last Sign-in${sortArrow('lastSignIn')}</th>
      <th class="sortable" onclick="sortUsersBy('createdAt')">Created${sortArrow('createdAt')}</th>
      <th>Actions</th>
    </tr></thead><tbody id="users-tbody">
    ${renderUsersRows(sorted)}
    </tbody></table></div>
  `;
}

// v0.32: 排序函數
function sortUsers(users) {
  const arr = [...users];
  const dir = usersSortDir === 'asc' ? 1 : -1;
  const cmp = (a, b) => {
    let va, vb;
    if (usersSortKey === 'email') { va = (a.email || '').toLowerCase(); vb = (b.email || '').toLowerCase(); }
    else if (usersSortKey === 'uid') { va = a.uid; vb = b.uid; }
    else if (usersSortKey === 'type') {
      // 排序權重：emailVerified=0, emailUnverified=1, anonymous=2
      const w = (u) => u.anonymous ? 2 : (u.emailVerified ? 0 : 1);
      va = w(a); vb = w(b);
    }
    else if (usersSortKey === 'lastSignIn') { va = a.lastSignIn ? new Date(a.lastSignIn).getTime() : 0; vb = b.lastSignIn ? new Date(b.lastSignIn).getTime() : 0; }
    else if (usersSortKey === 'createdAt') { va = a.createdAt ? new Date(a.createdAt).getTime() : 0; vb = b.createdAt ? new Date(b.createdAt).getTime() : 0; }
    else { va = 0; vb = 0; }
    if (va < vb) return -1 * dir;
    if (va > vb) return 1 * dir;
    return 0;
  };
  return arr.sort(cmp);
}

window.sortUsersBy = function(key) {
  if (usersSortKey === key) {
    usersSortDir = usersSortDir === 'asc' ? 'desc' : 'asc';
  } else {
    usersSortKey = key;
    usersSortDir = 'desc';
  }
  renderUsers(document.getElementById('tab-users'));
};

function sortArrow(key) {
  if (usersSortKey !== key) return '<span class="sort-arrow inactive"> ⇅</span>';
  return '<span class="sort-arrow active"> ' + (usersSortDir === 'asc' ? '↑' : '↓') + '</span>';
}

function renderUsersRows(users) {
  return users.map(u => {
    // v0.32: Type 欄位明確化
    let typeCell;
    if (u.anonymous) {
      typeCell = '<span class="small" title="匿名登入（沒綁 email/password）">匿名</span>';
    } else if (u.emailVerified) {
      typeCell = '<span style="color:#4caf50;" title="已用 email/password 註冊並完成信箱驗證">✓ 已驗證</span>';
    } else {
      typeCell = '<span style="color:#fa6;" title="已用 email/password 註冊但尚未點擊驗證信中的連結">⚠ 信箱未驗證</span>';
    }
    return `
      <tr>
        <td title="${escapeHtml(u.email || '')}"><div class="trunc-inner">${escapeHtml(u.email || '')}${u.email ? '' : '<span class="small">(匿名)</span>'}</div></td>
        <td class="mono small">${u.uid.slice(0, 12)}…</td>
        <td>${typeCell}</td>
        <td class="small">${u.lastSignIn ? new Date(u.lastSignIn).toLocaleString('zh-TW') : '-'}</td>
        <td class="small">${u.createdAt ? new Date(u.createdAt).toLocaleString('zh-TW') : '-'}</td>
        <td><button class="tiny ghost" onclick="viewUserDecks('${u.uid}', '${escapeHtml((u.email || u.uid.slice(0, 8)).replace(/'/g, '&apos;'))}')">查看牌組</button></td>
      </tr>
    `;
  }).join('');
}

window.filterUsers = function(q) {
  const tbody = document.getElementById('users-tbody');
  const lc = q.toLowerCase();
  const filtered = allUsers.filter(u =>
    (u.email && u.email.toLowerCase().includes(lc)) ||
    u.uid.toLowerCase().includes(lc) ||
    (u.displayName && u.displayName.toLowerCase().includes(lc))

  tbody.innerHTML = renderUsersRows(filtered);
};

// ── Tab: Feedback (v0.4 with reply + delete) ─────────────────────
let feedbackList = [];
async function loadFeedback() {
  const el = document.getElementById('tab-feedback');
  el.innerHTML = '<h2>💬 意見回饋</h2><div class="empty">Loading…</div>';
  const data = await api('/api/admin/firebase/feedback');

  feedbackList = data.feedback || [];

function renderFeedback(el) {
  if (!feedbackList.length) { el.innerHTML = '<h2>💬 意見回饋</h2><div class="empty">No feedback</div>'; return; }
  const unreplied = feedbackList.filter(f => !f.reply).length;
  el.innerHTML = `
    <h2>💬 意見回饋（${feedbackList.length}，未回覆 ${unreplied}）</h2>
    <div class="small" style="color:#9aa3b0; margin-bottom:12px;">
      💡 玩家在主站打開意見回饋視窗時，會看到自己提交過的歷史回饋與你在這裡寫的回覆。送出/編輯/刪除回覆會即時同步到玩家端。
    </div>
    <div id="feedback-list">
      ${feedbackList.map(f => renderFeedbackItem(f)).join('')}
    </div>
  `;
}

function renderFeedbackItem(f) {
  const created = f.createdAt ? new Date(f.createdAt).toLocaleString('zh-TW') : '-';
  const replied = f.repliedAt ? new Date(f.repliedAt).toLocaleString('zh-TW') : null;
  const uidShort = (f.uid || f.deviceId || 'unknown').slice(0, 16);
  const deviceShort = (f.deviceId || '').slice(0, 8);
  const hasReply = !!f.reply;
  const userAgent = f.userAgent || '';
  return `
    <div class="feedback-item" data-fbid="${f.id}">
      <div class="feedback-meta">
        📅 <b>${created}</b>
        · <span class="mono small">UID: ${uidShort}…</span>
        ${deviceShort ? ' · <span class="mono small">device: ' + deviceShort + '</span>' : ''}
        ${hasReply ? '<span class="reply-badge">✓ 已回覆</span>' : '<span class="unreply-badge">⏳ 待回覆</span>'}
      </div>
      <div class="feedback-text">${escapeHtml(f.content || f.text || f.message || '')}</div>
      ${userAgent ? `<details class="ua-details"><summary class="small">▶ User Agent</summary><div class="small mono" style="margin-top:4px;color:#7a8898;">${escapeHtml(userAgent)}</div></details>` : ''}

      ${hasReply ? `
        <div class="reply-shown">
          <div class="reply-shown-header">
            💬 你的回覆 <span class="small">${replied || ''} ${f.repliedBy ? '· by ' + escapeHtml(f.repliedBy) : ''}</span>
          </div>
          <div class="reply-shown-text">${escapeHtml(f.reply)}</div>
        </div>
      ` : ''}

      <textarea class="reply-input" id="reply-${f.id}" placeholder="${hasReply ? '編輯回覆內容…' : '輸入回覆內容…'}" rows="3">${hasReply ? escapeHtml(f.reply) : ''}</textarea>

      <div class="feedback-actions">
        ${hasReply ? `<button class="btn-edit-reply" onclick="loadReplyDraft('${f.id}', ${JSON.stringify(f.reply || '').replace(/"/g, '&quot;')})">📝 編輯既有回覆</button>` : ''}
        <button class="btn-submit-reply" id="btn-reply-${f.id}" onclick="submitReply('${f.id}')">${hasReply ? '更新回覆' : '送出回覆'}</button>

      </div>

}

window.submitReply = async function(fbId) {
  const ta = document.getElementById('reply-' + fbId);
  if (!ta) return;
  const reply = ta.value.trim();
  if (!reply) { alert('回覆內容不能空白'); return; }
  const btn = document.getElementById('btn-reply-' + fbId);
  if (btn) { btn.disabled = true; btn.textContent = '送出中…'; }
  const res = await api('/api/admin/firebase/feedbacks/' + fbId + '/reply', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ reply }),
  });
  if (!res || res.error) {
    alert('送出失敗：' + (res?.error || 'unknown'));
    if (btn) { btn.disabled = false; btn.textContent = '送出回覆'; }
    return;
  }
  await loadFeedback();  // 重新拉資料更新顯示
};

window.deleteFeedback = async function(fbId) {

// ══════════════════════════════════════════════════════════════════════════════
// v0.80 Tab: Match Records (對戰歷史) — server v0.9 提供的 GET /api/admin/match-records
//   - 表格顯示：時間 / 房號 / 先攻(綠底=勝者) / 後攻(綠底=勝者) / 結束原因 / 回合 / 時長
//   - 點玩家名字 → modal 顯示這場用的牌組（lazy-load /cards/<set>.json 解析卡名）
//   - email filter（查特定玩家戰績）
//   - 分頁：50 筆 / 頁，按「載入更多」append
// ══════════════════════════════════════════════════════════════════════════════
let matchRecordsCache = [];
let matchRecordsTotal = 0;
let matchRecordsFilter = '';
let matchRecordsModeFilter = 'all';  // v0.82: 'all' | 'online' | 'local'（線上=有 roomCode，本機=無）
let matchRecordsLoading = false;
// v0.91: 真正翻頁取代「載入更多」append 模式
const MATCH_PAGE_SIZE = 50;
let matchRecordsPage = 0;  // 0-indexed; UI 顯示為「第 N+1 頁」
// v0.81: 不再用獨立 cardByIdPool — 共用既有的 cardInfoMap / ensureCardIndex (line 413)

async function loadMatchRecords(reset = false) {
  const el = document.getElementById('tab-matches');
  if (matchRecordsLoading) return;
  matchRecordsLoading = true;
  try {
    if (reset) {
      matchRecordsPage = 0;
      matchRecordsCache = [];
      matchRecordsTotal = 0;
    }
    if (matchRecordsCache.length === 0) {
      el.innerHTML = '<h2>📜 對戰歷史</h2><div class="empty">Loading…</div>';
    }
    // v0.91: 真正翻頁 — skip = page × 50 (取代 cache.length append)
    const params = new URLSearchParams({
      limit: String(MATCH_PAGE_SIZE),
      skip: String(matchRecordsPage * MATCH_PAGE_SIZE),
    });
    if (matchRecordsFilter) params.set('email', matchRecordsFilter);
    if (matchRecordsModeFilter === 'online' || matchRecordsModeFilter === 'local') {
      params.set('mode', matchRecordsModeFilter);
    }
    const data = await api('/api/admin/match-records?' + params.toString());
    if (!data || data.error) {
      el.innerHTML = '<h2>📜 對戰歷史</h2><div class="empty">Error: ' + (data?.error || 'unknown') + '</div>';
      return;
    }
    // v0.91: 直接 replace cache (不 concat) — 一頁 50 筆顯示
    matchRecordsCache = data.records || [];
    matchRecordsTotal = data.total ?? matchRecordsCache.length;
    renderMatchRecords(el);
  } finally {
    matchRecordsLoading = false;
  }
}

// v0.91: 翻頁 helpers
window.gotoMatchPage = function(page) {
  const totalPages = Math.max(1, Math.ceil((matchRecordsTotal || 0) / MATCH_PAGE_SIZE));
  const p = Math.max(0, Math.min(totalPages - 1, page | 0));
  if (p === matchRecordsPage) return;
  matchRecordsPage = p;
  loadMatchRecords(false);
};
window.jumpMatchPage = function(inputEl) {
  const val = parseInt(inputEl?.value ?? '1', 10);
  if (!Number.isFinite(val)) return;
  // 使用者輸入 1-indexed → 內部 0-indexed
  window.gotoMatchPage(val - 1);
};

window.filterMatchRecordsByEmail = function(v) {
  matchRecordsFilter = (v || '').trim();
  matchRecordsCache = [];
  loadMatchRecords(true);
};

// v0.82：mode filter 切換（全部 / 線上 / 本機）
window.setMatchRecordsModeFilter = function(m) {
  if (m !== 'all' && m !== 'online' && m !== 'local') return;
  matchRecordsModeFilter = m;
  matchRecordsCache = [];
  loadMatchRecords(true);
};

// v0.82：刪除單筆對戰紀錄（測試資料清理用）
window.deleteMatchRecord = async function(matchId) {
  if (!matchId) return;
  if (!confirm('確定要刪除這筆對戰紀錄嗎？此動作無法復原。\n\nmatchId: ' + matchId)) return;
  try {
    const res = await api('/api/admin/match-records/' + encodeURIComponent(matchId), { method: 'DELETE' });
    if (!res || res.error) { alert('刪除失敗：' + (res?.error || 'unknown')); return; }
    // 從 cache 移除這筆 → 重新 render（不重打 API）
    const before = matchRecordsCache.length;
    matchRecordsCache = matchRecordsCache.filter(r => r._id !== matchId);
    matchRecordsTotal = Math.max(0, matchRecordsTotal - (before - matchRecordsCache.length));
    renderMatchRecords(document.getElementById('tab-matches'));
  } catch (err) {
    alert('刪除失敗：' + (err?.message || 'unknown'));
  }
};

function fmtMatchTime(ms) {
  if (!ms) return '-';
  const d = new Date(ms);
  return d.toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
}

function fmtMatchDuration(ms) {
  if (!ms || ms < 0) return '-';
  const sec = Math.floor(ms / 1000);
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + ':' + (s < 10 ? '0' + s : s);
}

// v0.91: 翻頁 UI helper
function renderMatchPagination() {
  const total = matchRecordsTotal || 0;
  const pageSize = MATCH_PAGE_SIZE;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  const curPage = matchRecordsPage;
  const curPage1 = curPage + 1;  // 顯示用 1-indexed
  const startN = total === 0 ? 0 : curPage * pageSize + 1;
  const endN = Math.min((curPage + 1) * pageSize, total);

  // 算要顯示哪些頁碼按鈕 (限制 7 個避免太長): 第 1 / 上 N / 當前 / 下 N / 最後
  const pageBtns = [];
  const addBtn = (p, label = null) => {
    const active = p === curPage;
    pageBtns.push(
      '<button onclick="gotoMatchPage(' + p + ')"' +
      (active ? ' style="background:#3a6a3a;color:#fff;border-color:#5aaa5a;"' : ' class="ghost"') +
      '>' + (label || (p + 1)) + '</button>'
    );
  };
  const addEllipsis = () => pageBtns.push('<span style="padding:0 4px;color:#7a8898;">…</span>');

  if (totalPages <= 7) {
    for (let i = 0; i < totalPages; i++) addBtn(i);
  } else {
    addBtn(0);
    if (curPage > 3) addEllipsis();
    const from = Math.max(1, curPage - 2);
    const to = Math.min(totalPages - 2, curPage + 2);
    for (let i = from; i <= to; i++) addBtn(i);
    if (curPage < totalPages - 4) addEllipsis();
    addBtn(totalPages - 1);
  }

  const prevDisabled = curPage === 0 ? 'disabled' : '';
  const nextDisabled = curPage >= totalPages - 1 ? 'disabled' : '';

  return `
    <div style="font-size:0.85rem; color:#9aaaaa; margin-right:10px;">
      第 ${startN}–${endN} 筆 / 共 ${total} 筆 (第 ${curPage1} / ${totalPages} 頁)
    </div>
    <button class="ghost" ${prevDisabled} onclick="gotoMatchPage(${curPage - 1})">‹ 上一頁</button>
    ${pageBtns.join('')}
    <button class="ghost" ${nextDisabled} onclick="gotoMatchPage(${curPage + 1})">下一頁 ›</button>
    <span style="margin-left:10px; font-size:0.85rem;">跳至：</span>
    <input type="number" min="1" max="${totalPages}" value="${curPage1}"
      style="width:60px; padding:4px; background:#1a2630; color:#fff; border:1px solid #3a5a5a; border-radius:4px;"
      onkeydown="if(event.key==='Enter')jumpMatchPage(this)" />
    <button onclick="jumpMatchPage(this.previousElementSibling)">跳頁</button>
  `;
}

    <div class="toolbar">

      <button onclick="filterMatchRecordsByEmail(document.querySelector('#tab-matches .search-box').value)">套用</button>
      <button class="ghost" onclick="filterMatchRecordsByEmail('')">清除</button>
    </div>
    <div class="small" style="margin: 4px 0 12px; color: #7a8898;">點玩家名字 → 看這場用的牌組（勝者綠底）· 🗑 刪除測試紀錄</div>
    ${records.length === 0 ? '<div class="empty">尚無對戰紀錄（符合目前 filter 條件）</div>' : `
      <div class="table-wrap"><table>

// v0.81：showMatchDeck 重設計 — 仿 Oracle 對戰 deck modal 格式
//   - 兩欄並排：先攻 / 後攻
//   - 使用既有 ensureCardIndex / cardLabel infrastructure（保持風格一致）
//   - 讀 cardCounts (v5.006+ 新格式 Record<id,count>) 或 cardIds (v5.005 舊格式 fallback 視為 ×1)
//   - 「📋 複製全部牌組」按鈕 — 把兩邊牌組文字格式 copy to clipboard
window.showMatchDeck = async function(matchId) {
  // v0.99: push 當前 modal 到 stack (若有), 關閉時 popModal 回上層
  const _curForStack = document.getElementById('modal-container').innerHTML;
  if (_curForStack && _curForStack.trim()) window._modalStack.push(_curForStack);
  // v0.95: 支援多來源 — matchRecordsCache (對戰歷史 tab) 或 _playerMatchesById (玩家 modal 點房號)
  let record = matchRecordsCache.find(r => r._id === matchId);
  if (!record && window._playerMatchesById) {
    record = window._playerMatchesById[matchId];
  }
  if (!record) { alert('找不到該場紀錄'); return; }
  // 先彈窗顯示 loading
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)popModal()">
      <div class="modal" style="min-width:520px;"><h3>🃏 對戰牌組</h3><div class="empty">載入卡牌資料中…</div></div>
    </div>`;
  await ensureCardIndex();

  // 從 record.p1/p2 抽出 entries: [{ cardId, count }]，按 count 降序、name asc 排序
  const buildEntries = (player) => {
    if (!player) return [];
    let raw = {};
    if (player.cardCounts && typeof player.cardCounts === 'object' && !Array.isArray(player.cardCounts)) {
      raw = player.cardCounts;
    } else if (Array.isArray(player.cardIds)) {
      // 舊格式 fallback：每張卡視為 1
      for (const id of player.cardIds) raw[String(id)] = 1;
    }
    const entries = Object.entries(raw).map(([cardId, count]) => ({ cardId: String(cardId), count: Number(count) || 0 }));
    // 排序：count 多 → 少，同 count 用 cardLabel 字母排
    entries.sort((a, b) => {
      if (b.count !== a.count) return b.count - a.count;
      const la = cardLabel(a.cardId, 1).toLowerCase();
      const lb = cardLabel(b.cardId, 1).toLowerCase();
      return la.localeCompare(lb, 'zh-Hant');
    });
    return entries;
  };

  const e1 = buildEntries(record.p1);
  const e2 = buildEntries(record.p2);

  // 文字格式（給 copy 用）— 仿 Oracle 對戰 modal 看到的列表格式
  const formatSide = (label, player, entries) => {
    const total = entries.reduce((s, e) => s + e.count, 0);
    const lines = [`${label} — ${player?.name || '?'}`, `共 ${total} 張 / 種類 ${entries.length}`];
    for (const e of entries) lines.push(cardLabel(e.cardId, e.count));
    return lines.join('\n');
  };
  const copyText = formatSide('先攻', record.p1, e1) + '\n\n' + formatSide('後攻', record.p2, e2);
  // 存在 dataset 給複製按鈕用（avoid escape hell）
  window._lastMatchCopyText = copyText;

  // 渲染單側 HTML
  const renderSide = (label, player, entries, win) => {
    const total = entries.reduce((s, e) => s + e.count, 0);
    const emailLine = player?.email ? `<span class="player-email">(${escapeHtml(player.email)})</span>` : '<span class="player-email">(匿名)</span>';
    const winBadge = win ? '<span style="background:#4caf50;color:white;padding:2px 8px;border-radius:4px;font-size:12px;margin-left:6px;">勝</span>' : '';
    if (!entries.length) return `
      <div class="deck-col${win ? ' winner-side' : ''}">
        <h4>${label} — ${escapeHtml(player?.name || '?')} ${emailLine}${winBadge}</h4>
        <div class="empty">無牌組資料</div>
      </div>`;
    return `
      <div class="deck-col${win ? ' winner-side' : ''}">
        <h4>${label} — ${escapeHtml(player.name)} ${emailLine}${winBadge}</h4>
        <div class="small" style="margin-bottom:6px;">共 ${total} 張 / 種類 ${entries.length}</div>
        ${entries.map(e => `<div class="deck-entry">${escapeHtml(cardLabel(e.cardId, e.count))}</div>`).join('')}
      </div>`;
  };

  const p1Win = record.winner === 0;
  const p2Win = record.winner === 1;

  document.getElementById('modal-container').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)popModal()">
      <div class="modal" style="min-width:720px;">
        <h3>🃏 房間 ${escapeHtml(record.roomCode || '-')} 的牌組</h3>
        <div class="deck-grid">
          ${renderSide('先攻', record.p1, e1, p1Win)}
          ${renderSide('後攻', record.p2, e2, p2Win)}
        </div>
        <div style="margin-top:16px; display:flex; justify-content:space-between; align-items:center;">
          <button onclick="copyMatchDeck()">📋 複製全部牌組（文字）</button>
          <button onclick="popModal()">關閉</button>
        </div>
      </div>
    </div>`;
};

// 複製對戰牌組到 clipboard
window.copyMatchDeck = async function() {
  const text = window._lastMatchCopyText || '';
  if (!text) { alert('沒有可複製的內容'); return; }
  try {
    await navigator.clipboard.writeText(text);
    // 簡單的視覺回饋：找到剛按的按鈕暫時改文字
    const btns = document.querySelectorAll('.modal button');
    for (const b of btns) {
      if (b.textContent.includes('複製')) {
        const original = b.textContent;
        b.textContent = '✓ 已複製到剪貼簿';
        setTimeout(() => { b.textContent = original; }, 1500);
        break;
      }
    }
  } catch (err) {
    // fallback: 用舊版 execCommand
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      alert('已複製到剪貼簿（fallback 模式）');
    } catch (e2) {
      alert('複製失敗：' + (err.message || e2.message));
    }
  }
};

// ══════════════════════════════════════════════════════════════════════════════
// v0.83 Phase 2a Tier 1 統計 tab
//   8 sub-sections: 1.1 對戰總覽 / 1.2 先攻後攻勝率 / 1.3 對戰時長 / 1.4 勝因 /
//                   1.5 卡牌使用率 / 1.6 熱門寶可夢+tag / 1.7 熱門訓練家 / 1.8 能量類型
//   data: server /api/admin/stats/overview + /api/admin/stats/cards + /api/admin/cards/tags
// ══════════════════════════════════════════════════════════════════════════════
let statsOverviewCache = null;
let statsCardsCache = null;
let cardTagsCache = {};         // { cardId: ['support', ...] }
let statsLoading = false;
let pokemonFilterMode = 'all';  // 'all' | 'main' | 'support'
let statsMode = 'online';       // v0.83: 全局 mode filter — 預設 '線上' (排除本機測試)
// v0.84 Phase 2b caches
let statsPlayersCache = null;
let statsWinrateCache = null;
let statsHeatmapCache = null;
let statsTrendsCache = null;
let trendsGranularity = 'day';  // 'day' | 'week' | 'month'
let trendsDays = 30;            // 30 | 90 | 365
let winrateFilterMode = 'main';  // v1.07 預設主力打手（'all' | 'main' | 'support'）

async function loadStats(reset = false) {
  if (statsLoading) return;
  statsLoading = true;
  try {
    const el = document.getElementById('tab-stats');
    if (statsOverviewCache && statsCardsCache && !reset) {
      renderStats(el);
      return;
    }
    el.innerHTML = '<h2>📊 統計</h2><div class="empty">Loading… (aggregate matchRecords + 載入卡牌資料，約 5-15 秒)</div>';
    await ensureCardIndex();
    // v0.83 全局 mode filter — 傳給 server，過濾本機測試資料
    const modeQ = (statsMode !== 'all') ? '?mode=' + statsMode : '';
    const cardsQ = (statsMode !== 'all') ? '?mode=' + statsMode + '&limit=500' : '?limit=500';
    // v0.84 Phase 2b 額外 endpoints
    //   players: 排除 AI（玩家排行不算 AI 對手）
    //   winrate: 預設排除 AI（excludeAI=true）
    const playersQ = modeQ + (modeQ ? '&' : '?') + 'excludeAI=true';
    const winrateQ = modeQ + (modeQ ? '&' : '?') + 'minDecks=5';
    const trendsQ = modeQ + (modeQ ? '&' : '?') + 'days=' + trendsDays + '&granularity=' + trendsGranularity;
    const [overview, cards, tags, players, winrate, heatmap, trends] = await Promise.all([
      api('/api/admin/stats/overview' + modeQ),
      api('/api/admin/stats/cards' + cardsQ),
      api('/api/admin/cards/tags'),
      api('/api/admin/stats/players' + playersQ),
      api('/api/admin/stats/cards/winrate' + winrateQ),
      api('/api/admin/stats/heatmap' + modeQ),
      api('/api/admin/stats/trends' + trendsQ),
    ]);
    if (overview?.error) { el.innerHTML = '<h2>📊 統計</h2><div class="empty">Error overview: ' + overview.error + '</div>'; return; }
    if (cards?.error) { el.innerHTML = '<h2>📊 統計</h2><div class="empty">Error cards: ' + cards.error + '</div>'; return; }
    if (tags?.error) console.warn('cardTags load failed:', tags.error);
    if (players?.error) console.warn('players load failed:', players.error);
    if (winrate?.error) console.warn('winrate load failed:', winrate.error);
    if (heatmap?.error) console.warn('heatmap load failed:', heatmap.error);
    if (trends?.error) console.warn('trends load failed:', trends.error);
    statsOverviewCache = overview;
    statsCardsCache = cards;
    cardTagsCache = (tags?.tags) || {};
    statsPlayersCache = players;
    statsWinrateCache = winrate;
    statsHeatmapCache = heatmap;
    statsTrendsCache = trends;
    renderStats(el);
  } finally {
    statsLoading = false;
  }
}

function renderStats(el) {
  if (!statsOverviewCache || !statsCardsCache) return;
  const modeLabel = statsMode === 'online' ? '🌐 線上對戰' : (statsMode === 'local' ? '🏠 本機（含 AI）' : '全部資料');
  el.innerHTML = `
    <h2>📊 統計 <span class="small muted">— ${modeLabel}</span> <button class="ghost" onclick="loadStats(true)">🔄 重新整理</button></h2>
    <div class="toolbar" style="margin-bottom:20px; background:#eaf1fc; border:1px solid #c5d4f0; padding:10px 14px; border-radius:8px;">
      <span style="font-weight:600; color:#1a2332;">資料範圍：</span>

// 1.1 對戰總覽 — 全部模式才顯示 線上/本機 breakdown；filter 時只顯示 vsAI 比例
function renderStatsOverview(s) {
  const t = s.total || {};
  const total = t.all || 0;
  // v1.07：近 24h vs 前 24h（24–48h 前）成長率 — 成長紅、衰退綠
  const cur24 = s.new24h || 0;
  const prev24 = s.new24hPrev || 0;
  let growthHtml = '';
  if (prev24 > 0) {
    const chg = Math.round((cur24 - prev24) / prev24 * 100);
    const color = chg > 0 ? '#e53935' : (chg < 0 ? '#2e7d32' : '#7a8898');
    const arrow = chg > 0 ? '▲' : (chg < 0 ? '▼' : '—');
    growthHtml = `<div style="color:${color}; font-size:12px; margin-top:3px; font-weight:600;">${arrow} ${Math.abs(chg)}% <span class="small muted" style="font-weight:400;">vs 前 24h（${prev24} 場）</span></div>`;
  } else if (cur24 > 0) {
    growthHtml = `<div class="small muted" style="font-size:12px; margin-top:3px;">前 24h 無對戰可比較</div>`;
  }
  return `
    <section class="stats-section">
      <h3>📊 1.1 對戰總覽 <span class="small muted">（資料範圍跟上方選擇器連動）</span></h3>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">總場次</div><div class="stat-value">${total}</div></div>
        <div class="stat-card"><div class="stat-label">近 24h</div><div class="stat-value">${cur24}</div>${growthHtml}</div>
        <div class="stat-card"><div class="stat-label">近 7 天</div><div class="stat-value">${s.new7d || 0}</div></div>
        <div class="stat-card"><div class="stat-label">近 30 天</div><div class="stat-value">${s.new30d || 0}</div></div>
      </div>
    </section>
  `;
}

// 1.2 先攻 vs 後攻勝率（三組 filter）
function renderFirstMover(s) {
  const fm = s.firstMover || {};
  const sub = (label, d) => {
    d = d || {};
    const t = (d.p1Win || 0) + (d.p2Win || 0) + (d.draws || 0);
    if (t === 0) return `<div class="fm-row"><span class="fm-label">${label}</span><span class="muted">（無資料）</span><span></span></div>`;
    const p1Pct = Math.round(d.p1Win / t * 100);
    const p2Pct = Math.round(d.p2Win / t * 100);
    const drawPct = Math.max(0, 100 - p1Pct - p2Pct);
    return `
      <div class="fm-row">
        <div class="fm-label">${label}<div class="small muted">${t} 場</div></div>
        <div class="fm-bars">
          <div class="fm-bar fm-p1" style="width:${p1Pct}%" title="先攻勝 ${d.p1Win} (${p1Pct}%)">${p1Pct > 8 ? p1Pct + '%' : ''}</div>
          <div class="fm-bar fm-p2" style="width:${p2Pct}%" title="後攻勝 ${d.p2Win} (${p2Pct}%)">${p2Pct > 8 ? p2Pct + '%' : ''}</div>
          ${d.draws > 0 ? `<div class="fm-bar fm-draw" style="width:${drawPct}%" title="平局 ${d.draws}">${drawPct > 8 ? drawPct + '%' : ''}</div>` : ''}
        </div>
        <div class="fm-detail">先攻 ${d.p1Win} / 後攻 ${d.p2Win}${d.draws > 0 ? ' / 平 ' + d.draws : ''}</div>
      </div>
    `;
  };
  return `
    <section class="stats-section">
      <h3>👑 1.2 先攻 vs 後攻勝率</h3>
      <div class="fm-table">
        ${sub('全部對戰', fm.all)}
      </div>
    </section>
  `;
}

// 1.3 對戰時長 / 回合數
function renderDurationTurns(s) {
  const fmtMs = (ms) => { if (!ms) return '-'; const sec = Math.floor(ms / 1000); const m = Math.floor(sec / 60); const ss = sec % 60; return m + ':' + (ss < 10 ? '0' + ss : ss); };
  const d = s.duration || {};
  const t = s.turns || {};
  const dh = d.histogram || [];
  const dhMax = Math.max(1, ...dh.map(x => x.count));
  const dhLabels = { 0: '0-5 分', 300000: '5-10 分', 600000: '10-15 分', 900000: '15-20 分', 1200000: '20-25 分', 1500000: '25-30 分', 1800000: '30-40 分', 2400000: '40-50 分', 3000000: '50-60 分' };
  const td = t.distribution || [];
  const tdMax = Math.max(1, ...td.map(x => x.count));
  return `
    <section class="stats-section">
      <h3>⏱ 1.3 對戰時長 / 回合數</h3>
      <div class="stats-row">
        <div class="stats-box">
          <div class="stats-box-title">對戰時長（平均 ${fmtMs(d.avgMs)} / ${d.sampleCount || 0} 場）</div>
          ${dh.map(bin => {
            const label = bin._id === '60+' ? '60+ 分' : (dhLabels[bin._id] || (bin._id + ''));
            const pct = Math.round(bin.count / dhMax * 100);
            return `<div class="histo-row"><span class="histo-lbl">${label}</span><div class="histo-bar" style="width:${pct}%"></div><span class="histo-cnt">${bin.count} 場</span></div>`;
          }).join('')}
        </div>
        <div class="stats-box">
          <div class="stats-box-title">回合數（平均 ${(t.avg || 0).toFixed(1)} 回合 / ${t.sampleCount || 0} 場）</div>
          ${td.map(b => {
            const pct = Math.round(b.count / tdMax * 100);
            return `<div class="histo-row"><span class="histo-lbl">第 ${b._id} 回合結束</span><div class="histo-bar" style="width:${pct}%"></div><span class="histo-cnt">${b.count} 場</span></div>`;
          }).join('')}
        </div>
      </div>
    </section>
  `;
}

// 1.4 勝因分佈
// v0.93: 勝因 normalize — 拿掉玩家名, 統一分類
//   原 winReason 含玩家名稱 (e.g. 「Wilson 取得所有獎勵牌」/「火箭隊的奇樹 沒有可上場的寶可夢」)
//   normalize 後: 「取得所有獎勵牌」/「對手沒有可上場的寶可夢」/「對手抽乾牌庫」 等通用分類
function normalizeWinReason(raw) {
  if (!raw) return '(空)';
  const s = String(raw).trim();
  if (/取得所有獎勵牌/.test(s)) return '🏆 取得所有獎勵牌';
  if (/沒有可上場的寶可夢|沒有寶可夢可上場/.test(s)) return '🚫 對手沒有可上場的寶可夢';
  if (/抽乾牌庫|抽不到牌|牌庫空了/.test(s)) return '🃏 對手抽乾牌庫';
  if (/勝利象徵|特殊勝利條件/.test(s)) return '⭐ 特殊勝利條件 (勝利象徵)';
  if (/投降|認輸/.test(s)) return '🏳️ 對手投降';
  if (/超時|逾時|逾過/.test(s)) return '⏰ 對手超時';
  if (/中途離開|離開房間|斷線|斷開|退出|不在場|disconnect/i.test(s)) return '👋 玩家中途離開';
  return '其他：' + s.slice(0, 30);
}
function renderWinReasons(s) {
  const wrRaw = s.winReasons || [];
  // v0.93: 先 normalize 再二次 group (同 normalized 分類合併)
  const merged = new Map();
  for (const x of wrRaw) {
    const k = normalizeWinReason(x.reason);
    merged.set(k, (merged.get(k) || 0) + x.count);
  }
  const wr = [...merged.entries()].map(([reason, count]) => ({ reason, count })).sort((a,b)=>b.count-a.count);
  const total = wr.reduce((sum, x) => sum + x.count, 0);
  if (total === 0) return '<section class="stats-section"><h3>🏁 1.4 勝因分佈</h3><div class="empty">無資料</div></section>';
  const maxCount = wr[0]?.count || 1;
  return `
    <section class="stats-section">
      <h3>🏁 1.4 勝因分佈 <span class="small muted">（共 ${total} 場；同類已合併）</span></h3>
      <div class="stats-box">
        ${wr.slice(0, 15).map(x => {
          const pct = (x.count / total * 100).toFixed(1);
          const barPct = Math.round(x.count / maxCount * 100);
          return `<div class="histo-row" style="grid-template-columns: 280px 1fr 140px;"><span class="histo-lbl">${escapeHtml(x.reason)}</span><div class="histo-bar" style="width:${barPct}%"></div><span class="histo-cnt">${x.count} (${pct}%)</span></div>`;
        }).join('')}
      </div>
    </section>
  `;
}

// v0.83 將 server 回的 raw cardId stats 依 canonicalKey 合併（同名同效不同版本算同一張）
//   注意：deckCount 是各 cardId 的簡單加總，若同副牌組同時收錄兩種版本會 double-count，
//   但實務上極罕見，先接受這個誤差。
function groupCardsByCanonical(cards) {
  const groups = new Map();
  for (const card of (cards || [])) {
    const info = cardInfoMap[card.cardId];
    if (!info?.canonicalKey) continue;
    const key = info.canonicalKey;
    if (!groups.has(key)) {
      groups.set(key, {
        canonicalKey: key,
        repInfo: info,
        repCardId: card.cardId,
        cardIds: [],
        totalCount: 0,
        deckCount: 0,
        variants: 0,
      });
    }
    const g = groups.get(key);
    g.cardIds.push(card.cardId);
    g.totalCount += card.totalCount;
    g.deckCount += card.deckCount;
    g.variants++;
    // 用 deckCount 最多的版本當代表（最常被牌組採用的版本）
    if (card.deckCount > (g.repDeckCount ?? -1)) {
      g.repInfo = info;
      g.repCardId = card.cardId;
      g.repDeckCount = card.deckCount;
    }
  }
  return [...groups.values()].sort((a, b) => b.totalCount - a.totalCount);
}

  if (!groups.length) return '<section class="stats-section"><h3>🃏 1.5 卡牌使用率 Top 30</h3><div class="empty">無資料</div></section>';
  return `
    <section class="stats-section">
      <h3>🃏 1.5 卡牌使用率 Top 30 <span class="small muted">（含全部 supertype；同名同效不同版本合併；已排除基本能量；共 ${c.totalDecks} 副牌組樣本）</span></h3>

          <tbody>

              const name = `${escapeHtml(info.displayName || info.name)}${verBadge} <span class="small muted">${info.setCode}·${info.collectorNumber}${info.regulationMark ? '·' + info.regulationMark : ''}</span>`;

// v1.04：1.6 熱門寶可夢 即時搜尋
let pokemonSearch = '';
let _pokemonGroups = [];
let pokemonPage = 0;
const POKEMON_PAGE_SIZE = 50;
function pokemonFilteredList() {
  const q = (pokemonSearch || '').trim().toLowerCase();
  let list = _pokemonGroups;
  if (q) list = list.filter(g => (((g.repInfo && (g.repInfo.displayName || g.repInfo.name)) || '').toLowerCase().includes(q)));
  return list;
}
function pokemonPagerHtml() {
  const total = pokemonFilteredList().length;
  const maxPage = Math.max(0, Math.ceil(total / POKEMON_PAGE_SIZE) - 1);
  if (pokemonPage > maxPage) pokemonPage = maxPage;
  const from = total === 0 ? 0 : pokemonPage * POKEMON_PAGE_SIZE + 1;
  const to = Math.min(total, (pokemonPage + 1) * POKEMON_PAGE_SIZE);
  return `<div style="display:flex; gap:10px; align-items:center; justify-content:center; margin-top:10px;"><button ${pokemonPage <= 0 ? 'disabled' : ''} onclick="pokemonSetPage(-1)">◀ 上一頁</button><span class="small muted">${from}–${to} / 共 ${total} 隻（第 ${pokemonPage + 1} / ${maxPage + 1} 頁）</span><button ${pokemonPage >= maxPage ? 'disabled' : ''} onclick="pokemonSetPage(1)">下一頁 ▶</button></div>`;
}
window.pokemonSetPage = function(delta) {
  pokemonPage += delta;
  const tb = document.getElementById('pokemon-tbody'); if (tb) tb.innerHTML = topPokemonRowsHtml();
  const pg = document.getElementById('pokemon-pager'); if (pg) pg.innerHTML = pokemonPagerHtml();
};
function topPokemonRowHtml(g, i) {
  const info = g.repInfo;
  const isSupport = g.cardIds.some(id => (cardTagsCache[id] || []).includes('support'));
  const verBadge = g.variants > 1 ? ` <span class="ver-multi" title="${g.cardIds.length} 種版本合併計算">${g.variants} 版本</span>` : '';
  const tagBtn = `<button class="tag-btn ${isSupport ? 'tagged' : ''}" onclick="toggleSupportTag('${escapeHtml(g.repCardId)}')" title="${isSupport ? '取消支援型' : '標為支援型'}">${isSupport ? '⭐ 支援型' : '☆ 標支援型'}</button>`;
  return `<tr><td>${i + 1}</td><td>${escapeHtml(info.displayName || info.name)}${verBadge} <span class="small muted">${info.setCode}·${info.collectorNumber}${info.regulationMark ? '·' + info.regulationMark : ''}</span></td><td><span class="small muted">${info.subtype || ''}</span></td><td>${g.totalCount}</td><td>${g.deckCount}</td><td>${tagBtn}</td></tr>`;
}
function topPokemonRowsHtml() {
  const list = pokemonFilteredList();
  const maxPage = Math.max(0, Math.ceil(list.length / POKEMON_PAGE_SIZE) - 1);
  if (pokemonPage > maxPage) pokemonPage = maxPage;
  if (pokemonPage < 0) pokemonPage = 0;
  const start = pokemonPage * POKEMON_PAGE_SIZE;
  const pageItems = list.slice(start, start + POKEMON_PAGE_SIZE);
  if (pageItems.length === 0) return '<tr><td colspan="6" class="empty" style="text-align:center; padding:18px;">查無符合寶可夢</td></tr>';
  return pageItems.map((g, idx) => topPokemonRowHtml(g, start + idx)).join('');
}
window.filterTopPokemon = function(q) {
  pokemonSearch = q; pokemonPage = 0;
  const tb = document.getElementById('pokemon-tbody'); if (tb) tb.innerHTML = topPokemonRowsHtml();
  const pg = document.getElementById('pokemon-pager'); if (pg) pg.innerHTML = pokemonPagerHtml();
};

// 1.8 能量類型分佈
// v0.93: 基本能量 cardInfo.pokemonType 通常 undefined (game 端 ENERGY_TYPE_MAP 在 client),
//   admin 需用名稱對照. 修前只有特殊能量被歸類, 基本能量全 fallthrough → 顯示空.
const ENERGY_NAME_TO_TYPE = {
  '基本草能量': 'Grass', '基本火能量': 'Fire', '基本水能量': 'Water', '基本雷能量': 'Lightning',
  '基本超能量': 'Psychic', '基本鬥能量': 'Fighting', '基本惡能量': 'Darkness', '基本鋼能量': 'Metal',
  '基本【草】能量': 'Grass', '基本【火】能量': 'Fire', '基本【水】能量': 'Water', '基本【雷】能量': 'Lightning',
  '基本【超】能量': 'Psychic', '基本【鬥】能量': 'Fighting', '基本【惡】能量': 'Darkness', '基本【鋼】能量': 'Metal',
};
function renderEnergyDistribution(c) {
  const energy = (c.cards || []).filter(x => cardInfoMap[x.cardId]?.supertype === 'Energy');
  const basicByType = {};
  let specialTotal = 0, specialDecks = 0;
  for (const e of energy) {
    const info = cardInfoMap[e.cardId];
    if (!info) continue;
    // v0.93: subtype 'Basic' 直接歸基本; 用 pokemonType 或 ENERGY_NAME_TO_TYPE 推 type
    const isBasic = info.subtype === 'Basic';
    const energyType = info.pokemonType || ENERGY_NAME_TO_TYPE[info.name];
    if (isBasic && energyType) {
      if (!basicByType[energyType]) basicByType[energyType] = { totalCount: 0, deckCount: 0 };
      basicByType[energyType].totalCount += e.totalCount;
      basicByType[energyType].deckCount += e.deckCount;
    } else if (info.subtype === 'Special' || info.subtype === 'Special Energy') {
      specialTotal += e.totalCount; specialDecks += e.deckCount;
    } else if (energyType) {
      // 非 Basic / Special 但有 pokemonType → 也歸對應屬性 (寶石能量類型 fallback)
      if (!basicByType[energyType]) basicByType[energyType] = { totalCount: 0, deckCount: 0 };
      basicByType[energyType].totalCount += e.totalCount;
      basicByType[energyType].deckCount += e.deckCount;
    } else {
      // 完全無 type → 歸特殊
      specialTotal += e.totalCount; specialDecks += e.deckCount;
    }
  }
  const TYPE_LABELS = { Grass: '🌿 草', Fire: '🔥 火', Water: '💧 水', Lightning: '⚡ 雷', Psychic: '👻 超', Fighting: '✊ 鬥', Darkness: '🌑 惡', Metal: '⚙️ 鋼', Dragon: '🐲 龍', Fairy: '🧚 妖', Colorless: '⭐ 無' };
  const entries = Object.entries(basicByType).sort((a, b) => b[1].totalCount - a[1].totalCount);
  const maxCount = Math.max(1, ...entries.map(([, v]) => v.totalCount), specialTotal);
  return `
    <section class="stats-section">
      <h3>⚡ 1.8 能量類型分佈</h3>
      <div class="stats-box">
        ${entries.length === 0 && specialTotal === 0 ? '<div class="empty">無能量卡資料</div>' : entries.map(([type, v]) => {
          const pct = Math.round(v.totalCount / maxCount * 100);
          const label = TYPE_LABELS[type] || type;
          return `<div class="histo-row"><span class="histo-lbl">${label}</span><div class="histo-bar" style="width:${pct}%"></div><span class="histo-cnt">${v.totalCount} 張 / ${v.deckCount} 副</span></div>`;
        }).join('')}
        ${specialTotal > 0 ? `<div class="histo-row"><span class="histo-lbl">🌈 特殊能量</span><div class="histo-bar special" style="width:${Math.round(specialTotal/maxCount*100)}%"></div><span class="histo-cnt">${specialTotal} 張 / ${specialDecks} 副</span></div>` : ''}
      </div>
    </section>
  `;
}
