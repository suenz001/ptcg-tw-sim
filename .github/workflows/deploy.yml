name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 ＝ 完整 clone。
      # 預設的 fetch-depth: 1（淺複製）會讓「讀歷史 blob」的守衛在 CI 上拿不到 BASE commit，
      # 於是整段 HEAD-FAIL 斷言被靜默跳過 —— 最惡劣的寫法是 `catch { console.log(); return; }`，
      # 條數不變、無 SKIP 字樣、整體綠燈，那條斷言在 CI 上從來沒有在守（test-v6263 的調查）。
      # 現在 scripts/lib/base-blob.mjs 已經把「讀歷史」收斂成單一入口並會印 SHALLOW-SKIP，
      # 而完整歷史下整條 chain 實測全綠（沙盒共用主樹物件庫＝完整歷史，736/736 全綠），
      # 所以把它打開，讓那批守衛在 CI 上真的跑。
      # ⚠ 改這裡要同步改 test-v6263 的 ⑥（它把現況釘住，讓這個改動必須是刻意的）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # npm#4828 workaround：npm ci 有時漏裝 rollup 平台 optional binary → vite build 快速 fail。強制補裝。
      - run: npm install @rollup/rollup-linux-x64-gnu @esbuild/linux-x64 --no-save --no-package-lock
      # ⭐ Playwright 的瀏覽器：只裝 chromium-headless-shell（約 115MB），不是三個完整瀏覽器。
      #   那 10 支有 PW 段的守衛一律 launch({ channel: 'chromium-headless-shell' })，
      #   裝完整 chromium 是白費 400MB。
      #   ⚠ 快取鍵綁 package-lock.json 的雜湊：playwright 升版 ⇒ 瀏覽器 build 號跟著變 ⇒
      #     鍵自動失效。**不要**把 build 號寫進鍵（那就是 pin 死版本號）。
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: ms-playwright-${{ runner.os }}-
      - name: Install chromium-headless-shell
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Anti-pattern lint (反模式靜態檢查)
        run: node scripts/anti-pattern-lint.mjs
      - name: Coverage report (未實裝/靜默失效卡牌, 資訊性非 gating)
        run: node scripts/coverage-unimplemented.mjs
      # ⭐v6.409：Playwright 過渡期已收尾（兩個平台都實測全綠，依據寫在 scripts/lib/pw.mjs 檔頭）。
      #   這裡原本有兩行過渡期用的 env（把 PW 模式壓成關閉、並放行 ENV-SKIP），
      #   以及下面一個不擋 deploy 的獨立 step；三者連同 pw.mjs 的預設一起改掉了。
      #   ⇒ 主 chain 的 npm test 現在會**真的跑**那 10 支有 PW 段的守衛，紅了就擋 deploy。
      #
      # ⚠⚠ 這段註解**刻意不寫出那兩個環境變數的 YAML 字面**（`名稱: '值'` 的形式）——
      #   test-pw-gate 的 B0 是掃 deploy.yml 找那兩行，雖然它會先剝 `#` 註解，
      #   但 mutcheck 的 M4b 會把「剝註解」這一步拿掉來驗證 B0 不是假綠；
      #   註解裡只要有那個字面，M4b 就會連 B0 一起弄紅。（v6.409 當場踩到。）
      - name: Run engine regression tests
        run: npm test
      - name: Build SvelteKit app
        run: npm run build
        env:
          BASE_PATH: /ptcg-tw-sim
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
