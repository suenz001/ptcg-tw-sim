name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 ＝ 完整 clone。
      # 預設的 fetch-depth: 1（淺複製）會讓「讀歷史 blob」的守衛在 CI 上拿不到 BASE commit，
      # 於是整段 HEAD-FAIL 斷言被靜默跳過 —— 最惡劣的寫法是 `catch { console.log(); return; }`，
      # 條數不變、無 SKIP 字樣、整體綠燈，那條斷言在 CI 上從來沒有在守（test-v6263 的調查）。
      # 現在 scripts/lib/base-blob.mjs 已經把「讀歷史」收斂成單一入口並會印 SHALLOW-SKIP，
      # 而完整歷史下整條 chain 實測全綠（沙盒共用主樹物件庫＝完整歷史，736/736 全綠），
      # 所以把它打開，讓那批守衛在 CI 上真的跑。
      # ⚠ 改這裡要同步改 test-v6263 的 ⑥（它把現況釘住，讓這個改動必須是刻意的）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # npm#4828 workaround：npm ci 有時漏裝 rollup 平台 optional binary → vite build 快速 fail。強制補裝。
      - run: npm install @rollup/rollup-linux-x64-gnu @esbuild/linux-x64 --no-save --no-package-lock
      # ⭐ Playwright 的瀏覽器：只裝 chromium-headless-shell（約 115MB），不是三個完整瀏覽器。
      #   那 10 支有 PW 段的守衛一律 launch({ channel: 'chromium-headless-shell' })，
      #   裝完整 chromium 是白費 400MB。
      #   ⚠ 快取鍵綁 package-lock.json 的雜湊：playwright 升版 ⇒ 瀏覽器 build 號跟著變 ⇒
      #     鍵自動失效。**不要**把 build 號寫進鍵（那就是 pin 死版本號）。
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: ms-playwright-${{ runner.os }}-
      - name: Install chromium-headless-shell
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Anti-pattern lint (反模式靜態檢查)
        run: node scripts/anti-pattern-lint.mjs
      - name: Coverage report (未實裝/靜默失效卡牌, 資訊性非 gating)
        run: node scripts/coverage-unimplemented.mjs
      - name: Run engine regression tests
        env:
          # ⚠⚠ 這三行是**同一組**過渡期把手，要刪就三行一起刪（scripts/test-pw-gate.mjs 在守）。
          #
          #   `PTCG_PW: 'off'` —— 讓那 10 支有 PW 段的守衛走 ENV-SKIP，主 chain 維持
          #   「裝 playwright 之前」的行為。理由：2026-09-19 第一次真的把瀏覽器裝起來跑，
          #   test-v6301 的 375×812 版面量測就紅了（按鈕群最右緣 333.97 vs BASE 356）。
          #   那些紅燈要逐條判「真退化 vs 環境相依（Rule 40 上移判準）」，
          #   在判完之前不能讓它們擋住 deploy。
          #
          #   `PTCG_ALLOW_ENV_SKIP: '1'` —— 因為上面那行會產生 ENV-SKIP，
          #   而 scripts/lib/env-skip.mjs 預設「CI ⇒ ENV-SKIP 直接 throw」。
          #
          # ⭐ 修完那些版面判準之後要做的三件事（三者必須一起）：
          #   ① 刪掉這兩行 env
          #   ② scripts/lib/pw.mjs 的 PW_DEFAULT_MODE 從 'off' 改成 'auto'
          #   ③ 刪掉下面那個 continue-on-error 的獨立 step
          PTCG_PW: 'off'
          PTCG_ALLOW_ENV_SKIP: '1'
        run: npm test
      # ⭐ 過渡期的獨立 step：把那 10 支**真的**跑一遍，結果攤開來看，但不擋 deploy。
      #   ⚠ 這裡**刻意不設** PTCG_ALLOW_ENV_SKIP ⇒ 萬一瀏覽器沒裝成功，
      #     env-skip.mjs 會 throw ⇒ 這個 step 翻紅（被 continue-on-error 承接），
      #     而不是靜默 SKIP 之後假裝有在守。
      - name: Playwright guards (過渡期，不擋 deploy)
        continue-on-error: true
        env:
          PTCG_PW: 'strict'
        run: node scripts/run-pw-guards.mjs
      - name: Build SvelteKit app
        run: npm run build
        env:
          BASE_PATH: /ptcg-tw-sim
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
