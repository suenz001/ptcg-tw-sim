name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Anti-pattern lint (反模式靜態檢查)
        run: node scripts/anti-pattern-lint.mjs
      - name: Coverage report (未實裝/靜默失效卡牌, 資訊性非 gating)
        run: node scripts/coverage-unimplemented.mjs
      - name: Run engine regression tests
        run: npm test
      - name: Build SvelteKit app
        run: npm run build
        env:
          BASE_PATH: /ptcg-tw-sim
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
